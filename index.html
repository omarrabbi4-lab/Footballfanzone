<!DOCTYPE html>
<html lang="bn">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1.0"
>

<meta
  name="theme-color"
  content="#080b14"
>

<title>Live Score ⚽🏏</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:
    radial-gradient(
      circle at top,
      #1b2850 0%,
      #0a0e19 45%,
      #05070c 100%
    );
  color:#fff;
  min-height:100vh;
}

.header{
  text-align:center;
  padding:28px 15px 20px;
}

.logo{
  font-size:32px;
  font-weight:800;
}

.subtitle{
  color:#9da8bd;
  margin-top:8px;
  font-size:14px;
}

.tabs{
  display:flex;
  gap:10px;
  padding:10px 15px;
  max-width:720px;
  margin:auto;
}

.tab{
  flex:1;
  border:0;
  padding:15px;
  border-radius:17px;
  background:#131a2a;
  color:#aeb8ca;
  font-size:17px;
  font-weight:bold;
}

.tab.active{
  background:
    linear-gradient(
      135deg,
      #6654ff,
      #a13cff
    );
  color:#fff;
  box-shadow:
    0 8px 25px
    rgba(108,70,255,.25);
}

.filters{
  display:flex;
  gap:9px;
  padding:10px 15px 18px;
  overflow-x:auto;
  max-width:720px;
  margin:auto;
}

.filter{
  white-space:nowrap;
  border:1px solid #252e43;
  background:#101624;
  color:#9da8bc;
  padding:10px 17px;
  border-radius:22px;
  font-size:14px;
}

.filter.active{
  border-color:#6574ff;
  background:#202943;
  color:#fff;
}

.container{
  max-width:720px;
  margin:auto;
  padding:0 15px 90px;
}

.status{
  text-align:center;
  color:#9ca8bd;
  padding:25px 10px;
}

.card{
  background:rgba(17,23,37,.96);
  border:1px solid #273047;
  border-radius:19px;
  padding:16px;
  margin-bottom:13px;
  box-shadow:
    0 10px 30px
    rgba(0,0,0,.22);
}

.competition{
  display:flex;
  align-items:center;
  gap:8px;
  color:#a6b0c3;
  font-size:13px;
  margin-bottom:15px;
}

.competition img{
  width:22px;
  height:22px;
  object-fit:contain;
}

.match{
  display:grid;
  grid-template-columns:1fr 90px 1fr;
  align-items:center;
  gap:8px;
}

.team{
  text-align:center;
}

.team img{
  width:50px;
  height:50px;
  object-fit:contain;
  margin-bottom:8px;
}

.team-name{
  font-size:14px;
  font-weight:bold;
  line-height:1.35;
}

.center{
  text-align:center;
}

.score{
  font-size:23px;
  font-weight:800;
  white-space:nowrap;
}

.match-status{
  display:inline-block;
  margin-top:7px;
  padding:4px 8px;
  border-radius:10px;
  background:#20283b;
  color:#aeb8cc;
  font-size:10px;
}

.match-status.live{
  background:#163d2a;
  color:#43ee91;
}

.match-status.finished{
  color:#b7c0d0;
}

.match-status.upcoming{
  color:#ffd76b;
}

.match-time{
  margin-top:6px;
  color:#78859c;
  font-size:11px;
  line-height:1.4;
}

.empty{
  text-align:center;
  color:#8d99ad;
  padding:50px 15px;
}

.empty-icon{
  font-size:45px;
  margin-bottom:12px;
}

.error{
  text-align:center;
  color:#ff7185;
  padding:35px 10px;
}

.refresh{
  position:fixed;
  right:20px;
  bottom:20px;
  width:58px;
  height:58px;
  border:0;
  border-radius:50%;
  background:
    linear-gradient(
      135deg,
      #6958ff,
      #a23cff
    );
  color:white;
  font-size:25px;
  box-shadow:
    0 8px 25px
    rgba(100,70,255,.4);
}

.loading{
  animation:pulse 1.2s infinite;
}

@keyframes pulse{

  0%{
    opacity:.4;
  }

  50%{
    opacity:1;
  }

  100%{
    opacity:.4;
  }

}

</style>

</head>


<body>


<header class="header">

  <div class="logo">
    ⚡ Live Score
  </div>

  <div class="subtitle">
    Football & Cricket Live Scores
  </div>

</header>


<div class="tabs">

  <button
    id="footballTab"
    class="tab active"
    onclick="changeSport('football')"
  >
    ⚽ Football
  </button>

  <button
    id="cricketTab"
    class="tab"
    onclick="changeSport('cricket')"
  >
    🏏 Cricket
  </button>

</div>


<div class="filters">

  <button
    id="liveFilter"
    class="filter active"
    onclick="changeFilter('live')"
  >
    🔴 Live
  </button>

  <button
    id="upcomingFilter"
    class="filter"
    onclick="changeFilter('upcoming')"
  >
    🕐 Upcoming
  </button>

  <button
    id="finishedFilter"
    class="filter"
    onclick="changeFilter('finished')"
  >
    ✅ Finished
  </button>

</div>


<main class="container">

  <div
    id="status"
    class="status loading"
  >
    স্কোর লোড হচ্ছে...
  </div>

  <div id="matches"></div>

</main>


<button
  class="refresh"
  onclick="loadScores()"
  title="Refresh"
>
  ↻
</button>


<script>


let currentSport = "football";

let currentFilter = "live";


/* =====================================
   SPORT CHANGE
===================================== */

function changeSport(sport){

  currentSport = sport;

  document
    .getElementById("footballTab")
    .classList
    .toggle(
      "active",
      sport === "football"
    );

  document
    .getElementById("cricketTab")
    .classList
    .toggle(
      "active",
      sport === "cricket"
    );

  loadScores();

}


/* =====================================
   FILTER CHANGE
===================================== */

function changeFilter(filter){

  currentFilter = filter;

  document
    .querySelectorAll(".filter")
    .forEach(
      button =>
        button.classList.remove("active")
    );


  if(filter === "live"){

    document
      .getElementById("liveFilter")
      .classList.add("active");

  }


  if(filter === "upcoming"){

    document
      .getElementById("upcomingFilter")
      .classList.add("active");

  }


  if(filter === "finished"){

    document
      .getElementById("finishedFilter")
      .classList.add("active");

  }


  loadScores();

}


/* =====================================
   DATE
===================================== */

function formatDate(date){

  if(!date){
    return "";
  }

  const d = new Date(date);

  if(isNaN(d.getTime())){
    return date;
  }

  return d.toLocaleString(
    "bn-BD",
    {
      day:"numeric",
      month:"short",
      hour:"numeric",
      minute:"2-digit"
    }
  );

}


/* =====================================
   ESCAPE
===================================== */

function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =====================================
   FILTER MATCHES
===================================== */

function filterMatches(matches){

  if(!Array.isArray(matches)){
    return [];
  }


  if(currentFilter === "live"){

    return matches.filter(
      match =>
        String(match.status || "")
          .toLowerCase()
          === "live"
    );

  }


  if(currentFilter === "upcoming"){

    return matches.filter(
      match =>
        String(match.status || "")
          .toLowerCase()
          === "upcoming"
    );

  }


  if(currentFilter === "finished"){

    return matches.filter(
      match =>
        String(match.status || "")
          .toLowerCase()
          === "finished"
    );

  }


  return matches;

}


/* =====================================
   CREATE MATCH CARD
===================================== */

function createMatchCard(match){

  const home =
    match.home || "Home";

  const away =
    match.away || "Away";


  const homeLogo =
    match.home_logo || "";

  const awayLogo =
    match.away_logo || "";


  const homeScore =
    match.home_score ??
    "-";


  const awayScore =
    match.away_score ??
    "-";


  const status =
    String(
      match.status || ""
    ).toLowerCase();


  const statusText =
    match.status_text ||
    "Unknown";


  const competition =
    match.competition ||
    (
      currentSport === "football"
      ? "Football"
      : "Cricket"
    );


  const competitionLogo =
    match.competition_logo ||
    "";


  let statusClass = "";


  if(status === "live"){

    statusClass = "live";

  }

  else if(status === "finished"){

    statusClass = "finished";

  }

  else if(status === "upcoming"){

    statusClass = "upcoming";

  }


  const card =
    document.createElement("div");

  card.className = "card";


  card.innerHTML = `

    <div class="competition">

      ${
        competitionLogo
        ?
        `
        <img
          src="${escapeHTML(competitionLogo)}"
          onerror="this.style.display='none'"
        >
        `
        :
        ""
      }

      <span>
        ${escapeHTML(competition)}
      </span>

    </div>


    <div class="match">


      <div class="team">

        ${
          homeLogo
          ?
          `
          <img
            src="${escapeHTML(homeLogo)}"
            onerror="this.style.display='none'"
          >
          `
          :
          ""
        }

        <div class="team-name">
          ${escapeHTML(home)}
        </div>

      </div>


      <div class="center">

        <div class="score">

          ${escapeHTML(homeScore)}
          -
          ${escapeHTML(awayScore)}

        </div>


        <div
          class="match-status ${statusClass}"
        >

          ${
            status === "live"
            ? "🔴 LIVE"
            : escapeHTML(statusText)
          }

        </div>


        <div class="match-time">

          ${escapeHTML(
            formatDate(match.time)
          )}

        </div>

      </div>


      <div class="team">

        ${
          awayLogo
          ?
          `
          <img
            src="${escapeHTML(awayLogo)}"
            onerror="this.style.display='none'"
          >
          `
          :
          ""
        }

        <div class="team-name">
          ${escapeHTML(away)}
        </div>

      </div>


    </div>

  `;


  return card;

}


/* =====================================
   RENDER
===================================== */

function renderMatches(data){

  const box =
    document.getElementById(
      "matches"
    );


  box.innerHTML = "";


  const allMatches =
    Array.isArray(data.matches)
    ? data.matches
    : [];


  const matches =
    filterMatches(allMatches);


  if(!matches.length){

    let message =
      "এই মুহূর্তে কোনো ম্যাচ নেই।";


    if(currentFilter === "live"){

      message =
        "এই মুহূর্তে কোনো LIVE ম্যাচ নেই।";

    }

    if(currentFilter === "upcoming"){

      message =
        "কোনো Upcoming ম্যাচ পাওয়া যায়নি।";

    }

    if(currentFilter === "finished"){

      message =
        "কোনো Finished ম্যাচ পাওয়া যায়নি।";

    }


    box.innerHTML = `

      <div class="empty">

        <div class="empty-icon">
          📭
        </div>

        ${message}

      </div>

    `;

    return;

  }


  matches.forEach(
    match =>
      box.appendChild(
        createMatchCard(match)
      )
  );

}


/* =====================================
   LOAD API
===================================== */

async function loadScores(){

  const statusBox =
    document.getElementById(
      "status"
    );

  const box =
    document.getElementById(
      "matches"
    );


  statusBox.style.display =
    "block";


  statusBox.textContent =
    currentSport === "football"
    ? "⚽ Football স্কোর লোড হচ্ছে..."
    : "🏏 Cricket স্কোর লোড হচ্ছে...";


  box.innerHTML = "";


  try{

    const response =
      await fetch(
        `/api/${currentSport}`,
        {
          cache:"no-store"
        }
      );


    if(!response.ok){

      throw new Error(
        "HTTP " +
        response.status
      );

    }


    const data =
      await response.json();


    statusBox.style.display =
      "none";


    renderMatches(data);


  }

  catch(error){

    console.error(error);


    statusBox.style.display =
      "none";


    box.innerHTML = `

      <div class="error">

        ⚠️ স্কোর লোড করা যাচ্ছে না।

        <br><br>

        কিছুক্ষণ পর আবার চেষ্টা করুন।

      </div>

    `;

  }

}


/* =====================================
   START
===================================== */

loadScores();


/* =====================================
   AUTO REFRESH
===================================== */

setInterval(
  loadScores,
  30000
);


</script>

</body>

</html>
