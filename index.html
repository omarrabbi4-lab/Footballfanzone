<!DOCTYPE html>
<html lang="bn">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<meta name="theme-color"
content="#080812">

<meta name="mobile-web-app-capable"
content="yes">

<meta name="apple-mobile-web-app-capable"
content="yes">

<title>Football Fan Zone</title>

<style>

/* =========================================
   ROOT
========================================= */

:root{

  --bg:#080812;
  --bg2:#101022;

  --card:rgba(25,25,48,.78);
  --card2:rgba(35,35,65,.9);

  --text:#ffffff;
  --muted:#9b9bb2;

  --primary:#8b5cf6;
  --primary2:#ec4899;

  --green:#22c55e;
  --red:#ef4444;
  --yellow:#facc15;
  --blue:#38bdf8;

  --border:rgba(255,255,255,.08);

  --shadow:
    0 15px 45px rgba(0,0,0,.35);

}

body.light{

  --bg:#f4f5fb;
  --bg2:#ffffff;

  --card:rgba(255,255,255,.9);
  --card2:#ffffff;

  --text:#151525;
  --muted:#6d6d80;

  --border:rgba(0,0,0,.08);

  --shadow:
    0 12px 30px rgba(30,30,80,.12);

}


/* =========================================
   RESET
========================================= */

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{

  font-family:
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  background:
    radial-gradient(
      circle at 10% 0%,
      rgba(139,92,246,.22),
      transparent 35%
    ),
    radial-gradient(
      circle at 100% 20%,
      rgba(236,72,153,.16),
      transparent 35%
    ),
    var(--bg);

  color:var(--text);

  min-height:100vh;

  overflow-x:hidden;

  transition:
    background .3s,
    color .3s;

}


/* =========================================
   APP
========================================= */

.app{

  width:100%;
  max-width:760px;

  margin:auto;

  min-height:100vh;

  padding-bottom:90px;

}


/* =========================================
   HEADER
========================================= */

.header{

  position:sticky;

  top:0;

  z-index:50;

  padding:
    16px
    14px
    12px;

  backdrop-filter:
    blur(22px);

  -webkit-backdrop-filter:
    blur(22px);

  background:
    rgba(8,8,18,.72);

  border-bottom:
    1px solid var(--border);

}

body.light .header{

  background:
    rgba(255,255,255,.75);

}

.header-top{

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:10px;

}

.logo{

  display:flex;

  align-items:center;

  gap:10px;

}

.logo-icon{

  width:44px;
  height:44px;

  border-radius:14px;

  display:flex;

  align-items:center;
  justify-content:center;

  font-size:23px;

  background:
    linear-gradient(
      135deg,
      var(--primary),
      var(--primary2)
    );

  box-shadow:
    0 8px 25px
    rgba(139,92,246,.3);

  animation:
    logoFloat 3s ease-in-out infinite;

}

@keyframes logoFloat{

  0%,100%{
    transform:translateY(0);
  }

  50%{
    transform:translateY(-3px);
  }

}

.logo-text h1{

  font-size:18px;

  font-weight:800;

}

.logo-text span{

  color:var(--muted);

  font-size:11px;

}

.header-actions{

  display:flex;

  gap:7px;

}

.icon-btn{

  width:40px;
  height:40px;

  border:1px solid var(--border);

  background:var(--card);

  color:var(--text);

  border-radius:13px;

  display:flex;

  align-items:center;
  justify-content:center;

  font-size:18px;

  cursor:pointer;

  transition:.25s;

}

.icon-btn:hover{

  transform:
    translateY(-2px)
    scale(1.03);

  border-color:
    rgba(139,92,246,.5);

}

.icon-btn:active{

  transform:scale(.92);

}


/* =========================================
   SEARCH
========================================= */

.search-box{

  margin-top:13px;

  position:relative;

}

.search-box input{

  width:100%;

  height:45px;

  padding:
    0 45px
    0 43px;

  border-radius:14px;

  border:1px solid var(--border);

  outline:none;

  color:var(--text);

  background:var(--card);

  font-size:14px;

}

.search-icon{

  position:absolute;

  left:15px;

  top:13px;

  opacity:.7;

}

.clear-search{

  position:absolute;

  right:12px;

  top:10px;

  border:0;

  background:none;

  color:var(--muted);

  font-size:20px;

  cursor:pointer;

}


/* =========================================
   SPORT TABS
========================================= */

.sport-tabs{

  display:grid;

  grid-template-columns:1fr 1fr;

  gap:8px;

  margin-top:13px;

}

.sport-tab{

  height:45px;

  border-radius:14px;

  border:1px solid var(--border);

  background:var(--card);

  color:var(--muted);

  font-size:14px;

  font-weight:700;

  cursor:pointer;

  transition:.25s;

}

.sport-tab.active{

  color:#fff;

  border-color:transparent;

  background:
    linear-gradient(
      135deg,
      var(--primary),
      var(--primary2)
    );

  box-shadow:
    0 8px 25px
    rgba(139,92,246,.25);

}


/* =========================================
   DATE
========================================= */

.date-row{

  display:flex;

  gap:8px;

  overflow-x:auto;

  padding:
    13px 2px 4px;

  scrollbar-width:none;

}

.date-row::-webkit-scrollbar{
  display:none;
}

.date-chip{

  flex:none;

  padding:
    9px 14px;

  border-radius:12px;

  background:var(--card);

  border:1px solid var(--border);

  color:var(--muted);

  cursor:pointer;

  font-size:12px;

  transition:.25s;

}

.date-chip.active{

  color:#fff;

  background:
    linear-gradient(
      135deg,
      var(--primary),
      var(--primary2)
    );

  border-color:transparent;

}


/* =========================================
   FILTER
========================================= */

.filter-row{

  display:flex;

  gap:7px;

  overflow-x:auto;

  padding:
    10px 2px;

  scrollbar-width:none;

}

.filter-row::-webkit-scrollbar{
  display:none;
}

.filter{

  flex:none;

  border:1px solid var(--border);

  background:var(--card);

  color:var(--muted);

  padding:
    8px 13px;

  border-radius:20px;

  font-size:12px;

  cursor:pointer;

}

.filter.active{

  color:var(--text);

  border-color:
    rgba(139,92,246,.5);

  background:
    rgba(139,92,246,.18);

}


/* =========================================
   STATUS
========================================= */

.status-bar{

  display:flex;

  align-items:center;

  justify-content:space-between;

  color:var(--muted);

  font-size:12px;

  padding:
    4px 2px
    12px;

}

.status-live{

  display:flex;

  align-items:center;

  gap:6px;

}

.live-dot{

  width:7px;
  height:7px;

  background:var(--green);

  border-radius:50%;

  box-shadow:
    0 0 0 0
    rgba(34,197,94,.6);

  animation:
    livePulse 1.5s infinite;

}

@keyframes livePulse{

  70%{
    box-shadow:
      0 0 0 7px
      rgba(34,197,94,0);
  }

}


/* =========================================
   MATCH LIST
========================================= */

.matches{

  padding:
    0 12px;

}

.section-title{

  display:flex;

  align-items:center;

  justify-content:space-between;

  margin:
    5px 0
    10px;

}

.section-title h2{

  font-size:16px;

}

.section-title span{

  color:var(--muted);

  font-size:11px;

}


/* =========================================
   MATCH CARD
========================================= */

.match-card{

  position:relative;

  overflow:hidden;

  margin-bottom:11px;

  border-radius:19px;

  border:1px solid var(--border);

  background:
    linear-gradient(
      145deg,
      var(--card),
      rgba(20,20,40,.55)
    );

  box-shadow:var(--shadow);

  cursor:pointer;

  transition:
    transform .25s,
    border .25s;

  animation:
    cardIn .45s ease both;

}

@keyframes cardIn{

  from{

    opacity:0;

    transform:
      translateY(14px)
      scale(.98);

  }

  to{

    opacity:1;

    transform:
      translateY(0)
      scale(1);

  }

}

.match-card:hover{

  transform:translateY(-2px);

  border-color:
    rgba(139,92,246,.35);

}

.match-card.live-card{

  border-color:
    rgba(34,197,94,.3);

}

.match-card.live-card::before{

  content:"";

  position:absolute;

  left:0;
  top:0;

  width:100%;
  height:2px;

  background:
    linear-gradient(
      90deg,
      transparent,
      var(--green),
      transparent
    );

  animation:
    liveLine 2s infinite;

}

@keyframes liveLine{

  0%{
    transform:translateX(-100%);
  }

  100%{
    transform:translateX(100%);
  }

}

.card-top{

  display:flex;

  align-items:center;

  justify-content:space-between;

  padding:
    12px 13px 5px;

}

.competition{

  display:flex;

  align-items:center;

  gap:6px;

  color:var(--muted);

  font-size:10px;

}

.competition img{

  width:18px;
  height:18px;

  object-fit:contain;

}

.status{

  font-size:10px;

  padding:
    4px 8px;

  border-radius:20px;

  background:
    rgba(255,255,255,.06);

  color:var(--muted);

}

.status.live{

  color:#fff;

  background:
    rgba(34,197,94,.16);

}

.status.finished{

  color:var(--muted);

}

.status.upcoming{

  color:var(--blue);

  background:
    rgba(56,189,248,.12);

}

.teams{

  display:grid;

  grid-template-columns:
    1fr
    70px
    1fr;

  align-items:center;

  padding:
    12px 14px 16px;

}

.team{

  display:flex;

  flex-direction:column;

  align-items:center;

  gap:7px;

  text-align:center;

}

.team.away{

  flex-direction:column;

}

.team-logo{

  width:46px;
  height:46px;

  object-fit:contain;

  border-radius:50%;

  background:
    rgba(255,255,255,.05);

  padding:4px;

}

.team-name{

  font-size:12px;

  line-height:1.3;

  max-width:115px;

}

.score-box{

  text-align:center;

}

.score{

  font-size:25px;

  font-weight:900;

  letter-spacing:1px;

}

.score-dash{

  color:var(--muted);

  font-weight:500;

}

.match-time{

  margin-top:3px;

  color:var(--muted);

  font-size:10px;

}

.favorite-btn{

  position:absolute;

  right:9px;
  bottom:9px;

  width:30px;
  height:30px;

  border-radius:50%;

  border:1px solid var(--border);

  background:
    rgba(0,0,0,.15);

  color:var(--muted);

  cursor:pointer;

}

.favorite-btn.active{

  color:#facc15;

  background:
    rgba(250,204,21,.1);

}


/* =========================================
   EMPTY / LOADING
========================================= */

.loading{

  display:flex;

  flex-direction:column;

  align-items:center;

  justify-content:center;

  min-height:260px;

  color:var(--muted);

}

.loader{

  width:38px;
  height:38px;

  border-radius:50%;

  border:
    3px solid
    rgba(139,92,246,.15);

  border-top-color:
    var(--primary);

  animation:
    spin .8s linear infinite;

  margin-bottom:13px;

}

@keyframes spin{

  to{
    transform:rotate(360deg);
  }

}

.empty{

  text-align:center;

  padding:60px 20px;

  color:var(--muted);

}

.empty-icon{

  font-size:45px;

  margin-bottom:12px;

  animation:
    emptyFloat 2.5s infinite;

}

@keyframes emptyFloat{

  50%{
    transform:translateY(-7px);
  }

}

.error-box{

  margin:20px 0;

  padding:22px;

  border-radius:18px;

  text-align:center;

  background:
    rgba(239,68,68,.08);

  border:
    1px solid
    rgba(239,68,68,.18);

}

.retry-btn{

  margin-top:14px;

  padding:
    10px 17px;

  border:0;

  border-radius:12px;

  color:#fff;

  background:
    linear-gradient(
      135deg,
      var(--primary),
      var(--primary2)
    );

  cursor:pointer;

}


/* =========================================
   BOTTOM NAV
========================================= */

.bottom-nav{

  position:fixed;

  left:50%;

  bottom:10px;

  transform:translateX(-50%);

  width:
    min(
      calc(100% - 22px),
      600px
    );

  z-index:60;

  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  padding:7px;

  border:
    1px solid var(--border);

  border-radius:20px;

  background:
    rgba(15,15,30,.82);

  backdrop-filter:
    blur(20px);

  -webkit-backdrop-filter:
    blur(20px);

  box-shadow:
    0 15px 40px
    rgba(0,0,0,.35);

}

body.light .bottom-nav{

  background:
    rgba(255,255,255,.82);

}

.nav-btn{

  border:0;

  background:none;

  color:var(--muted);

  padding:8px;

  border-radius:15px;

  cursor:pointer;

  font-size:11px;

}

.nav-btn span{

  display:block;

  font-size:19px;

  margin-bottom:2px;

}

.nav-btn.active{

  color:var(--text);

  background:
    rgba(139,92,246,.14);

}


/* =========================================
   MODAL
========================================= */

.modal{

  position:fixed;

  inset:0;

  z-index:100;

  display:none;

  align-items:flex-end;

  justify-content:center;

  background:
    rgba(0,0,0,.7);

  backdrop-filter:
    blur(7px);

}

.modal.show{

  display:flex;

  animation:
    fadeIn .25s ease;

}

@keyframes fadeIn{

  from{
    opacity:0;
  }

  to{
    opacity:1;
  }

}

.modal-content{

  width:
    min(
      100%,
      760px
    );

  max-height:
    92vh;

  overflow-y:auto;

  border-radius:
    27px 27px 0 0;

  background:
    linear-gradient(
      145deg,
      var(--bg2),
      var(--bg)
    );

  animation:
    modalUp .3s ease;

}

@keyframes modalUp{

  from{
    transform:translateY(100%);
  }

  to{
    transform:translateY(0);
  }

}

.modal-header{

  position:sticky;

  top:0;

  z-index:5;

  display:flex;

  align-items:center;

  justify-content:space-between;

  padding:
    14px 16px;

  background:
    rgba(10,10,20,.82);

  backdrop-filter:
    blur(15px);

  border-bottom:
    1px solid var(--border);

}

body.light .modal-header{

  background:
    rgba(255,255,255,.85);

}

.modal-title{

  font-size:15px;

  font-weight:800;

}

.close-btn{

  width:36px;
  height:36px;

  border:0;

  border-radius:12px;

  background:var(--card);

  color:var(--text);

  font-size:20px;

  cursor:pointer;

}

.detail{

  padding:15px;

}


/* =========================================
   DETAIL SCORE
========================================= */

.detail-score{

  padding:20px 12px;

  border-radius:22px;

  background:
    linear-gradient(
      145deg,
      rgba(139,92,246,.12),
      rgba(236,72,153,.08)
    );

  border:
    1px solid var(--border);

}

.detail-teams{

  display:grid;

  grid-template-columns:
    1fr
    110px
    1fr;

  align-items:center;

}

.detail-team{

  text-align:center;

}

.detail-team img{

  width:60px;
  height:60px;

  object-fit:contain;

  margin-bottom:8px;

}

.detail-team-name{

  font-weight:700;

  font-size:13px;

}

.detail-score-number{

  text-align:center;

  font-size:35px;

  font-weight:900;

}

.detail-status{

  text-align:center;

  margin-top:7px;

  font-size:11px;

  color:var(--muted);

}

.ht-score{

  text-align:center;

  margin-top:9px;

  font-size:11px;

  color:var(--muted);

}


/* =========================================
   DETAIL SECTION
========================================= */

.detail-section{

  margin-top:14px;

  border-radius:18px;

  padding:15px;

  background:var(--card);

  border:1px solid var(--border);

}

.detail-section h3{

  font-size:14px;

  margin-bottom:12px;

  display:flex;

  align-items:center;

  gap:7px;

}


/* =========================================
   INCIDENTS
========================================= */

.incident{

  display:grid;

  grid-template-columns:
    48px
    34px
    1fr;

  align-items:center;

  gap:8px;

  padding:9px 0;

  border-bottom:
    1px solid var(--border);

}

.incident:last-child{
  border-bottom:0;
}

.incident-time{

  font-size:11px;

  color:var(--muted);

  text-align:center;

}

.incident-icon{

  width:30px;
  height:30px;

  border-radius:10px;

  display:flex;

  align-items:center;
  justify-content:center;

  background:
    rgba(255,255,255,.05);

}

.incident.goal .incident-icon{

  background:
    rgba(34,197,94,.14);

}

.incident.card-yellow .incident-icon{

  background:
    rgba(250,204,21,.14);

}

.incident-text{

  font-size:12px;

}

.incident-sub{

  margin-top:2px;

  color:var(--muted);

  font-size:10px;

}


/* =========================================
   LINEUPS
========================================= */

.lineup-grid{

  display:grid;

  grid-template-columns:1fr 1fr;

  gap:10px;

}

.lineup-team{

  padding:10px;

  border-radius:14px;

  background:
    rgba(255,255,255,.03);

}

.lineup-team h4{

  font-size:11px;

  margin-bottom:8px;

  color:var(--muted);

}

.player{

  display:flex;

  align-items:center;

  gap:7px;

  padding:6px 0;

  border-bottom:
    1px solid var(--border);

  font-size:10px;

}

.player:last-child{
  border-bottom:0;
}

.player-number{

  width:22px;
  height:22px;

  display:flex;

  align-items:center;
  justify-content:center;

  border-radius:7px;

  background:
    rgba(139,92,246,.13);

  color:var(--primary);

  font-size:9px;

}

.captain{

  color:#facc15;

}

.formation{

  font-size:10px;

  color:var(--muted);

  margin-bottom:7px;

}


/* =========================================
   STATS
========================================= */

.stat-row{

  display:grid;

  grid-template-columns:
    1fr 70px 1fr;

  align-items:center;

  gap:8px;

  padding:8px 0;

}

.stat-value{

  font-size:11px;

}

.stat-value.right{

  text-align:right;

}

.stat-name{

  text-align:center;

  color:var(--muted);

  font-size:9px;

}

.stat-bar{

  height:4px;

  border-radius:10px;

  background:
    rgba(255,255,255,.07);

  overflow:hidden;

}

.stat-fill{

  height:100%;

  background:
    linear-gradient(
      90deg,
      var(--primary),
      var(--primary2)
    );

}


/* =========================================
   GENERIC DATA
========================================= */

.data-grid{

  display:grid;

  grid-template-columns:
    repeat(2,1fr);

  gap:8px;

}

.data-item{

  padding:10px;

  border-radius:12px;

  background:
    rgba(255,255,255,.04);

}

.data-label{

  font-size:9px;

  color:var(--muted);

}

.data-value{

  margin-top:3px;

  font-size:12px;

  font-weight:700;

  word-break:break-word;

}


/* =========================================
   LOADING DETAIL
========================================= */

.loading-box{

  text-align:center;

  padding:55px 20px;

  color:var(--muted);

}

.loading-box .loader{

  margin:
    0 auto
    13px;

}


/* =========================================
   DETAIL ERROR
========================================= */

.detail-error{

  text-align:center;

  padding:55px 20px;

  color:var(--muted);

}

.error-icon{

  font-size:42px;

  margin-bottom:10px;

}

.detail-error h3{

  color:var(--text);

  font-size:15px;

  margin-bottom:7px;

}

.detail-error button{

  margin-top:17px;

  padding:
    10px 17px;

  border:0;

  border-radius:12px;

  color:#fff;

  background:
    linear-gradient(
      135deg,
      var(--primary),
      var(--primary2)
    );

}


/* =========================================
   TOAST
========================================= */

.toast{

  position:fixed;

  left:50%;

  bottom:85px;

  transform:
    translateX(-50%)
    translateY(20px);

  z-index:200;

  max-width:
    calc(100% - 30px);

  padding:
    11px 16px;

  border-radius:14px;

  background:
    rgba(20,20,35,.94);

  border:
    1px solid var(--border);

  color:#fff;

  font-size:12px;

  opacity:0;

  pointer-events:none;

  transition:.3s;

}

.toast.show{

  opacity:1;

  transform:
    translateX(-50%)
    translateY(0);

}


/* =========================================
   PULSE UPDATE
========================================= */

.score-updated{

    scoreUpdate .7s ease;

}

@keyframes scoreUpdate{

  0%{

  }

  40%{

    color:var(--green);
  }

  100%{

  }

}


/* =========================================

@media(max-width:420px){

}

  class="modal"

     TOAST
===================================== -->

<script>

/* =========================================
   CONFIG
========================================= */

const API_BASE = "";

let currentSport = "cricket";

let selectedDate = getToday();

let currentFilter = "all";

let matches = [];

let filteredMatches = [];

let currentMatch = null;

let refreshTimer = null;

let soundEnabled =
  localStorage.getItem("ffzSound") !== "off";

let theme =
  localStorage.getItem("ffzTheme") || "dark";

let audioContext = null;


/* =========================================
   INIT
========================================= */

document.addEventListener(
  "DOMContentLoaded",
  () => {

    applyTheme();

    updateSoundButton();

    buildDates();

    updateSportUI();

    loadMatches();

    document
      .getElementById("searchInput")
      .addEventListener(
        "input",
        applyFilters
      );

    startAutoRefresh();

  }
);


/* =========================================
   DATE
========================================= */

function getToday(){

  const d = new Date();

  const y =
    d.getFullYear();

  const m =
    String(
      d.getMonth()+1
    ).padStart(2,"0");

  const day =
    String(
      d.getDate()
    ).padStart(2,"0");

  return `${y}-${m}-${day}`;

}


function formatDate(date){

  const d =
    new Date(
      date + "T00:00:00"
    );

  return d.toLocaleDateString(
    "bn-BD",
    {
      day:"numeric",
      month:"short"
    }
  );

}


function buildDates(){

  const row =
    document.getElementById(
      "dateRow"
    );

  row.innerHTML = "";

  const today =
    new Date();

  for(let i=-2;i<=4;i++){

    const d =
      new Date(today);

    d.setDate(
      today.getDate()+i
    );

    const y =
      d.getFullYear();

    const m =
      String(
        d.getMonth()+1
      ).padStart(2,"0");

    const day =
      String(
        d.getDate()
      ).padStart(2,"0");

    const date =
      `${y}-${m}-${day}`;

    const btn =
      document.createElement(
        "button"
      );

    btn.className =
      "date-chip" +
      (
        date === selectedDate
        ? " active"
        : ""
      );

    let label =
      formatDate(date);

    if(i===0){
      label =
        "আজ • " + label;
    }

    if(i===-1){
      label =
        "গতকাল • " + label;
    }

    if(i===1){
      label =
        "আগামীকাল • " + label;
    }

    btn.textContent = label;

    btn.onclick =
      () => {

        selectedDate =
          date;

        buildDates();

        loadMatches();

      };

    row.appendChild(btn);

  }

}


/* =========================================
   SPORT
========================================= */

function changeSport(sport){

  if(currentSport === sport)
    return;

  playSound("click");

  currentSport =
    sport;

  currentFilter =
    "all";

  document
    .querySelectorAll(".filter")
    .forEach(
      x => x.classList.remove("active")
    );

  document
    .querySelector(
      '.filter[data-filter="all"]'
    )
    ?.classList.add("active");

  updateSportUI();

  loadMatches();

}


function updateSportUI(){

  document
    .getElementById("footballTab")
    .classList.toggle(
      "active",
      currentSport === "football"
    );

  document
    .getElementById("cricketTab")
    .classList.toggle(
      "active",
      currentSport === "cricket"
    );

  document
    .getElementById("pageTitle")
    .textContent =
      currentSport === "football"
      ? "⚽ আজকের ফুটবল"
      : "🏏 আজকের ক্রিকেট";

}


/* =========================================
   FILTER
========================================= */

function changeFilter(filter,btn){

  currentFilter =
    filter;

  document
    .querySelectorAll(".filter")
    .forEach(
      x => x.classList.remove("active")
    );

  btn.classList.add("active");

  applyFilters();

}


/* =========================================
   LOAD MATCHES
========================================= */

async function loadMatches(){

  const list =
    document.getElementById(
      "matchList"
    );

  list.innerHTML = `

    <div class="loading">

      <div class="loader"></div>

      <div>
        ${currentSport === "football"
          ? "ফুটবল ম্যাচ লোড হচ্ছে..."
          : "ক্রিকেট ম্যাচ লোড হচ্ছে..."
        }
      </div>

    </div>

  `;


  try{

    const url =
      `${API_BASE}/api/${currentSport}` +
      `?date=${encodeURIComponent(selectedDate)}` +
      `&_=${Date.now()}`;


    const response =
      await fetch(
        url,
        {
          cache:"no-store"
        }
      );


    if(!response.ok){

      throw new Error(
        "HTTP " +
        response.status
      );

    }


    const data =
      await response.json();


    matches =
      normalizeMatches(data);


    applyFilters();


    document
      .getElementById("lastUpdated")
      .textContent =
      new Date()
      .toLocaleTimeString(
        "bn-BD",
        {
          hour:"2-digit",
          minute:"2-digit"
        }
      );


  }catch(error){

    console.error(
      "MATCH API ERROR:",
      error
    );

    list.innerHTML = `

      <div class="error-box">

        <div style="font-size:38px">
          ⚠️
        </div>

        <h3>
          ম্যাচ লোড করা যাচ্ছে না
        </h3>

        <p style="
          color:var(--muted);
          margin-top:7px;
          font-size:12px;
        ">
          API থেকে তথ্য পাওয়া যায়নি।
        </p>

        <button
          class="retry-btn"
          onclick="loadMatches()">

          🔄 আবার চেষ্টা করুন

        </button>

      </div>

    `;

  }

}


/* =========================================
   NORMALIZE
========================================= */

function normalizeMatches(data){

  if(Array.isArray(data))
    return data;

  if(Array.isArray(data?.matches))
    return data.matches;

  if(Array.isArray(data?.data))
    return data.data;

  if(Array.isArray(data?.fixtures))
    return data.fixtures;

  if(Array.isArray(data?.results))
    return data.results;

  return [];

}


/* =========================================
   STATUS
========================================= */

function statusText(match){

  return String(
    match?.status_text ||
    match?.status ||
    match?.state ||
    ""
  ).toLowerCase();

}


function isLive(match){

  const s =
    statusText(match);

  return [
    "live",
    "1h",
    "2h",
    "halftime",
    "half time",
    "in progress",
    "playing",
    "first half",
    "second half",
    "q1",
    "q2",
    "q3",
    "q4"
  ].some(
    x => s.includes(x)
  );

}


function isFinished(match){

  const s =
    statusText(match);

  return [
    "finished",
    "ft",
    "ended",
    "complete",
    "completed",
    "final"
  ].some(
    x => s.includes(x)
  );

}


/* =========================================
   FILTER MATCHES
========================================= */

function applyFilters(){

  const search =
    document
      .getElementById(
        "searchInput"
      )
      .value
      .trim()
      .toLowerCase();


  filteredMatches =
    matches.filter(
      match => {

        const home =
          String(
            match.home ||
            match.home_team ||
            ""
          );

        const away =
          String(
            match.away ||
            match.away_team ||
            ""
          );

        const league =
          String(
            match.competition ||
            match.league ||
            ""
          );


        const text =
          (
            home +
            " " +
            away +
            " " +
            league
          ).toLowerCase();


        if(
          search &&
          !text.includes(search)
        ){
          return false;
        }


        if(
          currentFilter ===
          "live"
        ){
          return isLive(match);
        }


        if(
          currentFilter ===
          "finished"
        ){
          return isFinished(match);
        }


        if(
          currentFilter ===
          "upcoming"
        ){
          return !isLive(match) &&
                 !isFinished(match);
        }


        if(
          currentFilter ===
          "favorites"
        ){
          return isFavorite(match);
        }


        return true;

      }
    );


  renderMatches();

}


/* =========================================
   RENDER MATCHES
========================================= */

function renderMatches(){

  const list =
    document.getElementById(
      "matchList"
    );


  document
    .getElementById(
      "matchCount"
    )
    .textContent =
    `${filteredMatches.length} ম্যাচ`;


  if(
    filteredMatches.length === 0
  ){

    list.innerHTML = `

      <div class="empty">

        <div class="empty-icon">
          ${currentSport === "football"
            ? "⚽"
            : "🏏"
          }
        </div>

        <h3>
          কোনো ম্যাচ পাওয়া যায়নি
        </h3>

        <p style="margin-top:6px">
          অন্য তারিখ বা filter চেষ্টা করুন।
        </p>

      </div>

    `;

    return;

  }


  list.innerHTML =
    filteredMatches
      .map(
        (match,index) =>
          renderMatchCard(
            match,
            index
          )
      )
      .join("");

}


/* =========================================
   MATCH CARD
========================================= */

function renderMatchCard(
  match,
  index
){

  const home =
    escapeHTML(
      match.home ||
      match.home_team ||
      "Home"
    );

  const away =
    escapeHTML(
      match.away ||
      match.away_team ||
      "Away"
    );


  const homeLogo =
    match.home_logo ||
    match.home_image ||
    "";


  const awayLogo =
    match.away_logo ||
    match.away_image ||
    "";


  const competition =
    escapeHTML(
      match.competition ||
      match.league ||
      "Match"
    );


  const compLogo =
    match.competition_logo ||
    match.league_logo ||
    "";


  const homeScore =
    match.home_score ??
    match.homeScore ??
    "-";


  const awayScore =
    match.away_score ??
    match.awayScore ??
    "-";


  const live =
    isLive(match);


  const finished =
    isFinished(match);


  let statusLabel =
    match.status_text ||
    match.status ||
    "";


  if(!statusLabel){

    if(live)
      statusLabel = "LIVE";

    else if(finished)
      statusLabel = "Finished";

    else
      statusLabel = formatMatchTime(
        match
      );

  }


  let statusClass =
    live
    ? "live"
    : finished
      ? "finished"
      : "upcoming";


  const favorite =
    isFavorite(match);


  return `

    <article
      class="match-card
        ${live ? "live-card" : ""}"
      onclick="openMatch(${index})">


      <div class="card-top">

        <div class="competition">

          ${
            compLogo
            ? `
              <img
                src="${safeImage(compLogo)}"
                onerror="this.style.display='none'">
            `
            : ""
          }

          <span>
            ${competition}
          </span>

        </div>


        <div class="status ${statusClass}">

          ${live ? "🔴 " : ""}

          ${escapeHTML(
            String(statusLabel)
          )}

        </div>

      </div>


      <div class="teams">


        <div class="team">

          ${
            homeLogo
            ? `
              <img
                class="team-logo"
                src="${safeImage(homeLogo)}"
                onerror="this.style.display='none'">
            `
            : `
              <div class="team-logo">
                ⚽
              </div>
            `
          }

          <div class="team-name">
            ${home}
          </div>

        </div>


        <div class="score-box">

          <div
            class="score"
            id="score-${index}">

            ${escapeHTML(
              String(homeScore)
            )}

            <span class="score-dash">
              -
            </span>

            ${escapeHTML(
              String(awayScore)
            )}

          </div>


          <div class="match-time">

            ${
              live
              ? "লাইভ চলছে"
              : formatMatchTime(match)
            }

          </div>

        </div>


        <div class="team">

          ${
            awayLogo
            ? `
              <img
                class="team-logo"
                src="${safeImage(awayLogo)}"
                onerror="this.style.display='none'">
            `
            : `
              <div class="team-logo">
                ⚽
              </div>
            `
          }

          <div class="team-name">
            ${away}
          </div>

        </div>


      </div>


      <button
        class="favorite-btn
          ${favorite ? "active" : ""}"
        onclick="
          event.stopPropagation();
          toggleFavorite(event,${index})
        ">

        ${favorite ? "★" : "☆"}

      </button>


    </article>

  `;

}


/* =========================================
   MATCH TIME
========================================= */

function formatMatchTime(match){

  const value =
    match.time ||
    match.date_time ||
    match.start_time ||
    match.datetime;


  if(!value)
    return "--";


  const d =
    new Date(value);


  if(isNaN(d.getTime()))
    return String(value);


  return d.toLocaleTimeString(
    "bn-BD",
    {
      hour:"2-digit",
      minute:"2-digit"
    }
  );

}


/* =========================================
   FAVORITES
========================================= */

function getFavorites(){

  try{

    return JSON.parse(
      localStorage.getItem(
        "ffzFavorites"
      ) || "[]"
    );

  }catch{

    return [];

  }

}


function getFavoriteId(match){

  return String(
    match?.tracker?.id ||
    match?.id ||
    match?.match_id ||
    match?.fixture_id ||
    match?.slug ||
    match?.match_slug ||
    match?.url ||
    (
      (match?.home || "") +
      "_" +
      (match?.away || "")
    )
  );

}


function isFavorite(match){

  return getFavorites()
    .includes(
      getFavoriteId(match)
    );

}


function toggleFavorite(event,index){

  event?.stopPropagation();

  const match =
    filteredMatches[index];

  if(!match)
    return;


  const id =
    getFavoriteId(match);

  let favorites =
    getFavorites();


  if(favorites.includes(id)){

    favorites =
      favorites.filter(
        x => x !== id
      );

    showToast(
      "⭐ Favorite থেকে সরানো হয়েছে"
    );

  }else{

    favorites.push(id);

    playSound("favorite");

    showToast(
      "⭐ Favorite-এ যোগ হয়েছে"
    );

  }


  localStorage.setItem(
    "ffzFavorites",
    JSON.stringify(favorites)
  );


  applyFilters();

}


/* =========================================
   DETAIL SLUG
   IMPORTANT FIX
========================================= */

function getDetailSlug(match){

  if(
    match?.tracker &&
    match.tracker.id
  ){

    return String(
      match.tracker.id
    );

  }


  if(match?.id)
    return String(match.id);


  if(match?.match_id)
    return String(match.match_id);


  if(match?.fixture_id)
    return String(match.fixture_id);


  if(match?.slug)
    return String(match.slug);


  if(match?.match_slug)
    return String(match.match_slug);


  /*
    API কখনো শুধু URL দেয়।

    যেমন:

    /football/match/
    new-mexico-united-vs-fc-tulsa/
    dn1m1ghlp9e2moe/

    এখান থেকে শেষ অংশ:
    dn1m1ghlp9e2moe
  */

  if(match?.url){

    const parts =
      String(
        match.url
      )
      .split("/")
      .filter(Boolean);

    return (
      parts[
        parts.length - 1
      ] || ""
    );

  }


  return "";

}


/* =========================================
   OPEN MATCH
========================================= */

async function openMatch(index){

  const match =
    filteredMatches[index];

  if(!match)
    return;


  currentMatch =
    match;


  const modal =
    document.getElementById(
      "detailModal"
    );


  modal.classList.add(
    "show"
  );


  document.body.style.overflow =
    "hidden";


  const home =
    match.home ||
    match.home_team ||
    "Home";


  const away =
    match.away ||
    match.away_team ||
    "Away";


  document.getElementById(
    "modalTitle"
  ).textContent =
    `${home} vs ${away}`;


  document.getElementById(
    "detailContent"
  ).innerHTML = `

    ${renderDetailSummary(match)}

    <div class="loading-box">

      <div class="loader"></div>

      <p>
        বিস্তারিত তথ্য লোড হচ্ছে...
      </p>

    </div>

  `;


  await loadMatchDetails(
    match
  );

}


/* =========================================
   DETAIL SUMMARY
========================================= */

function renderDetailSummary(match){

  const home =
    escapeHTML(
      match.home ||
      match.home_team ||
      "Home"
    );

  const away =
    escapeHTML(
      match.away ||
      match.away_team ||
      "Away"
    );


  const homeLogo =
    match.home_logo ||
    match.home_image ||
    "";


  const awayLogo =
    match.away_logo ||
    match.away_image ||
    "";


  const homeScore =
    match.home_score ??
    match.homeScore ??
    "-";


  const awayScore =
    match.away_score ??
    match.awayScore ??
    "-";


  const status =
    match.status_text ||
    match.status ||
    "Match";


  const htHome =
    match.home_ht_score ??
    match.home_half_score;

========================================= */

async function loadMatchDetails(match){

  const detailContent =
    document.getElementById(
      "detailContent"
    );


  const slug =
    getDetailSlug(match);


  console.log(
    "DETAIL SLUG:",
    slug
  );


  if(!slug){

    detailContent.innerHTML =
      renderDetailSummary(match) +

      `

      <div class="detail-error">

        <div class="error-icon">
          ⚠️
        </div>

        <h3>
          ম্যাচ ID পাওয়া যায়নি
        </h3>

        <p>
          এই ম্যাচের বিস্তারিত তথ্য
          শনাক্ত করা যাচ্ছে না।
        </p>

      </div>

      `;

    return;

  }


  try{

    const response =
      await fetch(

        `/api/match` +
        `?sport=${encodeURIComponent(currentSport)}` +
        `&slug=${encodeURIComponent(slug)}` +
        `&_=${Date.now()}`,

        {
          cache:"no-store",
          headers:{
            "Accept":
              "application/json"
          }
        }

      );


    if(!response.ok){

      throw new Error(
        "HTTP " +
        response.status
      );

    }


    const data =
      await response.json();


    console.log(
      "DETAIL DATA:",
      data
    );


    const details =
      data?.match ||
      data?.data?.match ||
      data?.data ||
      data;


    if(
      !details ||
      typeof details !== "object"
    ){

      throw new Error(
        "Invalid detail data"
      );

    }


    renderMatchDetails(
      details
    );


  }catch(error){

    console.error(
      "DETAIL ERROR:",
      error
    );


    detailContent.innerHTML =
      renderDetailSummary(match) +

      `

      <div class="detail-error">

        <div class="error-icon">
          ⚠️
        </div>

        <h3>
          বিস্তারিত API তথ্য বর্তমানে পাওয়া যাচ্ছে না।
        </h3>

        <p>
          🔄 কিছুক্ষণ পর আবার চেষ্টা করুন।
        </p>

        <button
          onclick="loadMatchDetails(currentMatch)">

          🔄 আবার চেষ্টা করুন

        </button>

      </div>

      `;

  }

}

/* =========================================
   FOOTBALL DETAILS
========================================= */

function renderFootballDetails(match){

  let html = "";


  /* -----------------------------------------
     RESULT
  ----------------------------------------- */

  const htHome =
    match.home_ht_score;

  const htAway =
    match.away_ht_score;


  if(
    htHome !== undefined ||
    htAway !== undefined
  ){

    html += `

      <div class="detail-section">

        <h3>
          🏆 Match Result
        </h3>

        <div class="data-grid">

          <div class="data-item">

            <div class="data-label">
              Half Time
            </div>

            <div class="data-value">
              ${htHome ?? "-"}
              -
              ${htAway ?? "-"}
            </div>

          </div>


          <div class="data-item">

            <div class="data-label">
              Full Time
            </div>

            <div class="data-value">
              ${match.home_score ?? "-"}
              -
              ${match.away_score ?? "-"}
            </div>

          </div>

        </div>

      </div>

    `;

  }


  /* -----------------------------------------
     INCIDENTS
  ----------------------------------------- */

  const incidents =
    Array.isArray(
      match.incidents
    )
    ? match.incidents
    : [];


  if(incidents.length){

    html += `

      <div class="detail-section">

        <h3>
          ⚡ Match Events
        </h3>

    `;


    incidents
      .forEach(
        incident => {

          const type =
            String(
              incident.type ||
              ""
            );


          const lower =
            type.toLowerCase();


          let icon =
            "•";

          let cls =
            "";


          if(
            incident.is_goal ||
            lower.includes("goal")
          ){

            icon =
              "⚽";

            cls =
              "goal";

          }else if(
            lower.includes("yellow")
          ){

            icon =
              "🟨";

            cls =
              "card-yellow";

          }else if(
            lower.includes("red")
          ){

            icon =
              "🟥";

          }else if(
            incident.is_sub ||
            lower.includes("substitution")
          ){

            icon =
              "🔄";

          }


          const player =
            escapeHTML(
              incident.player ||
              ""
            );


          const inPlayer =
            escapeHTML(
              incident.player_in ||
              ""
            );


          const outPlayer =
            escapeHTML(
              incident.player_out ||
              ""
            );


          let text =
            player ||
            type;


          let sub = "";


          if(
            incident.is_sub
          ){

            text =
              "Substitution";

            sub =
              `${inPlayer || "-"} ← ${outPlayer || "-"}`;

          }


          html += `

            <div class="incident ${cls}">

              <div class="incident-time">

                ${
                  incident.time ??
                  "-"
                }'

              </div>


              <div class="incident-icon">

                ${icon}

              </div>


              <div>

                <div class="incident-text">

                  ${text}

                </div>


                ${
                  sub
                  ? `
                    <div class="incident-sub">
                      ${sub}
                    </div>
                  `
                  : `
                    <div class="incident-sub">
                      ${
                        incident.side === "home"
                        ? match.home || "Home"
                        : incident.side === "away"
                          ? match.away || "Away"
                          : ""
                      }
                    </div>
                  `
                }

              </div>

            </div>

          `;

        }
      );


    html += `
      </div>
    `;

  }


  /* -----------------------------------------
     STATS
  ----------------------------------------- */

  const stats =
    Array.isArray(
      match.stats
    )
    ? match.stats
    : [];


  if(stats.length){

    html += `

      <div class="detail-section">

        <h3>
          📊 Match Stats
        </h3>

    `;


    stats.forEach(
      stat => {

        const name =
          stat.name ||
          stat.type ||
          stat.title ||
          "Stat";


        const home =
          stat.home ??
          stat.home_value ??
          stat.homeValue ??
          "-";


        const away =
          stat.away ??
          stat.away_value ??
          stat.awayValue ??
          "-";


        html += `

          <div class="stat-row">

            <div>

              <div class="stat-value">
                ${escapeHTML(
                  String(home)
                )}
              </div>

            </div>


            <div class="stat-name">

              ${escapeHTML(
                String(name)
              )}

            </div>


            <div>

              <div
                class="stat-value right">

                ${escapeHTML(
                  String(away)
                )}

              </div>

            </div>

          </div>

        `;

      }
    );


    html += `
      </div>
    `;

  }


  /* -----------------------------------------
     LINEUPS
  ----------------------------------------- */

  const lineups =
    match.lineups;


  if(lineups){

    html +=
      renderLineups(
        match,
        lineups
      );

  }


  /* -----------------------------------------
     EXTRA INFORMATION
  ----------------------------------------- */

  const extra = [];

  if(match.competition)
    extra.push([
      "Competition",
      match.competition
    ]);

  if(match.home_formation)
    extra.push([
      "Home Formation",
      match.home_formation
    ]);

  if(match.away_formation)
    extra.push([
      "Away Formation",
      match.away_formation
    ]);

  if(match.tracker?.id)
    extra.push([
      "Match ID",
      match.tracker.id
    ]);


  if(extra.length){

    html += `

      <div class="detail-section">

        <h3>
          ℹ️ Match Information
        </h3>

        <div class="data-grid">

    `;


    extra.forEach(
      item => {

        html += `

          <div class="data-item">

            <div class="data-label">
              ${escapeHTML(
                String(item[0])
              )}
            </div>

            <div class="data-value">
              ${escapeHTML(
                String(item[1])
              )}
            </div>

          </div>

        `;

      }
    );


    html += `
        </div>
      </div>
    `;

  }


  if(
    !incidents.length &&
    !stats.length &&
    !lineups &&
    !extra.length
  ){

    html +=
      renderGenericData(
        match
      );

  }


  return html;

}

function renderCricketDetails(match){

  let html = "";


  const possibleKeys = [

    "score",
    "home_score",
    "away_score",
    "home_runs",
    "away_runs",
    "home_wickets",
    "away_wickets",
    "home_overs",
    "away_overs",
    "result",
    "status_text"

  ];


  const data = [];


  possibleKeys.forEach(
    key => {

      if(
        match[key] !== undefined &&
        match[key] !== null
      ){

        data.push([
          key
            .replaceAll(
              "_",
              " "
            )
            .replace(
              /\b\w/g,
              x =>
                x.toUpperCase()
            ),
          match[key]
        ]);

      }

    }
  );


  if(data.length){

    html += `

      <div class="detail-section">

        <h3>
          🏏 Scorecard
        </h3>

        <div class="data-grid">

    `;


    data.forEach(
      item => {

        html += `

          <div class="data-item">

            <div class="data-label">
              ${escapeHTML(
                String(item[0])
              )}
            </div>

            <div class="data-value">
              ${escapeHTML(
                String(item[1])
              )}
            </div>

          </div>

        `;

      }
    );


    html += `
        </div>
      </div>
    `;

  }


  /*
    যদি API innings / scorecard
    array দেয়
  */

  const innings =
    match.innings ||
    match.scorecard ||
    match.innings_data;


  if(
    Array.isArray(innings) &&
    innings.length
  ){

    html += `

      <div class="detail-section">

        <h3>
          🏏 Innings
        </h3>

    `;


    innings.forEach(
      inning => {

        html += `

          <div
            class="data-item"
            style="margin-bottom:8px">

            <div class="data-label">

              ${
                inning.team ||
                inning.name ||
                "Innings"
              }

            </div>

            <div class="data-value">

              ${
                inning.runs ??
                inning.score ??
                "-"
              }

              /

              ${
                inning.wickets ??
                "-"
              }

              ${
                inning.overs
                ? ` (${inning.overs} ov)`
                : ""
              }

            </div>

          </div>

        `;

      }
    );


    html += `
      </div>
    `;

  }


  if(!data.length){

    html +=
      renderGenericData(
        match
      );

  }


  return html;

}


/* =========================================
   GENERIC DATA
========================================= */

function renderGenericData(data){

  const entries =
    Object.entries(data)
      .filter(
        ([key,value]) => {

          if(
            value === null ||
            value === undefined
          )
            return false;

          if(
            typeof value === "object"
          )
            return false;

          return true;

        }
      )
      .slice(0,20);


  if(!entries.length)
    return "";


  return `

    <div class="detail-section">

      <h3>
        ℹ️ বিস্তারিত তথ্য
      </h3>

      <div class="data-grid">

        ${
          entries
            .map(
              ([key,value]) => `

                <div class="data-item">

                  <div class="data-label">
                    ${escapeHTML(
                      String(key)
                    )}
                  </div>

                  <div class="data-value">
                    ${escapeHTML(
                      String(value)
                    )}
                  </div>

                </div>

              `
            )
            .join("")
        }

      </div>

    </div>

  `;

}

/* =========================================
   SOUND
========================================= */

function initAudio(){

  if(!audioContext){

    try{

      audioContext =
        new (
          window.AudioContext ||
          window.webkitAudioContext
        )();

    }catch{

      return;

    }

  }


  if(
    audioContext.state ===
    "suspended"
  ){

    audioContext.resume()
      .catch(
        () => {}
      );

  }

}


function playSound(type){

  if(!soundEnabled)
    return;


  initAudio();


  if(!audioContext)
    return;


  try{

    const now =
      audioContext.currentTime;


    const oscillator =
      audioContext.createOscillator();


    const gain =
      audioContext.createGain();


    oscillator.connect(
      gain
    );

    gain.connect(
      audioContext.destination
    );


    let frequency =
      520;

    let duration =
      .12;


    if(type === "goal"){

      frequency =
        740;

      duration =
        .35;

    }


    if(type === "favorite"){

      frequency =
        660;

      duration =
        .18;

    }


    oscillator.frequency
      .setValueAtTime(
        frequency,
        now
      );


    oscillator.frequency
      .exponentialRampToValueAtTime(
        frequency * .65,
        now + duration
      );


    gain.gain
      .setValueAtTime(
        .0001,
        now
      );


    gain.gain
      .exponentialRampToValueAtTime(
        .12,
        now + .02
      );


    gain.gain
      .exponentialRampToValueAtTime(
        .0001,
        now + duration
      );


    oscillator.start(now);

    oscillator.stop(
      now + duration
    );

  }catch(error){

    console.log(
      "Sound error:",
      error
    );

  }

}


function toggleSound(){

  soundEnabled =
    !soundEnabled;


  localStorage.setItem(
    "ffzSound",
    soundEnabled
    ? "on"
    : "off"
  );


  updateSoundButton();


  if(soundEnabled){

    playSound("click");

    showToast(

    );

  }else{

    );

  }

}

}

  }

}

      const id =
        getFavoriteId(match);


      const score = {

        home:
          String(
            match.home_score ??
            "-"
          ),

        away:
          String(
            match.away_score ??
            "-"
          )

      };


      const old =
        previousScores[id];


      if(old){

        if(
          old.home !== score.home ||
          old.away !== score.away
        ){

          playSound("goal");

          sendScoreNotification(
            match,
            old,
            score
          );

        }

      }


      previousScores[id] =
        score;

    }
  );

}


/* =========================================
   PERIODIC SCORE CHECK
========================================= */

setInterval(
  () => {

    checkScoreChanges();

  },
  11000
);


/* =========================================
   FAVORITES NAV
========================================= */

function showFavorites(){

  currentFilter =
    "favorites";


  document
    .querySelectorAll(".filter")
    .forEach(
      x => x.classList.remove("active")
    );


  document
    .querySelector(
      '.filter[data-filter="favorites"]'
    )
    ?.classList.add("active");


  applyFilters();

}


function goHome(){

  currentFilter =
    "all";


  document
    .querySelectorAll(".filter")
    .forEach(
      x => x.classList.remove("active")
    );


  document
    .querySelector(
      '.filter[data-filter="all"]'
    )
    ?.classList.add("active");


  applyFilters();

}


/* =========================================
   TOAST
========================================= */

let toastTimer = null;


function showToast(message){

  const toast =
    document.getElementById(
      "toast"
    );


  toast.textContent =
    message;


  toast.classList.add(
    "show"
  );


  clearTimeout(
    toastTimer
  );


  toastTimer =
    setTimeout(
      () => {

        toast.classList.remove(
          "show"
        );

      },
      2300
    );

}


/* =========================================
   HTML SECURITY
========================================= */

function escapeHTML(value){

  return String(value)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


/* =========================================
   SAFE IMAGE
========================================= */

function safeImage(url){

  if(!url)
    return "";


  const value =
    String(url);


  if(
    value.startsWith(
      "https://"
    ) ||
    value.startsWith(
      "http://"
    )
  ){

    return escapeHTML(
      value
    );

  }


  return "";

}


/* =========================================
   ESC CLOSE
========================================= */

document.addEventListener(
  "keydown",
  event => {

    if(
      event.key ===
      "Escape"
    ){

      closeModal();

    }

  }
);
