<!DOCTYPE html>
<html lang="bn">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<meta
  name="theme-color"
  content="#090d1d"
>

<title>Football Fan Zone</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{

  font-family:
    Arial,
    "Noto Sans Bengali",
    sans-serif;

  background:
    radial-gradient(
      circle at top left,
      #172b66 0,
      #090d1d 42%,
      #070a15 100%
    );

  color:#fff;

  min-height:100vh;

  padding-bottom:90px;

  overflow-x:hidden;
}

body.light{

  background:
    linear-gradient(
      135deg,
      #eef2ff,
      #fff
    );

  color:#15182a;
}


/* HEADER */

.header{

  padding:20px 18px 12px;

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:12px;
}

.brand{

  display:flex;

  align-items:center;

  gap:12px;
}

.brand-icon{

  width:58px;
  height:58px;

  border-radius:18px;

  display:flex;

  align-items:center;

  justify-content:center;

  font-size:31px;

  background:
    linear-gradient(
      135deg,
      #286cff,
      #7b36ee
    );

  box-shadow:
    0 8px 25px
    rgba(56,93,255,.35);
}

.brand-title{

  font-size:24px;

  font-weight:800;
}

.brand-sub{

  margin-top:5px;

  color:#9da5bd;

  font-size:14px;
}

.header-actions{

  display:flex;

  gap:9px;
}

.icon-btn{

  width:50px;
  height:50px;

  border:0;

  border-radius:16px;

  background:#171c30;

  color:#fff;

  font-size:23px;

  cursor:pointer;
}

.light .icon-btn{

  background:#e7eafa;

  color:#161a2c;
}


/* SEARCH */

.search-box{

  margin:10px 24px 14px;

  height:65px;

  border-radius:22px;

  background:
    rgba(27,31,49,.9);

  border:1px solid
    rgba(255,255,255,.07);

  display:flex;

  align-items:center;

  padding:0 20px;
}

.light .search-box{

  background:#fff;

  border-color:#e2e5ef;
}

.search-box span{

  font-size:24px;

  margin-right:13px;
}

.search-box input{

  width:100%;

  background:none;

  border:0;

  outline:0;

  color:#fff;

  font-size:17px;
}

.light .search-box input{
  color:#111;
}

.search-box input::placeholder{
  color:#777d92;
}


/* SPORT */

.sport-tabs{

  display:grid;

  grid-template-columns:1fr 1fr;

  gap:12px;

  padding:10px 24px 16px;
}

.sport-btn{

  height:68px;

  border:0;

  border-radius:23px;

  background:#171b2d;

  color:#fff;

  font-size:19px;

  font-weight:700;

  cursor:pointer;
}

.sport-btn.active{

  background:
    linear-gradient(
      135deg,
      #286cff,
      #8136ec
    );

  box-shadow:
    0 10px 30px
    rgba(79,74,255,.35);
}

.light .sport-btn{

  background:#e7eafa;

  color:#22263a;
}

.light .sport-btn.active{
  color:#fff;
}


/* DATE */

.date-section{

  margin:2px 0 8px;

  padding:0 20px;
}

.date-title{

  display:flex;

  align-items:center;

  justify-content:space-between;

  margin-bottom:10px;
}

.date-title-left{

  font-size:16px;

  font-weight:700;
}

.date-title-right{

  color:#8f98b2;

  font-size:13px;
}

.date-scroll{

  display:flex;

  gap:9px;

  overflow-x:auto;

  padding:3px 4px 9px;

  scrollbar-width:none;
}

.date-scroll::-webkit-scrollbar{
  display:none;
}

.date-chip{

  flex:0 0 auto;

  min-width:68px;

  padding:10px 9px;

  border:1px solid
    rgba(255,255,255,.07);

  border-radius:18px;

  background:
    rgba(29,35,61,.85);

  color:#aeb5ca;

  text-align:center;

  cursor:pointer;
}

.date-chip .day{

  display:block;

  font-size:12px;

  margin-bottom:5px;
}

.date-chip .number{

  display:block;

  font-size:19px;

  font-weight:800;

  color:#fff;
}

.date-chip.active{

  background:
    linear-gradient(
      135deg,
      #316dff,
      #7d39ee
    );

  border-color:transparent;

  color:#fff;

  box-shadow:
    0 8px 20px
    rgba(65,75,255,.3);
}

.date-chip.today{
  border-color:#536cff;
}

.light .date-chip{

  background:#fff;

  color:#73798d;

  border-color:#e2e5ef;
}

.light .date-chip .number{
  color:#20243a;
}

.light .date-chip.active .number{
  color:#fff;
}


/* FILTER */

.filters{

  display:flex;

  gap:9px;

  padding:8px 24px 12px;

  overflow-x:auto;

  scrollbar-width:none;
}

.filters::-webkit-scrollbar{
  display:none;
}

.filter-btn{

  flex:0 0 auto;

  border:0;

  padding:12px 17px;

  border-radius:22px;

  background:#1a2035;

  color:#d6d9e5;

  font-size:15px;

  cursor:pointer;
}

.filter-btn.active{

  background:
    linear-gradient(
      135deg,
      #376cff,
      #7c39ed
    );

  color:#fff;
}


/* LIVE INFO */

.info-bar{

  padding:8px 24px 12px;

  display:flex;

  align-items:center;

  justify-content:space-between;

  color:#9fa7bd;

  font-size:13px;
}

.live-status{

  display:flex;

  align-items:center;

  gap:6px;
}

.live-dot{

  width:10px;
  height:10px;

  background:#20c875;

  border-radius:50%;

  box-shadow:
    0 0 12px
    rgba(32,200,117,.7);

  animation:
    liveDot 1.4s infinite;
}

@keyframes liveDot{

  50%{
    opacity:.35;
  }

}

.updating{
  color:#6f9cff;
}


/* MATCH */

.matches{
  padding:0 24px;
}

.match-card{

  position:relative;

  margin-bottom:18px;

  padding:18px 15px;

  border-radius:28px;

  background:
    linear-gradient(
      145deg,
      rgba(38,47,80,.97),
      rgba(19,25,48,.98)
    );

  border:1px solid
    rgba(255,255,255,.07);

  box-shadow:
    0 15px 40px
    rgba(0,0,0,.18);

  cursor:pointer;

  overflow:hidden;
}

.light .match-card{

  background:#fff;

  border-color:#e2e5ef;

  box-shadow:
    0 10px 30px
    rgba(40,50,90,.08);
}

.competition{

  display:flex;

  align-items:center;

  gap:9px;

  color:#aab1c6;

  font-size:14px;

  margin-bottom:19px;

  padding-right:55px;
}

.competition img{

  width:27px;
  height:27px;

  object-fit:contain;

  border-radius:7px;
}

.favorite{

  position:absolute;

  top:15px;
  right:15px;

  width:45px;
  height:45px;

  border:0;

  border-radius:15px;

  background:
    rgba(255,255,255,.08);

  color:#fff;

  font-size:23px;

  cursor:pointer;

  z-index:5;
}

.favorite.active{

  color:#ffd52e;

  background:
    rgba(255,213,46,.10);
}

.teams{

  display:grid;

  grid-template-columns:
    1fr
    125px
    1fr;

  align-items:center;

  text-align:center;

  gap:5px;
}

.team{
  min-width:0;
}

.team-logo{

  width:72px;
  height:72px;

  margin:0 auto;

  object-fit:contain;

  display:block;
}

.team-placeholder{

  width:72px;
  height:72px;

  margin:auto;

  display:flex;

  align-items:center;

  justify-content:center;

  font-size:48px;
}

.team-name{

  margin-top:10px;

  font-size:16px;

  font-weight:750;

  line-height:1.25;

  word-break:break-word;
}

.score-area{

  display:flex;

  flex-direction:column;

  align-items:center;

  justify-content:center;
}

.score{

  font-size:29px;

  font-weight:900;

  letter-spacing:1px;

  white-space:nowrap;
}

.live-score{

  text-shadow:
    0 0 16px
    rgba(255,255,255,.18);
}


/* CRICKET SCORE */

.cricket-summary{

  margin-top:8px;

  display:flex;

  flex-direction:column;

  gap:4px;

  font-size:12px;

  color:#9fa8bf;

  max-width:125px;
}

.cricket-summary strong{

  color:#fff;

  font-size:14px;
}

.cricket-overs{
  color:#8da2df;
}


/* FOOTBALL */

.football-minute{

  margin-top:7px;

  color:#ff6373;

  font-size:12px;

  font-weight:700;
}


/* STATUS */

.status-badge{

  display:inline-flex;

  align-items:center;

  justify-content:center;

  gap:5px;

  margin-top:9px;

  min-height:27px;

  padding:5px 10px;

  border-radius:20px;

  background:
    rgba(255,255,255,.07);

  color:#aeb5c9;

  font-size:11px;

  font-weight:600;
}

.status-badge.live{

  background:
    rgba(255,55,75,.13);

  color:#ff6070;
}

.status-pulse{

  width:7px;
  height:7px;

  border-radius:50%;

  background:#ff3f55;

  animation:
    pulse 1.3s infinite;
}

@keyframes pulse{

  70%{
    box-shadow:
      0 0 0 7px
      rgba(255,63,85,0);
  }

}

.match-time{

  margin-top:20px;

  padding-top:13px;

  border-top:1px solid
    rgba(255,255,255,.06);

  text-align:center;

  color:#9fa8bf;

  font-size:13px;
}

.light .match-time{
  border-color:#edf0f5;
}


/* LOADING */

.loading{

  text-align:center;

  padding:45px 10px;

  color:#9ea6bd;
}

.spinner{

  width:40px;
  height:40px;

  border:4px solid
    rgba(255,255,255,.12);

  border-top-color:#5571ff;

  border-radius:50%;

  animation:
    spin .8s linear infinite;

  margin:
    0 auto 15px;
}

@keyframes spin{

  to{
    transform:rotate(360deg);
  }

}

.empty{

  text-align:center;

  padding:50px 15px;

  color:#9da5ba;
}


/* MODAL */

.modal{

  position:fixed;

  inset:0;

  background:
    rgba(2,4,12,.82);

  backdrop-filter:blur(10px);

  display:none;

  align-items:flex-end;

  justify-content:center;

  z-index:1000;
}

.modal.show{
  display:flex;
}

.modal-box{

  width:100%;

  max-width:600px;

  max-height:90vh;

  overflow:auto;

  background:
    linear-gradient(
      145deg,
      #171d35,
      #0d1224
    );

  border-radius:
    30px 30px 0 0;

  padding:22px;
}

.modal-head{

  display:flex;

  align-items:center;

  justify-content:space-between;

  margin-bottom:20px;
}

.modal-head h2{
  font-size:20px;
}

.close-btn{

  width:42px;
  height:42px;

  border:0;

  border-radius:14px;

  background:#262d47;

  color:#fff;

  font-size:20px;
}

.detail-content{
  color:#dce0ec;
}

.detail-score{

  text-align:center;

  font-size:32px;

  font-weight:800;

  margin:20px 0;
}

.detail-team-grid{

  display:grid;

  grid-template-columns:1fr 1fr;

  gap:12px;

  text-align:center;

  margin:20px 0;
}

.detail-team{

  padding:15px;

  border-radius:18px;

  background:
    rgba(255,255,255,.05);
}

.detail-team-score{

  font-size:25px;

  font-weight:800;

  margin-top:8px;
}

.detail-section{

  margin-top:18px;

  padding:15px;

  border-radius:18px;

  background:
    rgba(255,255,255,.04);
}

.detail-section h3{

  margin-bottom:10px;

  font-size:16px;
}

.detail-row{

  display:flex;

  justify-content:space-between;

  gap:10px;

  padding:7px 0;

  border-bottom:
    1px solid
    rgba(255,255,255,.05);

  font-size:13px;
}

.detail-row:last-child{
  border-bottom:0;
}

.raw-scorecard{

  white-space:pre-wrap;

  word-break:break-word;

  font-size:12px;

  line-height:1.6;

  color:#bfc7dc;
}


/* BOTTOM */

.bottom-nav{

  position:fixed;

  left:0;
  right:0;
  bottom:0;

  height:82px;

  display:grid;

  grid-template-columns:
    repeat(4,1fr);

  background:
    rgba(9,13,29,.97);

  border-top:1px solid
    rgba(255,255,255,.06);

  backdrop-filter:blur(15px);

  z-index:900;
}

.nav-btn{

  border:0;

  background:none;

  color:#838aa0;

  font-size:13px;

  cursor:pointer;
}

.nav-btn span{

  display:block;

  font-size:25px;

  margin-bottom:4px;
}

.nav-btn.active{
  color:#fff;
}


/* TOAST */

.toast{

  position:fixed;

  left:50%;

  bottom:100px;

  transform:
    translateX(-50%)
    translateY(20px);

  background:#20263c;

  color:#fff;

  padding:12px 18px;

  border-radius:15px;

  opacity:0;

  pointer-events:none;

  transition:.25s;

  z-index:2000;

  white-space:nowrap;
}

.toast.show{

  opacity:1;

  transform:
    translateX(-50%)
    translateY(0);
}


/* DESKTOP */

@media(min-width:700px){

  body{

    max-width:850px;

    margin:auto;
  }

  .bottom-nav{

    max-width:850px;

    left:50%;

    transform:
      translateX(-50%);
  }

  .modal-box{

    border-radius:30px;

    margin-bottom:30px;
  }

}

</style>

</head>

<body>


<header class="header">

  <div class="brand">

    <div class="brand-icon">
      ⚽
    </div>

    <div>

      <div class="brand-title">
        Football Fan Zone
      </div>

      <div class="brand-sub">
        Live Scores & Match Center
      </div>

    </div>

  </div>

  <div class="header-actions">

    <button
      class="icon-btn"
      onclick="toggleTheme()"
      id="themeBtn"
    >
      🌙
    </button>

    <button
      class="icon-btn"
      onclick="manualRefresh()"
    >
      🔄
    </button>

  </div>

</header>


<div class="search-box">

  <span>🔎</span>

  <input
    type="text"
    id="searchInput"
    placeholder="দল বা লীগ খুঁজুন..."
  >

</div>


<div class="sport-tabs">

  <button
    class="sport-btn"
    id="footballBtn"
    onclick="changeSport('football')"
  >
    ⚽ Football
  </button>

  <button
    class="sport-btn active"
    id="cricketBtn"
    onclick="changeSport('cricket')"
  >
    🏏 Cricket
  </button>

</div>


<section class="date-section">

  <div class="date-title">

    <div class="date-title-left">
      📅 ম্যাচের তারিখ
    </div>

    <div
      class="date-title-right"
      id="selectedDateText"
    >
      আজ
    </div>

  </div>

  <div
    class="date-scroll"
    id="dateScroll"
  ></div>

</section>


<div class="filters">

  <button
    class="filter-btn active"
    data-filter="all"
    onclick="changeFilter('all')"
  >
    সব
  </button>

  <button
    class="filter-btn"
    data-filter="live"
    onclick="changeFilter('live')"
  >
    🔴 Live
  </button>

  <button
    class="filter-btn"
    data-filter="upcoming"
    onclick="changeFilter('upcoming')"
  >
    🟢 Upcoming
  </button>

  <button
    class="filter-btn"
    data-filter="finished"
    onclick="changeFilter('finished')"
  >
    ⚪ Finished
  </button>

  <button
    class="filter-btn"
    data-filter="favorites"
    onclick="changeFilter('favorites')"
  >
    ⭐ Favorites
  </button>

</div>


<div class="info-bar">

  <div class="live-status">

    <span class="live-dot"></span>

    <span>
      Live Score
    </span>

  </div>

  <div id="updateText">
    শেষ আপডেট: --
  </div>

</div>


<main
  class="matches"
  id="matches"
>

  <div class="loading">

    <div class="spinner"></div>

    ম্যাচ লোড হচ্ছে...

  </div>

</main>


<div
  class="modal"
  id="matchModal"
  onclick="closeModalOutside(event)"
>

  <div class="modal-box">

    <div class="modal-head">

      <h2>
        ম্যাচ বিস্তারিত
      </h2>

      <button
        class="close-btn"
        onclick="closeModal()"
      >
        ✕
      </button>

    </div>

    <div
      class="detail-content"
      id="detailContent"
    ></div>

  </div>

</div>


<nav class="bottom-nav">

  <button
    class="nav-btn active"
    onclick="goHome()"
  >
    <span>🏠</span>
    Home
  </button>

  <button
    class="nav-btn"
    onclick="showLive()"
  >
    <span>🔴</span>
    Live
  </button>

  <button
    class="nav-btn"
    onclick="showFavorites()"
  >
    <span>⭐</span>
    Favorites
  </button>

  <button
    class="nav-btn"
    onclick="manualRefresh()"
  >
    <span>🔄</span>
    Refresh
  </button>

</nav>


<div
  class="toast"
  id="toast"
></div>


<script>

/* =========================================
   SETTINGS
========================================= */

const API_BASE = "";

let sport = "cricket";

let currentFilter = "all";

let allMatches = [];

let selectedDate =
  getDateString(new Date());

let loading = false;

let firstLoad = true;

let previousLiveState = {};

let favorites =
  JSON.parse(
    localStorage.getItem(
      "footballFanFavorites"
    ) || "[]"
  );


/* =========================================
   DATE
========================================= */

function getDateString(date){

  return (
    date.getFullYear() +
    "-" +
    String(
      date.getMonth() + 1
    ).padStart(2,"0") +
    "-" +
    String(
      date.getDate()
    ).padStart(2,"0")
  );

}

function getDateObject(value){

  const parts =
    value.split("-");

  return new Date(
    Number(parts[0]),
    Number(parts[1]) - 1,
    Number(parts[2])
  );

}

function getDayName(date){

  return date.toLocaleDateString(
    "bn-BD",
    {
      weekday:"short"
    }
  );

}

function formatShortDate(date){

  return date.toLocaleDateString(
    "bn-BD",
    {
      day:"numeric",
      month:"short"
    }
  );

}

function renderDates(){

  const box =
    document.getElementById(
      "dateScroll"
    );

  box.innerHTML = "";

  const center =
    getDateObject(
      selectedDate
    );

  for(
    let i = -3;
    i <= 3;
    i++
  ){

    const date =
      new Date(center);

    date.setDate(
      center.getDate() + i
    );

    const value =
      getDateString(date);

    const btn =
      document.createElement(
        "button"
      );

    btn.className =
      "date-chip";

    if(
      value === selectedDate
    ){

      btn.classList.add(
        "active"
      );

    }

    if(
      value ===
      getDateString(new Date())
    ){

      btn.classList.add(
        "today"
      );

    }

    btn.innerHTML = `

      <span class="day">
        ${getDayName(date)}
      </span>

      <span class="number">
        ${date.getDate()}
      </span>

    `;

    btn.onclick = function(){

      selectedDate =
        value;

      renderDates();

      updateSelectedDateText();

      loadMatches(true);

    };

    box.appendChild(btn);

  }

}

function updateSelectedDateText(){

  const today =
    getDateString(
      new Date()
    );

  const date =
    getDateObject(
      selectedDate
    );

  document.getElementById(
    "selectedDateText"
  ).textContent =

    selectedDate === today
      ? "আজ"
      : formatShortDate(date);

}


/* =========================================
   SPORT
========================================= */

function changeSport(value){

  sport =
    value;

  document.getElementById(
    "footballBtn"
  ).classList.toggle(
    "active",
    sport === "football"
  );

  document.getElementById(
    "cricketBtn"
  ).classList.toggle(
    "active",
    sport === "cricket"
  );

  loadMatches(true);

}


/* =========================================
   LOAD MATCHES
========================================= */

async function loadMatches(showLoading = false){

  if(loading){
    return;
  }

  loading = true;

  const box =
    document.getElementById(
      "matches"
    );

  const updateText =
    document.getElementById(
      "updateText"
    );

  if(
    firstLoad ||
    showLoading
  ){

    box.innerHTML = `

      <div class="loading">

        <div class="spinner"></div>

        ম্যাচ লোড হচ্ছে...

      </div>

    `;

  }

  updateText.classList.add(
    "updating"
  );

  updateText.textContent =
    "আপডেট হচ্ছে...";

  try{

    const url =
      `/api/${sport}` +
      `?date=${encodeURIComponent(
        selectedDate
      )}` +
      `&_=${Date.now()}`;

    const response =
      await fetch(
        url,
        {
          cache:"no-store"
        }
      );

    if(!response.ok){

      throw new Error(
        "API Error " +
        response.status
      );

    }

    const data =
      await response.json();

    let newMatches = [];

    if(
      Array.isArray(data)
    ){

      newMatches =
        data;

    }
    else if(
      Array.isArray(data.matches)
    ){

      newMatches =
        data.matches;

    }
    else if(
      Array.isArray(data.data)
    ){

      newMatches =
        data.data;

    }

    detectScoreChanges(
      allMatches,
      newMatches
    );

    allMatches =
      newMatches;

    renderMatches();

    updateTime();

    firstLoad = false;

  }
  catch(error){

    console.error(
      error
    );

    if(
      firstLoad
    ){

      box.innerHTML = `

        <div class="empty">

          😕 ম্যাচ ডাটা পাওয়া যাচ্ছে না।

          <br><br>

          🔄 আবার Refresh করুন।

        </div>

      `;

    }

    updateText.textContent =
      "আপডেট ব্যর্থ";

  }
  finally{

    loading = false;

    updateText.classList.remove(
      "updating"
    );

  }

}

/* =========================================
   FILTERED
========================================= */

function getFilteredMatches(){

  let matches =
    [...allMatches];

  if(
    currentFilter ===
    "favorites"
  ){

    matches =
      matches.filter(
        match =>
          favorites.includes(
            getMatchId(match)
          )
      );

  }

  if(
    currentFilter ===
    "live"
  ){

    matches =
      matches.filter(
        match =>
          isLive(match)
      );

  }

  if(
    currentFilter ===
    "finished"
  ){

    matches =
      matches.filter(
        match =>
          isFinished(match)
      );

  }

  if(
    currentFilter ===
    "upcoming"
  ){

    matches =
      matches.filter(
        match =>
          !isLive(match) &&
          !isFinished(match)
      );

  }

  const search =
    document
      .getElementById(
        "searchInput"
      )
      .value
      .trim()
      .toLowerCase();

  if(search){

    matches =
      matches.filter(
        match =>
          JSON.stringify(match)
            .toLowerCase()
            .includes(search)
      );

  }

  return matches;

}


/* =========================================
   STATUS
========================================= */

function getStatusText(match){

  return String(
    match.status_text ||
    match.status ||
    match.state ||
    match.match_status ||
    ""
  ).toLowerCase();

}

function isLive(match){

  const text =
    getStatusText(match);

  return (

    text.includes("live") ||

    text.includes("inplay") ||

    text.includes("in-play") ||

    text.includes("playing") ||

    text.includes("1st") ||

    text.includes("2nd") ||

    text.includes("half") ||

    text.includes("quarter")

  );

}

function isFinished(match){

  const text =
    getStatusText(match);

  return (

    text.includes("finished") ||

    text.includes("finish") ||

    text.includes("ended") ||

    text.includes("complete") ||

    text.includes("ft") ||

    text.includes("full time") ||

    text.includes("result")

  );

}


/* =========================================
   MATCH ID
========================================= */

function getMatchId(match){

  return String(

    match.id ||

    match.match_id ||

    match.fixture_id ||

    match.slug ||

    match.match_slug ||

    (
      (match.home || "") +
      "-" +
      (match.away || "")
    )

  );

}


/* =========================================
   SCORE CHANGE
========================================= */

function getScoreKey(match){

  return [

    getMatchId(match),

    getScore(match,"home"),

    getScore(match,"away"),

    getOvers(match)

  ].join("|");

}

function detectScoreChanges(
  oldMatches,
  newMatches
){

  if(
    !oldMatches ||
    !oldMatches.length
  ){
    return;
  }

  const oldMap = {};

  oldMatches.forEach(
    match => {

      oldMap[
        getMatchId(match)
      ] =
        getScoreKey(match);

    }
  );

  newMatches.forEach(
    match => {

      const id =
        getMatchId(match);

      const newKey =
        getScoreKey(match);

      const oldKey =
        oldMap[id];

      if(
        oldKey &&
        oldKey !== newKey &&
        isLive(match)
      ){

        notifyScoreChange(
          match
        );

      }

    }
  );

}


/* =========================================
   GENERIC SCORE
========================================= */

function findNestedValue(
  obj,
  keys
){

  if(
    !obj ||
    typeof obj !== "object"
  ){
    return null;
  }

  for(
    const key of keys
  ){

    if(
      obj[key] !== undefined &&
      obj[key] !== null
    ){

      return obj[key];

    }

  }

  return null;

}


function getScore(
  match,
  side
){

  const names =
    side === "home"

      ?

      [
        "home_score",
        "homeScore",
        "home_runs",
        "home_run",
        "score_home"
      ]

      :

      [
        "away_score",
        "awayScore",
        "away_runs",
        "away_run",
        "score_away"
      ];

  const direct =
    findNestedValue(
      match,
      names
    );

  if(
    direct !== null
  ){

    return String(
      direct
    );

  }

  const team =
    match[
      side
    ];

  if(
    team &&
    typeof team === "object"
  ){

    const nested =
      findNestedValue(
        team,
        [
          "score",
          "runs",
          "points",
          "goals"
        ]
      );

    if(
      nested !== null
    ){

      return String(
        nested
      );

    }

  }

  return "-";

}


/* =========================================
   CRICKET OVERS
========================================= */

function getOvers(match){

  const value =
    findNestedValue(
      match,
      [
        "overs",
        "over",
        "current_over",
        "current_overs",
        "home_overs",
        "away_overs"
      ]
    );

  if(
    value !== null
  ){

    return String(
      value
    );

  }

  return "";

}


function getWickets(
  match,
  side
){

  const names =
    side === "home"

      ?

      [
        "home_wickets",
        "homeWickets",
        "home_wicket"
      ]

      :

      [
        "away_wickets",
        "awayWickets",
        "away_wicket"
      ];

  const value =
    findNestedValue(
      match,
      names
    );

  return value === null
    ? null
    : value;

}

/* =========================================
   SCORECARD
========================================= */

function renderScorecard(data){

  const box =
    document.getElementById(
      "apiScorecard"
    );

  if(!box){
    return;
  }

  let rows = [];

  collectInterestingFields(
    data,
    rows,
    "",
    0
  );

  if(!rows.length){

    box.innerHTML = `

      <h3>
        📊 বিস্তারিত Scorecard
      </h3>

      <div class="raw-scorecard">

        API থেকে অতিরিক্ত scorecard পাওয়া যায়নি।

      </div>

    `;

    return;

  }

  const unique =
    [];

  const seen =
    new Set();

  rows.forEach(
    row => {

      const key =
        row[0] +
        "|" +
        row[1];

      if(
        !seen.has(key)
      ){

        seen.add(key);

        unique.push(row);

      }

    }
  );

  box.innerHTML = `

    <h3>
      📊 বিস্তারিত Scorecard
    </h3>

    ${unique
      .slice(0,40)
      .map(
        row => `

          <div class="detail-row">

            <span>
              ${escapeHtml(
                row[0]
              )}
            </span>

            <strong>
              ${escapeHtml(
                row[1]
              )}
            </strong>

          </div>

        `
      )
      .join("")
    }

  `;

}


function collectInterestingFields(
  obj,
  rows,
  prefix,
  depth
){

  if(
    !obj ||
    depth > 5
  ){
    return;
  }

  if(
    typeof obj !== "object"
  ){
    return;
  }

  Object.keys(obj)
    .forEach(
      key => {

        const value =
          obj[key];

        const label =
          (
            prefix
              ? prefix + " / "
              : ""
          ) +
          key;

        if(
          value === null ||
          value === undefined
        ){
          return;
        }

        if(
          typeof value !== "object"
        ){

          const lower =
            key.toLowerCase();

          if(

            lower.includes("score") ||

            lower.includes("run") ||

            lower.includes("wicket") ||

            lower.includes("over") ||

            lower.includes("goal") ||

            lower.includes("minute") ||

            lower.includes("status") ||

            lower.includes("result") ||

            lower.includes("inning")

          ){

            rows.push([
              label,
              String(value)
            ]);

          }

        }
        else{

          collectInterestingFields(
            value,
            rows,
            label,
            depth + 1
          );

        }

      }
    );

}

  }
  else{

    favorites.push(id);

    );

  }

/* =========================================
   NOTIFICATION
========================================= */

async function enableNotifications(){

  if(
    !("Notification" in window)
  ){

    showToast(
      "এই browser notification support করে না"
    );

    return false;

  }

  if(
    Notification.permission ===
    "granted"
  ){

    return true;

  }

  if(
    Notification.permission !==
    "denied"
  ){

    const permission =
      await Notification.requestPermission();

    return (
      permission ===
      "granted"
    );

  }

  return false;

}


async function notifyScoreChange(
  match
){

  const allowed =
    await enableNotifications();

  const home =
    match.home ||
    match.home_team ||
    "Home";

  const away =
    match.away ||
    match.away_team ||
    "Away";

  const homeScore =
    getScore(
      match,
      "home"
    );

  const awayScore =
    getScore(
      match,
      "away"
    );

  if(allowed){

    try{

      new Notification(
        "🔴 Live Score Update",
        {
          body:
            `${home} ${homeScore} - ` +
            `${awayScore} ${away}`,

          icon:
            match.home_logo ||
            undefined
        }
      );

    }
    catch(error){

      console.log(
        "Notification error:",
        error
      );

    }

  }

  showToast(
    `🔴 ${home} ${homeScore} - ${awayScore} ${away}`
  );

}

/* =========================================
   DATE FORMAT
========================================= */

function formatDate(value){

  if(!value){

    return "সময় পাওয়া যায়নি";

  }

  try{

    const date =
      new Date(value);

    if(
      isNaN(
        date.getTime()
      )
    ){

      return escapeHtml(
        String(value)
      );

    }

    return date.toLocaleString(
      "bn-BD",
      {
        day:"numeric",
        month:"long",
        year:"numeric",
        hour:"numeric",
        minute:"2-digit"
      }
    );

  }
  catch{

    return escapeHtml(
      String(value)
    );

  }

}


/* =========================================
   SECURITY
========================================= */

function escapeHtml(text){

  return String(text)

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}


function safeUrl(url){

  const value =
    String(url || "");

  if(
    value.startsWith(
      "https://"
    ) ||
    value.startsWith(
      "http://"
    )
  ){

    return value;

  }

  return "";

}


/* =========================================
   TOAST
========================================= */

let toastTimer;

function showToast(message){

  const toast =
    document.getElementById(
      "toast"
    );

  toast.textContent =
    message;

  toast.classList.add(
    "show"
  );

  clearTimeout(
    toastTimer
  );

  toastTimer =
    setTimeout(
      () => {

        toast.classList.remove(
          "show"
        );

      },
      2500
    );

}
