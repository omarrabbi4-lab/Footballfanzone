<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090912">

<title>Live Score ⚽🏏</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  min-height:100vh;
  color:#fff;
  background:
    radial-gradient(circle at top,#291052 0%,#0c0915 45%,#050507 100%);
}

.app{
  width:100%;
  max-width:650px;
  margin:auto;
  padding:18px;
}

header{
  text-align:center;
  padding:20px 5px 25px;
}

header h1{
  font-size:30px;
  margin-bottom:7px;
}

header p{
  color:#aaa;
  font-size:14px;
}

.live-status{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  margin-top:12px;
  color:#5cff8d;
  font-size:13px;
}

.dot{
  width:9px;
  height:9px;
  border-radius:50%;
  background:#39ff72;
  box-shadow:0 0 12px #39ff72;
}

.sports{
  display:flex;
  gap:10px;
  margin-bottom:18px;
}

.sport-btn{
  flex:1;
  border:0;
  padding:14px;
  border-radius:15px;
  background:rgba(255,255,255,.08);
  color:#fff;
  font-size:15px;
  cursor:pointer;
}

.sport-btn.active{
  background:linear-gradient(135deg,#ff4f91,#814cff);
}

.filters{
  display:flex;
  gap:8px;
  overflow-x:auto;
  margin-bottom:18px;
}

.filter{
  white-space:nowrap;
  border:1px solid rgba(255,255,255,.08);
  background:rgba(255,255,255,.06);
  color:#ccc;
  padding:9px 15px;
  border-radius:20px;
  cursor:pointer;
}

.filter.active{
  color:#fff;
  background:rgba(255,79,145,.2);
  border-color:#ff4f91;
}

.match-card{
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.09);
  border-radius:22px;
  padding:18px;
  margin-bottom:15px;
  backdrop-filter:blur(15px);
}

.league{
  display:flex;
  justify-content:space-between;
  gap:10px;
  color:#aaa;
  font-size:12px;
  margin-bottom:18px;
}

.live{
  color:#ff5475;
  font-weight:bold;
}

.teams{
  display:flex;
  align-items:center;
  justify-content:space-between;
  text-align:center;
}

.team{
  width:34%;
}

.team-logo{
  width:48px;
  height:48px;
  border-radius:50%;
  margin:0 auto 8px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#30204c,#151525);
  overflow:hidden;
  font-size:22px;
}

.team-logo img{
  width:100%;
  height:100%;
  object-fit:contain;
}

.team-name{
  font-size:14px;
  line-height:1.3;
}

.score{
  width:32%;
}

.score-number{
  font-size:25px;
  font-weight:bold;
}

.score-info{
  margin-top:5px;
  color:#aaa;
  font-size:11px;
}

.status{
  margin-top:15px;
  padding-top:13px;
  border-top:1px solid rgba(255,255,255,.08);
  text-align:center;
  color:#bbb;
  font-size:12px;
}

.loading{
  text-align:center;
  padding:45px 10px;
  color:#aaa;
}

.loading-icon{
  font-size:40px;
  margin-bottom:12px;
}

.error{
  text-align:center;
  padding:30px 15px;
  color:#ff9aaa;
  line-height:1.7;
}

.retry{
  margin-top:15px;
  padding:11px 20px;
  border:0;
  border-radius:12px;
  color:#fff;
  background:linear-gradient(135deg,#ff4f91,#814cff);
}

.empty{
  text-align:center;
  padding:45px 10px;
  color:#888;
}

.empty-icon{
  font-size:42px;
  margin-bottom:10px;
}

.bottom-nav{
  position:sticky;
  bottom:10px;
  margin-top:25px;
  display:flex;
  justify-content:space-around;
  background:rgba(15,15,25,.94);
  border:1px solid rgba(255,255,255,.08);
  border-radius:20px;
  padding:12px 5px;
  backdrop-filter:blur(15px);
}

.nav-item{
  text-align:center;
  color:#888;
  font-size:11px;
}

.nav-item span{
  display:block;
  font-size:20px;
  margin-bottom:4px;
}

.nav-item.active{
  color:#ff5b9d;
}

.updated{
  text-align:center;
  color:#666;
  font-size:10px;
  margin-top:12px;
}
</style>
</head>

<body>

<div class="app">

<header>

<h1>⚡ Live Score</h1>

<p>Football & Cricket-এর লাইভ স্কোর</p>

<div class="live-status">
<span class="dot"></span>
Live Score
</div>

</header>


<div class="sports">

<button
class="sport-btn active"
id="footballBtn"
onclick="changeSport('football')">
⚽ Football
</button>

<button
class="sport-btn"
id="cricketBtn"
onclick="changeSport('cricket')">
🏏 Cricket
</button>

</div>


<div class="filters">

<button
class="filter active"
onclick="changeFilter('live',this)">
🔴 Live
</button>

<button
class="filter"
onclick="changeFilter('upcoming',this)">
📅 Upcoming
</button>

<button
class="filter"
onclick="changeFilter('finished',this)">
✅ Finished
</button>

</div>


<div id="matches">

<div class="loading">

<div class="loading-icon">⚡</div>

<div>
লাইভ ম্যাচ খোঁজা হচ্ছে...
</div>

</div>

</div>


<div class="updated" id="updated">
ডেটা লোড হচ্ছে...
</div>


<div class="bottom-nav">

<div class="nav-item active">
<span>🏠</span>
Home
</div>

<div
class="nav-item"
onclick="changeSport('football')">
<span>⚽</span>
Football
</div>

<div
class="nav-item"
onclick="changeSport('cricket')">
<span>🏏</span>
Cricket
</div>

<div class="nav-item">
<span>❤️</span>
Favorites
</div>

</div>

</div>


<script>

let currentSport = "football";
let currentFilter = "live";


// ======================================
// CHANGE SPORT
// ======================================

function changeSport(sport){

  currentSport = sport;

  document
  .getElementById("footballBtn")
  .classList
  .toggle("active",sport === "football");

  document
  .getElementById("cricketBtn")
  .classList
  .toggle("active",sport === "cricket");

  loadMatches();

}


// ======================================
// CHANGE FILTER
// ======================================

function changeFilter(filter,button){

  currentFilter = filter;

  document
  .querySelectorAll(".filter")
  .forEach(btn=>{
    btn.classList.remove("active");
  });

  button.classList.add("active");

  loadMatches();

}


// ======================================
// LOAD MATCHES
// ======================================

async function loadMatches(){

  const container =
    document.getElementById("matches");

  container.innerHTML = `
    <div class="loading">
      <div class="loading-icon">⏳</div>
      ম্যাচ খোঁজা হচ্ছে...
    </div>
  `;

  const endpoint =
    currentSport === "football"
    ? "/api/football"
    : "/api/cricket";

  try{

    const response =
      await fetch(
        endpoint + "?filter=" + currentFilter,
        {
          cache:"no-store"
        }
      );

    if(!response.ok){
      throw new Error(
        "Server error: " + response.status
      );
    }

    const data =
      await response.json();

    const matches =
      extractMatches(data);

    renderMatches(matches);

    document.getElementById("updated").innerText =
      "শেষ আপডেট: " +
      new Date().toLocaleTimeString("bn-BD");

  }

  catch(error){

    console.error(error);

    container.innerHTML = `

      <div class="error">

        ⚠️

        <br>

        লাইভ স্কোর লোড করা যাচ্ছে না।

        <br>

        কিছুক্ষণ পর আবার চেষ্টা করুন।

        <br>

        <button
        class="retry"
        onclick="loadMatches()">
        আবার চেষ্টা করুন
        </button>

      </div>

    `;

    document.getElementById("updated").innerText =
      "ডেটা পাওয়া যায়নি";

  }

}


// ======================================
// EXTRACT MATCHES
// ======================================

function extractMatches(data){

  if(!data){
    return [];
  }

  if(Array.isArray(data)){
    return data;
  }

  if(Array.isArray(data.matches)){
    return data.matches;
  }

  if(Array.isArray(data.events)){
    return data.events;
  }

  if(Array.isArray(data.results)){
    return data.results;
  }

  if(data.data){

    if(Array.isArray(data.data)){
      return data.data;
    }

    if(Array.isArray(data.data.matches)){
      return data.data.matches;
    }

    if(Array.isArray(data.data.events)){
      return data.data.events;
    }

  }

  return [];

}


// ======================================
// RENDER
// ======================================

function renderMatches(matches){

  const container =
    document.getElementById("matches");

  if(!matches.length){

    container.innerHTML = `

      <div class="empty">

        <div class="empty-icon">
          ${currentSport === "football" ? "⚽" : "🏏"}
        </div>

        <div>
          এই মুহূর্তে কোনো
          ${currentFilter === "live" ? "লাইভ" : ""}
          ম্যাচ পাওয়া যায়নি।
        </div>

      </div>

    `;

    return;
  }


  container.innerHTML =
    matches
    .slice(0,50)
    .map(createMatchCard)
    .join("");

}


// ======================================
// MATCH CARD
// ======================================

function createMatchCard(match){

  const home =
    getValue(
      match,
      [
        "home_team",
        "homeTeam",
        "home",
        "team1",
        "localteam"
      ]
    );

  const away =
    getValue(
      match,
      [
        "away_team",
        "awayTeam",
        "away",
        "team2",
        "visitorteam"
      ]
    );


  const homeName =
    getTeamName(home,"Home Team");

  const awayName =
    getTeamName(away,"Away Team");


  const homeLogo =
    getTeamLogo(home);

  const awayLogo =
    getTeamLogo(away);


  const homeScore =
    getScore(match,home,"home");

  const awayScore =
    getScore(match,away,"away");


  const league =
    getValue(
      match,
      [
        "league_name",
        "league",
        "competition",
        "tournament"
      ]
    ) || "Live Match";


  const status =
    getValue(
      match,
      [
        "status",
        "match_status",
        "state"
      ]
    ) || "LIVE";


  return `

    <div class="match-card">

      <div class="league">

        <span>
          ${escapeHTML(
            getText(league)
          )}
        </span>

        <span class="live">
          ● ${escapeHTML(
            getText(status)
          )}
        </span>

      </div>


      <div class="teams">

        <div class="team">

          <div class="team-logo">

            ${
              homeLogo
              ?
              `<img
              src="${escapeAttribute(homeLogo)}"
              onerror="this.style.display='none'">`
              :
              "⚽"
            }

          </div>

          <div class="team-name">
            ${escapeHTML(homeName)}
          </div>

        </div>


        <div class="score">

          <div class="score-number">

            ${escapeHTML(
              String(homeScore)
            )}
            -
            ${escapeHTML(
              String(awayScore)
            )}

          </div>

          <div class="score-info">
            ${currentSport === "cricket"
              ? "Cricket"
              : "Football"}
          </div>

        </div>


        <div class="team">

          <div class="team-logo">

            ${
              awayLogo
              ?
              `<img
              src="${escapeAttribute(awayLogo)}"
              onerror="this.style.display='none'">`
              :
              "⚽"
            }

          </div>

          <div class="team-name">
            ${escapeHTML(awayName)}
          </div>

        </div>

      </div>


      <div class="status">

        ${
          currentSport === "cricket"
          ? "🏏 Cricket Live"
          : "⚽ Football Live"
        }

      </div>

    </div>

  `;

}


// ======================================
// HELPERS
// ======================================

function getValue(object,keys){

  for(const key of keys){

    if(
      object &&
      object[key] !== undefined &&
      object[key] !== null
    ){

      return object[key];

    }

  }

  return null;

}


function getText(value){

  if(typeof value === "string"){
    return value;
  }

  if(typeof value === "number"){
    return String(value);
  }

  if(value && value.name){
    return value.name;
  }

  return "Match";

}


function getTeamName(team,fallback){

  if(!team){
    return fallback;
  }

  if(typeof team === "string"){
    return team;
  }

  return (
    team.name ||
    team.team_name ||
    team.title ||
    fallback
  );

}


function getTeamLogo(team){

  if(!team || typeof team === "string"){
    return "";
  }

  return (
    team.logo ||
    team.image ||
    team.logo_url ||
    team.image_path ||
    ""
  );

}


function getScore(match,team,type){

  if(team && typeof team === "object"){

    const score =
      team.score ??
      team.runs ??
      team.points;

    if(score !== undefined){
      return score;
    }

  }


  const possibleKeys =
    type === "home"
    ?
    [
      "home_score",
      "homeScore",
      "home_runs",
      "home_points"
    ]
    :
    [
      "away_score",
      "awayScore",
      "away_runs",
      "away_points"
    ];


  return getValue(
    match,
    possibleKeys
  ) ?? 0;

}


// ======================================
// SECURITY
// ======================================

function escapeHTML(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function escapeAttribute(value){

  return String(value)
    .replace(/"/g,"%22")
    .replace(/'/g,"%27")
    .replace(/</g,"%3C")
    .replace(/>/g,"%3E");

}


// ======================================
// FIRST LOAD
// ======================================

loadMatches();


// ======================================
// AUTO REFRESH
// ======================================

setInterval(
  loadMatches,
  30000
);

</script>

</body>
</html>
