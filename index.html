<!DOCTYPE html>
<html lang="bn">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1.0"
>

<meta
  name="theme-color"
  content="#080b18"
>

<meta
  name="mobile-web-app-capable"
  content="yes"
>

<meta
  name="apple-mobile-web-app-capable"
  content="yes"
>

<title>Football Fan Zone</title>

<style>

/* =====================================================
   RESET
===================================================== */

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{

  font-family:
    Arial,
    "Noto Sans Bengali",
    sans-serif;

  color:#fff;

  min-height:100vh;

  overflow-x:hidden;

  padding-bottom:95px;

  background:
    radial-gradient(
      circle at 10% 0%,
      rgba(38,103,255,.35),
      transparent 32%
    ),
    radial-gradient(
      circle at 100% 20%,
      rgba(139,51,255,.30),
      transparent 30%
    ),
    linear-gradient(
      145deg,
      #080b18,
      #0b1025 48%,
      #070912
    );

  transition:
    background .5s ease,
    color .5s ease;
}


/* =====================================================
   LIGHT THEME
===================================================== */

body.light{

  color:#171a2c;

  background:
    radial-gradient(
      circle at 0% 0%,
      #dce7ff,
      transparent 38%
    ),
    radial-gradient(
      circle at 100% 20%,
      #f0ddff,
      transparent 35%
    ),
    linear-gradient(
      145deg,
      #f7f9ff,
      #ffffff
    );
}


/* =====================================================
   BACKGROUND LIGHTS
===================================================== */

body::before{

  content:"";

  position:fixed;

  width:260px;
  height:260px;

  left:-120px;
  bottom:120px;

  border-radius:50%;

  background:
    rgba(45,103,255,.12);

  filter:blur(50px);

  pointer-events:none;

  animation:
    floatLight 8s ease-in-out infinite;
}

body::after{

  content:"";

  position:fixed;

  width:240px;
  height:240px;

  right:-120px;
  top:240px;

  border-radius:50%;

  background:
    rgba(142,56,255,.12);

  filter:blur(55px);

  pointer-events:none;

  animation:
    floatLight 10s ease-in-out infinite reverse;
}

@keyframes floatLight{

  0%,100%{
    transform:translate(0,0);
  }

  50%{
    transform:translate(30px,-25px);
  }

}


/* =====================================================
   HEADER
===================================================== */

.header{

  padding:
    20px
    18px
    12px;

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:12px;

  position:relative;

  z-index:10;
}

.brand{

  display:flex;

  align-items:center;

  gap:12px;
}

.brand-icon{

  width:58px;
  height:58px;

  display:flex;

  align-items:center;

  justify-content:center;

  border-radius:19px;

  font-size:30px;

  background:
    linear-gradient(
      135deg,
      #2775ff,
      #8a35f0
    );

  box-shadow:
    0 10px 30px
    rgba(62,93,255,.35);

  animation:
    iconFloat 3.5s ease-in-out infinite;
}

@keyframes iconFloat{

  0%,100%{
    transform:translateY(0) rotate(0);
  }

  50%{
    transform:translateY(-5px) rotate(3deg);
  }

}

.brand-title{

  font-size:23px;

  font-weight:900;

  letter-spacing:.2px;
}

.brand-sub{

  margin-top:5px;

  font-size:13px;

  color:#8e98b5;
}

.header-actions{

  display:flex;

  gap:8px;
}

.icon-btn{

  width:48px;
  height:48px;

  border:0;

  border-radius:16px;

  background:
    rgba(25,31,56,.88);

  color:#fff;

  font-size:21px;

  cursor:pointer;

  transition:
    transform .2s ease,
    background .3s ease;

  box-shadow:
    0 8px 25px
    rgba(0,0,0,.16);
}

.icon-btn:active{

  transform:scale(.88);
}

.light .icon-btn{

  background:#e9edfb;

  color:#20243a;
}


/* =====================================================
   SEARCH
===================================================== */

.search-box{

  margin:
    10px
    22px
    14px;

  height:60px;

  display:flex;

  align-items:center;

  padding:0 18px;

  border-radius:21px;

  background:
    rgba(22,28,51,.80);

  border:
    1px solid
    rgba(255,255,255,.07);

  backdrop-filter:blur(18px);

  box-shadow:
    0 15px 40px
    rgba(0,0,0,.12);

  transition:
    border .3s,
    transform .3s;
}

.search-box:focus-within{

  border-color:
    rgba(82,128,255,.7);

  transform:
    translateY(-2px);

  box-shadow:
    0 15px 35px
    rgba(53,102,255,.15);
}

.search-icon{

  font-size:23px;

  margin-right:12px;
}

.search-box input{

  width:100%;

  border:0;

  outline:0;

  background:none;

  color:#fff;

  font-size:16px;
}

.search-box input::placeholder{

  color:#727b98;
}

.light .search-box{

  background:
    rgba(255,255,255,.85);

  border-color:#e1e5f1;
}

.light .search-box input{
  color:#111;
}


/* =====================================================
   SPORT TABS
===================================================== */

.sport-tabs{

  display:grid;

  grid-template-columns:
    1fr
    1fr;

  gap:10px;

  padding:
    8px
    22px
    15px;
}

.sport-btn{

  height:63px;

  border:0;

  border-radius:21px;

  color:#aeb6ce;

  background:
    rgba(24,30,54,.88);

  font-size:17px;

  font-weight:800;

  cursor:pointer;

  transition:
    .3s ease;

  position:relative;

  overflow:hidden;
}

.sport-btn::after{

  content:"";

  position:absolute;

  top:0;
  left:-100%;

  width:70%;
  height:100%;

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(255,255,255,.15),
      transparent
    );

  transition:.5s;
}

.sport-btn:hover::after{

  left:130%;
}

.sport-btn.active{

  color:#fff;

  background:
    linear-gradient(
      135deg,
      #2876ff,
      #8138ee
    );

  box-shadow:
    0 12px 30px
    rgba(69,77,255,.28);

  transform:
    translateY(-2px);
}

.light .sport-btn{

  color:#6b728b;

  background:#e9edfa;
}

.light .sport-btn.active{
  color:#fff;
}


/* =====================================================
   DATE
===================================================== */

.date-section{

  padding:
    0
    20px
    4px;
}

.date-title{

  display:flex;

  align-items:center;

  justify-content:space-between;

  margin-bottom:9px;
}

.date-title-left{

  font-size:15px;

  font-weight:800;
}

.date-title-right{

  color:#8993ae;

  font-size:12px;
}

.date-scroll{

  display:flex;

  gap:8px;

  overflow-x:auto;

  scrollbar-width:none;

  padding:
    3px
    3px
    10px;
}

.date-scroll::-webkit-scrollbar{
  display:none;
}

.date-chip{

  min-width:66px;

  flex:0 0 auto;

  border:1px solid
    rgba(255,255,255,.07);

  border-radius:17px;

  padding:
    9px
    8px;

  background:
    rgba(27,34,59,.78);

  color:#aeb6cd;

  text-align:center;

  cursor:pointer;

  transition:
    transform .2s,
    .3s;
}

.date-chip:active{
  transform:scale(.92);
}

.date-chip .day{

  display:block;

  font-size:11px;

  margin-bottom:4px;
}

.date-chip .number{

  display:block;

  font-size:18px;

  font-weight:900;

  color:#fff;
}

.date-chip.active{

  color:#fff;

  border-color:transparent;

  background:
    linear-gradient(
      135deg,
      #3375ff,
      #8038ee
    );

  box-shadow:
    0 8px 20px
    rgba(66,83,255,.28);

  transform:
    translateY(-2px);
}

.date-chip.today{

  border-color:
    rgba(75,111,255,.8);
}

.light .date-chip{

  background:#fff;

  border-color:#e1e5ef;

  color:#737a90;
}

.light .date-chip .number{
  color:#20243a;
}

.light .date-chip.active .number{
  color:#fff;
}


/* =====================================================
   FILTERS
===================================================== */

.filters{

  display:flex;

  gap:8px;

  overflow-x:auto;

  scrollbar-width:none;

  padding:
    7px
    22px
    10px;
}

.filters::-webkit-scrollbar{
  display:none;
}

.filter-btn{

  flex:0 0 auto;

  border:0;

  padding:
    10px
    15px;

  border-radius:20px;

  color:#aeb6cd;

  background:
    rgba(24,31,55,.86);

  font-size:13px;

  font-weight:700;

  cursor:pointer;

  transition:
    .25s;
}

.filter-btn.active{

  color:#fff;

  background:
    linear-gradient(
      135deg,
      #3277ff,
      #8038ed
    );

  box-shadow:
    0 7px 18px
    rgba(59,83,255,.23);
}


/* =====================================================
   INFO BAR
===================================================== */

.info-bar{

  display:flex;

  align-items:center;

  justify-content:space-between;

  padding:
    7px
    24px
    12px;

  color:#8d97b2;

  font-size:11px;
}

.live-status{

  display:flex;

  align-items:center;

  gap:7px;
}

.live-dot{

  width:9px;
  height:9px;

  border-radius:50%;

  background:#18d27c;

  box-shadow:
    0 0 12px
    rgba(24,210,124,.8);

  animation:
    livePulse 1.4s infinite;
}

@keyframes livePulse{

  0%{
    transform:scale(1);
    opacity:1;
  }

  50%{
    transform:scale(1.35);
    opacity:.5;
  }

  100%{
    transform:scale(1);
    opacity:1;
  }

}

.updating{

  color:#6392ff;

  animation:
    blinkText .8s infinite;
}

@keyframes blinkText{

  50%{
    opacity:.45;
  }

}


/* =====================================================
   MATCH LIST
===================================================== */

.matches{

  padding:
    0
    20px;
}


/* =====================================================
   MATCH CARD
===================================================== */

.match-card{

  position:relative;

  margin-bottom:15px;

  padding:
    17px
    14px;

  border-radius:27px;

  background:
    linear-gradient(
      145deg,
      rgba(29,39,72,.96),
      rgba(13,19,39,.98)
    );

  border:
    1px solid
    rgba(255,255,255,.065);

  box-shadow:
    0 16px 42px
    rgba(0,0,0,.20);

  overflow:hidden;

  cursor:pointer;

  animation:
    cardIn .45s ease both;

  transition:
    transform .25s,
    box-shadow .25s,
    border .25s;
}

.match-card::before{

  content:"";

  position:absolute;

  width:180px;
  height:180px;

  right:-90px;
  top:-100px;

  border-radius:50%;

  background:
    rgba(69,104,255,.10);

  filter:blur(10px);

  pointer-events:none;
}

.match-card::after{

  content:"";

  position:absolute;

  left:-120%;

  top:0;

  width:80%;

  height:100%;

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(255,255,255,.035),
      transparent
    );

  transform:skewX(-20deg);

  animation:
    cardShine 5s infinite;
}

@keyframes cardIn{

  from{
    opacity:0;
    transform:
      translateY(18px)
      scale(.98);
  }

  to{
    opacity:1;
    transform:
      translateY(0)
      scale(1);
  }

}

@keyframes cardShine{

  0%,65%{
    left:-120%;
  }

  85%{
    left:130%;
  }

  100%{
    left:130%;
  }

}

.match-card:active{

  transform:
    scale(.985);
}

.light .match-card{

  background:
    rgba(255,255,255,.94);

  border-color:#e3e7f0;

  box-shadow:
    0 12px 35px
    rgba(40,50,90,.09);
}

.competition{

  display:flex;

  align-items:center;

  gap:8px;

  color:#a4aec8;

  font-size:12px;

  margin-bottom:17px;

  padding-right:55px;

  position:relative;

  z-index:2;
}

.competition img{

  width:25px;
  height:25px;

  object-fit:contain;

  border-radius:7px;
}

.favorite{

  position:absolute;

  right:13px;
  top:13px;

  width:43px;
  height:43px;

  border:0;

  border-radius:14px;

  background:
    rgba(255,255,255,.07);

  color:#fff;

  font-size:22px;

  cursor:pointer;

  z-index:5;

  transition:
    transform .2s,
    .2s;
}

.favorite:active{

  transform:
    scale(.82);
}

.favorite.active{

  color:#ffd42e;

  background:
    rgba(255,212,46,.10);

  animation:
    favoritePop .35s ease;
}

@keyframes favoritePop{

  50%{
    transform:scale(1.25);
  }

  100%{
    transform:scale(1);
  }

}


/* =====================================================
   TEAMS
===================================================== */

.teams{

  display:grid;

  grid-template-columns:
    1fr
    120px
    1fr;

  gap:4px;

  align-items:center;

  text-align:center;

  position:relative;

  z-index:2;
}

.team{
  min-width:0;
}

.team-logo{

  display:block;

  width:64px;
  height:64px;

  margin:auto;

  object-fit:contain;

  filter:
    drop-shadow(
      0 5px 10px
      rgba(0,0,0,.25)
    );

  transition:
    transform .3s;
}

.match-card:hover .team-logo{

  transform:
    scale(1.06);
}

.team-placeholder{

  width:64px;
  height:64px;

  margin:auto;

  display:flex;

  align-items:center;

  justify-content:center;

  border-radius:20px;

  background:
    rgba(255,255,255,.05);

  font-size:38px;
}

.team-name{

  margin-top:9px;

  font-size:14px;

  font-weight:800;

  line-height:1.25;

  word-break:break-word;
}

.light .team-name{
  color:#20243a;
}


/* =====================================================
   SCORE
===================================================== */

.score-area{

  display:flex;

  flex-direction:column;

  align-items:center;

  justify-content:center;
}

.score{

  font-size:27px;

  font-weight:950;

  letter-spacing:1px;

  white-space:nowrap;

  text-shadow:
    0 4px 20px
    rgba(90,120,255,.16);

  animation:
    scoreAppear .4s ease;
}

@keyframes scoreAppear{

  from{
    transform:scale(.85);
    opacity:.5;
  }

  to{
    transform:scale(1);
    opacity:1;
  }

}

.cricket-summary{

  margin-top:6px;

  display:flex;

  flex-direction:column;

  align-items:center;

  gap:2px;

  color:#9ca7c0;

  font-size:10px;
}

.cricket-summary strong{

  color:#fff;

  font-size:12px;
}

.cricket-overs{
  color:#8199e0;
}

.football-minute{

  margin-top:5px;

  color:#ff6476;

  font-size:11px;

  font-weight:900;

  animation:
    minutePulse 1.5s infinite;
}

@keyframes minutePulse{

  50%{
    opacity:.55;
  }

}


/* =====================================================
   STATUS
===================================================== */

.status-badge{

  display:inline-flex;

  align-items:center;

  justify-content:center;

  gap:5px;

  min-height:25px;

  margin-top:8px;

  padding:
    4px
    9px;

  border-radius:18px;

  background:
    rgba(255,255,255,.06);

  color:#aab3c9;

  font-size:9px;

  font-weight:800;
}

.status-badge.live{

  color:#ff6678;

  background:
    rgba(255,54,77,.11);
}

.status-pulse{

  width:6px;
  height:6px;

  border-radius:50%;

  background:#ff3e57;

  animation:
    statusPulse 1s infinite;
}

@keyframes statusPulse{

  50%{
    transform:scale(1.5);

    box-shadow:
      0 0 10px
      rgba(255,62,87,.7);
  }

}

.match-time{

  margin-top:16px;

  padding-top:11px;

  border-top:
    1px solid
    rgba(255,255,255,.055);

  text-align:center;

  color:#8e98b2;

  font-size:11px;

  position:relative;

  z-index:2;
}

.light .match-time{
  border-color:#edf0f5;
}


/* =====================================================
   LOADING
===================================================== */

.loading{

  padding:
    60px
    10px;

  text-align:center;

  color:#8f99b3;
}

.spinner{

  width:42px;
  height:42px;

  margin:
    0 auto
    16px;

  border:
    4px solid
    rgba(255,255,255,.10);

  border-top-color:
    #5a7cff;

  border-right-color:
    #9a45ff;

  border-radius:50%;

  animation:
    spin .75s linear infinite;
}

@keyframes spin{

  to{
    transform:rotate(360deg);
  }

}

.empty{

  padding:
    60px
    15px;

  text-align:center;

  color:#8993ad;

  animation:
    cardIn .4s ease;
}


/* =====================================================
   MODAL
===================================================== */

.modal{

  position:fixed;

  inset:0;

  display:none;

  align-items:flex-end;

  justify-content:center;

  background:
    rgba(2,4,12,.84);

  backdrop-filter:
    blur(12px);

  z-index:1000;

  animation:
    modalBg .25s ease;
}

.modal.show{
  display:flex;
}

@keyframes modalBg{

  from{
    opacity:0;
  }

  to{
    opacity:1;
  }

}

.modal-box{

  width:100%;

  max-width:650px;

  max-height:92vh;

  overflow-y:auto;

  padding:
    20px;

  border-radius:
    30px
    30px
    0
    0;

  background:
    linear-gradient(
      145deg,
      #151c35,
      #090e1e
    );

  box-shadow:
    0 -20px 70px
    rgba(0,0,0,.45);

  animation:
    modalUp .35s ease;
}

@keyframes modalUp{

  from{
    transform:translateY(100%);
  }

  to{
    transform:translateY(0);
  }

}

.light .modal-box{

  background:
    linear-gradient(
      145deg,
      #fff,
      #f3f5fb
    );

  color:#171a2c;
}

.modal-head{

  display:flex;

  align-items:center;

  justify-content:space-between;

  margin-bottom:18px;
}

.modal-head h2{

  font-size:19px;

  font-weight:900;
}

.close-btn{

  width:42px;
  height:42px;

  border:0;

  border-radius:14px;

  background:#252d47;

  color:#fff;

  font-size:19px;

  cursor:pointer;
}

.detail-content{
  color:#dce2f1;
}

.light .detail-content{
  color:#24283b;
}


/* =====================================================
   DETAIL HERO
===================================================== */

.detail-hero{

  padding:
    18px 10px;

  text-align:center;

  border-radius:23px;

  background:
    linear-gradient(
      135deg,
      rgba(46,105,255,.12),
      rgba(132,53,238,.12)
    );

  border:
    1px solid
    rgba(255,255,255,.06);

  margin-bottom:15px;
}

.detail-competition{

  color:#929db8;

  font-size:12px;

  margin-bottom:8px;
}

.detail-status{

  font-size:11px;

  font-weight:900;

  margin-bottom:10px;
}

.detail-status.live{
  color:#ff6173;
}

.detail-main-score{

  font-size:38px;

  font-weight:950;

  letter-spacing:2px;

  margin:8px 0;
}

.detail-teams{

  display:grid;

  grid-template-columns:
    1fr
    1fr;

  gap:10px;

  margin-top:15px;
}

.detail-team{

  padding:
    14px 8px;

  border-radius:18px;

  background:
    rgba(255,255,255,.045);
}

.detail-team-name{

  font-size:13px;

  font-weight:800;

  line-height:1.3;
}

.detail-team-score{

  margin-top:6px;

  font-size:22px;

  font-weight:950;
}


/* =====================================================
   DETAIL SECTIONS
===================================================== */

.detail-section{

  margin-top:13px;

  padding:
    15px;

  border-radius:20px;

  background:
    rgba(255,255,255,.035);

  border:
    1px solid
    rgba(255,255,255,.045);
}

.detail-section h3{

  margin-bottom:11px;

  font-size:15px;

  font-weight:900;
}

.detail-row{

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:12px;

  padding:
    8px
    0;

  border-bottom:
    1px solid
    rgba(255,255,255,.045);

  font-size:12px;
}

.detail-row:last-child{
  border-bottom:0;
}

.detail-row strong{
  text-align:right;
}


/* =====================================================
   INCIDENTS
===================================================== */

.incident{

  display:grid;

  grid-template-columns:
    45px
    35px
    1fr;

  align-items:center;

  gap:8px;

  padding:
    10px
    0;

  border-bottom:
    1px solid
    rgba(255,255,255,.045);

  animation:

  >

  >

     TOAST

  id="toast"

<script>

/* =====================================================
   SETTINGS
===================================================== */

const API_BASE = "";

let sport = "football";

let currentFilter = "all";

let allMatches = [];

let selectedDate =
  getDateString(new Date());

let loading = false;

let firstLoad = true;

let soundEnabled =
  localStorage.getItem(
    "fanZoneSound"
  ) !== "off";

let favorites =
  JSON.parse(
    localStorage.getItem(
      "footballFanFavorites"
    ) || "[]"
  );

let audioContext = null;


/* =====================================================
   DATE
===================================================== */

function getDateString(date){

  return (
    date.getFullYear() +
    "-" +
    String(
      date.getMonth()+1
    ).padStart(2,"0") +
    "-" +
    String(
      date.getDate()
    ).padStart(2,"0")
  );

}


function getDateObject(value){

  const parts =
    String(value).split("-");

  return new Date(
    Number(parts[0]),
    Number(parts[1])-1,
    Number(parts[2])
  );

}


function getDayName(date){

  return date.toLocaleDateString(
    "bn-BD",
    {
      weekday:"short"
    }
  );

}


function formatShortDate(date){

  return date.toLocaleDateString(
    "bn-BD",
    {
      day:"numeric",
      month:"short"
    }
  );

}


function renderDates(){

  const box =
    document.getElementById(
      "dateScroll"
    );

  box.innerHTML = "";

  const center =
    getDateObject(
      selectedDate
    );

  for(
    let i=-3;
    i<=3;
    i++
  ){

    const date =
      new Date(center);

    date.setDate(
      center.getDate()+i
    );

    const value =
      getDateString(date);

    const btn =
      document.createElement(
        "button"
      );

    btn.className =
      "date-chip";

    if(
      value === selectedDate
    ){
      btn.classList.add("active");
    }

    if(
      value ===
      getDateString(new Date())
    ){
      btn.classList.add("today");
    }

    btn.innerHTML = `

      <span class="day">
        ${getDayName(date)}
      </span>

      <span class="number">
        ${date.getDate()}
      </span>

    `;

    btn.onclick = () => {

      selectedDate =
        value;

      renderDates();

      updateSelectedDateText();

      loadMatches(true);

    };

    box.appendChild(btn);

  }

}


function updateSelectedDateText(){

  const today =
    getDateString(
      new Date()
    );

  const date =
    getDateObject(
      selectedDate
    );

  document.getElementById(
    "selectedDateText"
  ).textContent =

    selectedDate === today
      ? "আজ"
      : formatShortDate(date);

}


/* =====================================================
   SPORT
===================================================== */

function changeSport(value){

  sport = value;

  document
    .getElementById("footballBtn")
    .classList.toggle(
      "active",
      sport === "football"
    );

  document
    .getElementById("cricketBtn")
    .classList.toggle(
      "active",
      sport === "cricket"
    );

  loadMatches(true);

}


/* =====================================================
   LOAD
===================================================== */

async function loadMatches(
  showLoading=false
){

  if(loading){
    return;
  }

  loading = true;

  const box =
    document.getElementById(
      "matches"
    );

  const updateText =
    document.getElementById(
      "updateText"
    );

  if(
    firstLoad ||
    showLoading
  ){

    box.innerHTML = `

      <div class="loading">

        <div class="spinner"></div>

        ম্যাচ লোড হচ্ছে...

      </div>

    `;

  }

  updateText.classList.add(
    "updating"
  );

  updateText.textContent =
    "আপডেট হচ্ছে...";

  try{

    const url =
      `/api/${sport}` +
      `?date=${encodeURIComponent(
        selectedDate
      )}` +
      `&_=${Date.now()}`;

    const response =
      await fetch(
        url,
        {
          cache:"no-store"
        }
      );

    if(!response.ok){

      throw new Error(
        "API Error " +
        response.status
      );

    }

    const data =
      await response.json();

    let newMatches = [];

    if(
      Array.isArray(data)
    ){

      newMatches = data;

    }
    else if(
      Array.isArray(data.matches)
    ){

      newMatches =
        data.matches;

    }
    else if(
      Array.isArray(data.data)
    ){

      newMatches =
        data.data;

    }

    detectScoreChanges(
      allMatches,
      newMatches
    );

    allMatches =
      newMatches;

    renderMatches();

    updateTime();

    firstLoad = false;

  }
  catch(error){

    console.error(
      "LOAD ERROR:",
      error
    );

    if(firstLoad){

      box.innerHTML = `

        <div class="empty">

          😕 ম্যাচ ডাটা পাওয়া যাচ্ছে না।

          <br><br>

          🔄 আবার Refresh করুন।

        </div>

      `;

    }

    updateText.textContent =
      "আপডেট ব্যর্থ";

  }
  finally{

    loading = false;

    updateText.classList.remove(
      "updating"
    );

  }

}


/* =====================================================
   MANUAL REFRESH
===================================================== */

function manualRefresh(){

  initAudio();

  loadMatches(true);

  playClickSound();

  showToast(
    "🔄 Live score আপডেট হচ্ছে..."
  );

}


/* =====================================================
   UPDATE TIME
===================================================== */

function updateTime(){

  const now =
    new Date();

  document.getElementById(
    "updateText"
  ).textContent =

    "শেষ আপডেট: " +

    now.toLocaleTimeString(
      "bn-BD",
      {
        hour:"numeric",
        minute:"2-digit",
        second:"2-digit"
      }
    );

}


/* =====================================================
   FILTER
===================================================== */

function changeFilter(value){

  initAudio();

  currentFilter =
    value;

  document
    .querySelectorAll(
      ".filter-btn"
    )
    .forEach(
      btn => {

        btn.classList.toggle(
          "active",
          btn.dataset.filter === value
        );

      }
    );

  renderMatches();

  playClickSound();

}


/* =====================================================
   SEARCH
===================================================== */

document
  .getElementById(
    "searchInput"
  )
  .addEventListener(
    "input",
    renderMatches
  );


/* =====================================================
   FILTER MATCHES
===================================================== */

function getFilteredMatches(){

  let matches =
    [...allMatches];

  if(
    currentFilter ===
    "favorites"
  ){

    matches =
      matches.filter(
        match =>
          favorites.includes(
            getMatchId(match)
          )
      );

  }

  if(
    currentFilter ===
    "live"
  ){

    matches =
      matches.filter(
        isLive
      );

  }

  if(
    currentFilter ===
    "finished"
  ){

    matches =
      matches.filter(
        isFinished
      );

  }

  if(
    currentFilter ===
    "upcoming"
  ){

    matches =
      matches.filter(
        match =>
          !isLive(match) &&
          !isFinished(match)
      );

  }

  const search =
    document
      .getElementById(
        "searchInput"
      )
      .value
      .trim()
      .toLowerCase();

  if(search){

    matches =
      matches.filter(
        match =>
          JSON.stringify(match)
            .toLowerCase()
            .includes(search)
      );

  }

  return matches;

}


/* =====================================================
   STATUS
===================================================== */

function getStatusText(match){

  return String(
    match.status_text ||
    match.status ||
    match.state ||
    match.match_status ||
    ""
  ).toLowerCase();

}


function isLive(match){

  const text =
    getStatusText(match);

  return (

    text.includes("live") ||

    text.includes("inplay") ||

    text.includes("in-play") ||

    text.includes("playing") ||

    text.includes("1st") ||

    text.includes("2nd") ||

    text.includes("half") ||

    text.includes("quarter") ||

    text === "1" ||

    text === "2"

  );

}


function isFinished(match){

  const text =
    getStatusText(match);

  return (

    text.includes("finished") ||

    text.includes("finish") ||

    text.includes("ended") ||

    text.includes("complete") ||

    text.includes("full time") ||

    text.includes("result") ||

    text === "ft"

  );

}


/* =====================================================
   MATCH ID / SLUG
===================================================== */

function getMatchId(match){

  return String(

    match.id ||

    match.match_id ||

    match.fixture_id ||

    match.tracker?.id ||

    extractSlug(
      match.url
    ) ||

    match.slug ||

    match.match_slug ||

    (
      (match.home || "") +
      "-" +
      (match.away || "")
    )

  );

}


function extractSlug(url){

  if(!url){
    return "";
  }

  const clean =
    String(url)
      .split("?")[0]
      .replace(/\/+$/,"");

  const parts =
    clean.split("/");

  return (
    parts[parts.length-1] ||
    ""
  );

}


function getMatchSlug(match){

  return String(

    match.slug ||

    match.match_slug ||

    match.tracker?.id ||

    extractSlug(
      match.url
    ) ||

    getMatchId(match)

  );

}


/* =====================================================
   SCORE
===================================================== */

function findNestedValue(
  obj,
  keys
){

  if(
    !obj ||
    typeof obj !== "object"
  ){
    return null;
  }

  for(
    const key of keys
  ){

    if(
      obj[key] !== undefined &&
      obj[key] !== null
    ){

      return obj[key];

    }

  }

  return null;

}


function getScore(
  match,
  side
){

  const names =
    side === "home"

      ?

      [
        "home_score",
        "homeScore",
        "home_runs",
        "home_run",
        "score_home"
      ]

      :

      [
        "away_score",
        "awayScore",
        "away_runs",
        "away_run",
        "score_away"
      ];

  const direct =
    findNestedValue(
      match,
      names
    );

  if(
    direct !== null
  ){

    return String(direct);

  }

  const team =
    match[side];

  if(
    team &&
    typeof team === "object"
  ){

    const nested =
      findNestedValue(
        team,
        [
          "score",
          "runs",
          "points",
          "goals"
        ]
      );

    if(
      nested !== null
    ){

      return String(nested);

    }

  }

  return "-";

}


/* =====================================================
   WICKETS
===================================================== */

function getWickets(
  match,
  side
){

  const names =
    side === "home"

      ?

      [
        "home_wickets",
        "homeWickets",
        "home_wicket"
      ]

      :

      [
        "away_wickets",
        "awayWickets",
        "away_wicket"
      ];

  const value =
    findNestedValue(
      match,
      names
    );

  return value === null
    ? null
    : value;

}


/* =====================================================
   OVERS
===================================================== */

function getOvers(match){

  const value =
    findNestedValue(
      match,
      [
        "overs",
        "over",
        "current_over",
        "current_overs",
        "home_overs",
        "away_overs"
      ]
    );

  return value === null
    ? ""
    : String(value);

}


/* =====================================================
   SCORE CHANGE
===================================================== */

function getScoreKey(match){

  return [

    getMatchId(match),

    getScore(
      match,
      "home"
    ),

    getScore(
      match,
      "away"
    ),

    getOvers(match),

    match.live_minute || "",

  ].join("|");

}


function detectScoreChanges(
  oldMatches,
  newMatches
){

  if(
    !oldMatches.length
  ){
    return;
  }

  const oldMap = {};

  oldMatches.forEach(
    match => {

      oldMap[
        getMatchId(match)
      ] =
        getScoreKey(match);

    }
  );

  newMatches.forEach(
    match => {

      const id =
        getMatchId(match);

      const oldKey =
        oldMap[id];

      const newKey =
        getScoreKey(match);

      if(
        oldKey &&
        oldKey !== newKey &&
        isLive(match)
      ){

        notifyScoreChange(
          match
        );

      }

    }
  );

}


/* =====================================================
   RENDER
===================================================== */

function renderMatches(){

  const box =
    document.getElementById(
      "matches"
    );

  const matches =
    getFilteredMatches();

  if(!matches.length){

    box.innerHTML = `

      <div class="empty">

        🏟️

        <br><br>

        এই তারিখে কোনো ম্যাচ পাওয়া যায়নি।

      </div>

    `;

    return;

  }

  box.innerHTML =
    matches
      .map(
        (
          match,
          index

            match,
            index
          )
      )

}


/* =====================================================
   MATCH CARD
===================================================== */

function createMatchCard(
  match,
  index
){

  const home =
    match.home ||
    match.home_team ||
    match.home_name ||
    "Home";

  const away =
    match.away ||
    match.away_team ||
    match.away_name ||
    "Away";

  const homeLogo =
    match.home_logo ||
    match.home_image ||
    match.home_team_logo ||
    "";

  const awayLogo =
    match.away_logo ||
    match.away_image ||
    match.away_team_logo ||
    "";

  const competition =
    match.competition ||
    match.league ||
    match.tournament ||
    "Match";

  const competitionLogo =
    match.competition_logo ||
    match.league_logo ||
    "";

  let homeScore =
    getScore(
      match,
      "home"
    );

  let awayScore =
    getScore(
      match,
      "away"
    );

  const homeWickets =
    getWickets(
      match,
      "home"
    );

  const awayWickets =
    getWickets(
      match,
      "away"
    );

  const overs =
    getOvers(match);

  const live =
    isLive(match);

  const finished =
    isFinished(match);

  const status =
    match.status_text ||
    match.status ||
    (
      live
        ? "Live"
        : finished
          ? "Finished"
          : "Not started"
    );

  const time =
    match.time ||
    match.date_time ||
    match.start_time ||
    match.startTime ||
    "";

  const id =
    getMatchId(match);

  const fav =
    favorites.includes(id);

  const cricket =
    sport === "cricket";

  const footballMinute =
    match.live_minute ??
    match.minute ??
    match.minutes ??
    match.elapsed ??
    match.match_minute ??
    "";

  if(
    cricket &&
    homeWickets !== null &&
    !String(homeScore).includes("/")
  ){

    homeScore =
      `${homeScore}/${homeWickets}`;

  }

  if(
    cricket &&
    awayWickets !== null &&
    !String(awayScore).includes("/")
  ){

    awayScore =
      `${awayScore}/${awayWickets}`;

  }

  return `

    <div

    >

      <div class="competition">

          "🏆"

        }

        <span>
          ${escapeHtml(
            competition
          )}
        </span>

      </div>


      <button
        class="favorite ${
          fav ? "active" : ""
        }"
        onclick="
          toggleFavoriteByIndex(
            event,
            ${index}
          )
        "
      >
        ${fav ? "★" : "☆"}
      </button>


      <div class="teams">


        <div class="team">

          ${
            homeLogo

            ?

            `
              <img
                class="team-logo"
                src="${safeUrl(
                  homeLogo
                )}"
                onerror="
                  this.style.display='none'
                "
              >
            `

            :

            `
              <div class="team-placeholder">
                ${cricket ? "🏏" : "⚽"}
              </div>
            `
          }

          <div class="team-name">
            ${escapeHtml(home)}
          </div>

        </div>


        <div class="score-area">

          <div class="score">

            ${escapeHtml(
              String(homeScore)
            )}

            :

            ${escapeHtml(
              String(awayScore)
            )}

          </div>


          ${
            cricket && overs

            ?

            `
              <div class="cricket-summary">

                <strong>
                  ${escapeHtml(overs)}
                </strong>

                <span class="cricket-overs">
                  Overs
                </span>

              </div>
            `

            :

            ""
          }


          ${
            !cricket &&
            live &&
            footballMinute !== ""

            ?

            `
              <div class="football-minute">

                ${escapeHtml(
                  String(
                    footballMinute
                  )
                )}'

              </div>
            `

            :

            ""
          }


          <div class="
            status-badge
            ${live ? "live" : ""}
          ">

            ${
              live

              ?

              `
                <span
                  class="status-pulse"

                LIVE
              `

              )

            :

                ${cricket ? "🏏" : "⚽"}
              </div>
            `

/* =====================================================

function renderDetailedScoreboard(

){

  const box =
    document.getElementById(
      "apiScorecard"
    );

  if(!box){
    return;
  }

  const data =
    response.match ||
    response.data ||

  if(!data){

    return;

  }

  let html = "";


  /* =============================================
     BASIC SCORE
  ============================================= */

  const home =
    data.home ||
    data.home_team ||
    "Home";

  const away =
    data.away ||
    data.away_team ||
    "Away";

  const homeScore =
    data.home_score ??
    getScore(
      data,
      "home"
    );

  const awayScore =
    data.away_score ??
    getScore(
      data,
      "away"
    );


  html += `

    <div class="detail-section">

      <h3>
        🏆 বর্তমান Scoreboard

          ${escapeHtml(home)}

        </strong>

          ${escapeHtml(away)}
        </span>

        <strong>
          ${escapeHtml(
            String(awayScore)
          )}
        </strong>

      </div>


      ${
        data.status_text ||
        data.status

        ?

        `
          <div class="detail-row">

            <span>
              Status
            </span>

            <strong>
              ${escapeHtml(
                String(
                  data.status_text ||
                  data.status
                )
              )}
            </strong>

          </div>
        `

        :

        ""
      }

    </div>

  `;


  /* =============================================
     HALF TIME
  ============================================= */

  if(
    data.home_ht_score !== undefined ||
    data.away_ht_score !== undefined
  ){

    html += `

      <div class="detail-section">

        <h3>
          ⏱️ Half Time Score
        </h3>

        <div class="detail-row">

          <span>
            HT Score
          </span>

          <strong>

            ${escapeHtml(
              String(
                data.home_ht_score ??
                "-"
              )
            )}

            :

            ${escapeHtml(
              String(
                data.away_ht_score ??
                "-"
              )
            )}

          </strong>

        </div>

  /* =============================================
     FOOTBALL INCIDENTS
  ============================================= */

    Array.isArray(
      data.incidents
    ) &&
    data.incidents.length
  ){

    html += `

      <div class="detail-section">

        <h3>
          ⚡ ম্যাচের ঘটনা
        </h3>

            .reverse()
            .map(
              incident =>
                renderIncident(
                  incident,
                  home,
                  away
                )
            )
            .join("")
        }

      </div>

    `;

  }


  /* =============================================
     STATS
  ============================================= */

  if(
    data.stats &&
    (
      Array.isArray(data.stats)
      ||
      typeof data.stats === "object"
    )
  ){

    const statsHtml =
      renderStats(
        data.stats
      );

    if(statsHtml){

      html += `

        <div class="detail-section">

          <h3>
            📈 Match Statistics
          </h3>

          ${statsHtml}

        </div>

      `;

    }

  /* =============================================
     LINEUPS
  ============================================= */

  if(
    data.lineups
  ){

    html +=

        data.lineups
      );

  /* =============================================
     TRACKER
  ============================================= */

  if(
    data.tracker

     IF NOTHING
  ============================================= */

  if(
    !html.trim()
  ){

    return;

  }

  box.innerHTML =
    html;

}


/* =====================================================
   INCIDENT RENDER
===================================================== */

function renderIncident(
  incident,
  home,
  away
){

  const type =
    String(
      incident.type ||
      ""
    ).toLowerCase();

  let icon =
    "⚡";

  if(
    incident.is_goal ||
    type.includes("goal")
  ){

    icon = "⚽";

  }
  else if(
    incident.is_card ||
    type.includes("yellow")
  ){

    icon = "🟨";

  }
  else if(
    type.includes("red")
  ){

    icon = "🟥";

  }
  else if(
    incident.is_sub ||
    type.includes("substitution")
  ){

    icon = "🔄";

  }


  let playerText =
    incident.player ||
    "";

  if(
    incident.is_sub
  ){

    playerText =

      `${incident.player_in || ""}` +
      (
        incident.player_out
          ? ` ← ${incident.player_out}`
          : ""
      );

  }


  let sideText =
    "";

  if(
    incident.side === "home"
  ){

    sideText = home;

  }
  else if(
    incident.side === "away"
  ){

    sideText = away;

  }


  return `

    <div class="incident">

      <div class="incident-time">

        ${escapeHtml(
          String(
            incident.time ??
            "-"
          )
        )}'

      </div>


      <div class="incident-icon">

        ${icon}

      </div>


      <div class="incident-text">

        <strong>

          ${escapeHtml(
            playerText ||
            incident.type ||
            "Event"
          )}

        </strong>


        <span class="incident-side">

          ${
            escapeHtml(
              sideText
            )
          }

          ${
            incident.type
              ? " • " +
                escapeHtml(
                  String(
                    incident.type
                  )
                )
              : ""
          }

        </span>

      </div>

    </div>

  `;

}

    );

      "none";

    away.style.display =
      "flex";

  }

}


/* =====================================================
   STATS
===================================================== */

function renderStats(
  stats
){

  const rows = [];

  function walk(
    obj,
    depth=0
  ){

    if(
      depth > 4 ||
      !obj
    ){
      return;
    }

    if(
      Array.isArray(obj)
    ){

      obj.forEach(
        item =>
          walk(
            item,
            depth+1
          )
      );

      return;

    }

    if(
      typeof obj !== "object"
    ){

      return;

    }

    Object.keys(obj)
      .forEach(
        key => {

          const value =
            obj[key];

          if(
            value === null ||
            value === undefined
          ){

            return;

          }

          if(
            typeof value === "object"
          ){

            walk(
              value,
              depth+1
            );

            return;

          }

          const lower =
            key.toLowerCase();

          if(
            lower.includes("home") ||
            lower.includes("away") ||
            lower.includes("stat") ||
            lower.includes("value")
          ){

            rows.push([
              key,
              String(value)
            ]);

          }

        }
      );

  }

  walk(stats);

  if(
    !rows.length
  ){

    return "";

  }


  return rows
    .slice(0,30)
    .map(
      row => `

        <div class="detail-row">

          <span>
            ${escapeHtml(
              row[0]
            )}
          </span>

          <strong>
            ${escapeHtml(
              row[1]
            )}
          </strong>

        </div>

      `
    )
    .join("");

}

function toggleFavoriteByIndex(
  event,
  index
){

  event.stopPropagation();

  initAudio();

  const matches =
    getFilteredMatches();

  const match =
    matches[index];

  if(!match){
    return;
  }

  toggleFavorite(
    getMatchId(match)
  );

}


function toggleFavorite(id){

  if(
    favorites.includes(id)
  ){

    favorites =
      favorites.filter(
        item =>
          item !== id
      );

    showToast(
      "⭐ Favorites থেকে সরানো হয়েছে"
    );

  }
  else{

    favorites.push(id);

    showToast(
      "⭐ Favorites এ যোগ হয়েছে"
    );

    playFavoriteSound();

  }

  localStorage.setItem(
    "footballFanFavorites",
    JSON.stringify(
      favorites
    )
  );

  renderMatches();

}


/* =====================================================
   SOUND ENGINE
===================================================== */

function initAudio(){

  try{

    if(!audioContext){

      audioContext =
        new (
          window.AudioContext ||
          window.webkitAudioContext
        )();

    }

    if(
      audioContext.state ===
      "suspended"
    ){

      audioContext.resume();

    }

  }
  catch(error){

    console.log(
      "Audio unavailable"
    );

  }

}


function playTone(
  frequency,
  duration,
  type="sine",
  volume=.05
){

  if(
    !soundEnabled
  ){
    return;
  }

  try{

    initAudio();

    if(!audioContext){
      return;
    }

    const oscillator =
      audioContext.createOscillator();

    const gain =
      audioContext.createGain();

    oscillator.type =
      type;

    oscillator.frequency.value =
      frequency;

    gain.gain.setValueAtTime(
      0.0001,
      audioContext.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
      volume,
      audioContext.currentTime+.02
    );

    gain.gain.exponentialRampToValueAtTime(
      0.0001,
      audioContext.currentTime+duration
    );

    oscillator.connect(gain);

    gain.connect(
      audioContext.destination
    );

    oscillator.start();

    oscillator.stop(
      audioContext.currentTime+
      duration
    );

  }
  catch(error){

    console.log(
      "Sound error:",
      error
    );

  }

}


function playClickSound(){

  if(!soundEnabled){
    return;
  }

  playTone(
    520,
    .07,
    "sine",
    .025
  );

}


function playGoalSound(){

  if(!soundEnabled){
    return;
  }

  playTone(
    523,
    .12,
    "sine",
    .06
  );

  setTimeout(
    () =>
      playTone(
        659,
        .12,
        "sine",
        .06
      ),
    110
  );

  setTimeout(
    () =>
      playTone(
        784,
        .20,
        "sine",
        .07
      ),
    220
  );

}


function playFavoriteSound(){

  if(!soundEnabled){
    return;
  }

  playTone(
    700,
    .08,
    "triangle",
    .035
  );

  setTimeout(
    () =>
      playTone(
        900,
        .12,
        "triangle",
        .035
      ),
    90
  );

}


function toggleSound(){

  initAudio();

  soundEnabled =
    !soundEnabled;

  localStorage.setItem(
    "fanZoneSound",
    soundEnabled
      ? "on"
      : "off"
  );

  const btn =
    document.getElementById(

  btn.textContent =
    soundEnabled
      ? "🔊"
      : "🔇";

  btn.classList.toggle(

  );

  if(soundEnabled){

    );

  }

    );

  }

}


/* =====================================================
   SCORE NOTIFICATION
===================================================== */

async function notifyScoreChange(
  match
){

  const home =
    match.home ||
    match.home_team ||
    "Home";

  const away =
    match.away ||
    match.away_team ||
    "Away";

  const homeScore =
    getScore(
      match,
      "home"
    );

  const awayScore =
    getScore(
      match,
      "away"
    );


  playGoalSound();


  showToast(
    `⚽ ${home} ${homeScore} - ${awayScore} ${away}`
  );


  if(
    "Notification" in window
  ){

    try{

      if(
        Notification.permission ===
        "default"
      ){

        await Notification.requestPermission();

      }

      if(
        Notification.permission ===
        "granted"
      ){

        new Notification(
          "⚽ Football Fan Zone",
          {
            body:
              `${home} ${homeScore} - ` +
              `${awayScore} ${away}`,

            icon:
              match.home_logo ||
              undefined
          }
        );

      }

    }
    catch(error){

      console.log(
        "Notification error:",
        error
      );

    }

  }

}

/* =====================================================
   DATE FORMAT
===================================================== */

function formatDate(value){

  if(!value){

    return "সময় পাওয়া যায়নি";

  }

  try{

    const date =
      new Date(value);

    if(
      isNaN(
        date.getTime()
      )
    ){

      return escapeHtml(
        String(value)
      );

    }

    return date.toLocaleString(
      "bn-BD",
      {
        day:"numeric",
        month:"short",
        year:"numeric",
        hour:"numeric",
        minute:"2-digit"
      }
    );

  }
  catch{

    return escapeHtml(
      String(value)
    );

  }

}


/* =====================================================
   SECURITY
===================================================== */

function escapeHtml(text){

  return String(text)

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}


function safeUrl(url){

  const value =
    String(url || "");

  if(
    value.startsWith(
      "https://"
    ) ||
    value.startsWith(
      "http://"
    )
  ){

    return value;

  }

  return "";

}


/* =====================================================
   TOAST
===================================================== */

let toastTimer;

function showToast(message){

  const toast =
    document.getElementById(
      "toast"
    );

  toast.textContent =
    message;

  toast.classList.add(
    "show"
  );

  clearTimeout(
    toastTimer
  );

  toastTimer =
    setTimeout(
      () => {

        toast.classList.remove(
          "show"
        );

      },
      2800
    );

}
