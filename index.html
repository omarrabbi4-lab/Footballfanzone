<!DOCTYPE html>
<html lang="bn">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<meta
  name="theme-color"
  content="#090d1d"
>

<title>Football Fan Zone</title>

<style>

/* ================================
   RESET
================================ */

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{

  font-family:
    Arial,
    "Noto Sans Bengali",
    sans-serif;

  background:
    radial-gradient(
      circle at top left,
      #172b66 0,
      #090d1d 42%,
      #070a15 100%
    );

  color:#fff;

  min-height:100vh;

  padding-bottom:90px;

  overflow-x:hidden;
}

body.light{

  background:
    linear-gradient(
      135deg,
      #eef2ff,
      #ffffff
    );

  color:#15182a;
}


/* ================================
   HEADER
================================ */

.header{

  padding:20px 18px 12px;

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:12px;
}

.brand{

  display:flex;

  align-items:center;

  gap:12px;
}

.brand-icon{

  width:58px;
  height:58px;

  border-radius:18px;

  display:flex;

  align-items:center;

  justify-content:center;

  font-size:31px;

  background:
    linear-gradient(
      135deg,
      #286cff,
      #7b36ee
    );

  box-shadow:
    0 8px 25px
    rgba(56,93,255,.35);
}

.brand-title{

  font-size:24px;

  font-weight:800;
}

.brand-sub{

  margin-top:5px;

  color:#9da5bd;

  font-size:14px;
}

.header-actions{

  display:flex;

  gap:9px;
}

.icon-btn{

  width:50px;
  height:50px;

  border:0;

  border-radius:16px;

  background:#171c30;

  color:#fff;

  font-size:23px;

  cursor:pointer;
}

.light .icon-btn{

  background:#e7eafa;

  color:#161a2c;
}


/* ================================
   SEARCH
================================ */

.search-box{

  margin:10px 24px 14px;

  height:80px;

  border-radius:25px;

  background:
    rgba(27,31,49,.9);

  border:1px solid
    rgba(255,255,255,.07);

  display:flex;

  align-items:center;

  padding:0 20px;

  box-shadow:
    0 10px 30px
    rgba(0,0,0,.15);
}

.light .search-box{

  background:#fff;

  border-color:#e2e5ef;
}

.search-box span{

  font-size:25px;

  margin-right:13px;
}

.search-box input{

  width:100%;

  background:none;

  border:0;

  outline:0;

  color:#fff;

  font-size:17px;
}

.light .search-box input{

  color:#111;
}

.search-box input::placeholder{

  color:#777d92;
}


/* ================================
   SPORTS
================================ */

.sport-tabs{

  display:grid;

  grid-template-columns:1fr 1fr;

  gap:12px;

  padding:10px 24px 16px;
}

.sport-btn{

  height:74px;

  border:0;

  border-radius:24px;

  background:#171b2d;

  color:#fff;

  font-size:20px;

  font-weight:700;

  cursor:pointer;

  transition:.25s;
}

.sport-btn.active{

  background:
    linear-gradient(
      135deg,
      #286cff,
      #8136ec
    );

  box-shadow:
    0 10px 30px
    rgba(79,74,255,.35);
}

.light .sport-btn{

  background:#e7eafa;

  color:#22263a;
}

.light .sport-btn.active{

  color:#fff;
}


/* ================================
   DATE
================================ */

.date-section{

  margin:2px 0 8px;

  padding:0 20px;
}

.date-title{

  display:flex;

  align-items:center;

  justify-content:space-between;

  margin-bottom:10px;
}

.date-title-left{

  font-size:16px;

  font-weight:700;
}

.date-title-right{

  color:#8f98b2;

  font-size:13px;
}

.date-scroll{

  display:flex;

  gap:9px;

  overflow-x:auto;

  padding:3px 4px 9px;

  scrollbar-width:none;
}

.date-scroll::-webkit-scrollbar{

  display:none;
}

.date-chip{

  flex:0 0 auto;

  min-width:68px;

  padding:10px 9px;

  border:1px solid
    rgba(255,255,255,.07);

  border-radius:18px;

  background:
    rgba(29,35,61,.85);

  color:#aeb5ca;

  text-align:center;

  cursor:pointer;

  transition:.2s;
}

.date-chip .day{

  display:block;

  font-size:12px;

  margin-bottom:5px;
}

.date-chip .number{

  display:block;

  font-size:19px;

  font-weight:800;

  color:#fff;
}

.date-chip.active{

  background:
    linear-gradient(
      135deg,
      #316dff,
      #7d39ee
    );

  border-color:transparent;

  color:#fff;

  transform:translateY(-2px);

  box-shadow:
    0 8px 20px
    rgba(65,75,255,.3);
}

.date-chip.today{

  border-color:#536cff;
}

.light .date-chip{

  background:#fff;

  color:#73798d;

  border-color:#e2e5ef;
}

.light .date-chip .number{

  color:#20243a;
}

.light .date-chip.active .number{

  color:#fff;
}


/* ================================
   FILTERS
================================ */

.filters{

  display:flex;

  gap:9px;

  padding:8px 24px 12px;

  overflow-x:auto;

  scrollbar-width:none;
}

.filters::-webkit-scrollbar{

  display:none;
}

.filter-btn{

  flex:0 0 auto;

  border:0;

  padding:12px 17px;

  border-radius:22px;

  background:#1a2035;

  color:#d6d9e5;

  font-size:15px;

  cursor:pointer;
}

.filter-btn.active{

  background:
    linear-gradient(
      135deg,
      #376cff,
      #7c39ed
    );

  color:#fff;
}


/* ================================
   INFO
================================ */

.info-bar{

  padding:8px 24px 12px;

  display:flex;

  align-items:center;

  justify-content:space-between;

  color:#9fa7bd;

  font-size:13px;
}

.live-dot{

  width:10px;

  height:10px;

  background:#20c875;

  border-radius:50%;

  display:inline-block;

  margin-right:7px;

  box-shadow:
    0 0 12px
    rgba(32,200,117,.7);
}

.realtime{

  display:flex;

  align-items:center;

  gap:5px;
}

.refreshing{

  animation:
    refreshSpin .7s linear;
}

@keyframes refreshSpin{

  to{
    transform:rotate(360deg);
  }

}


/* ================================
   MATCH CARD
================================ */

.matches{

  padding:0 24px;
}

.match-card{

  position:relative;

  margin-bottom:18px;

  padding:18px 15px 18px;

  border-radius:28px;

  background:
    linear-gradient(
      145deg,
      rgba(38,47,80,.97),
      rgba(19,25,48,.98)
    );

  border:1px solid
    rgba(255,255,255,.07);

  box-shadow:
    0 15px 40px
    rgba(0,0,0,.18);

  cursor:pointer;

  overflow:hidden;

  transition:
    transform .2s,
    box-shadow .2s;
}

.match-card.live-card{

  border-color:
    rgba(255,70,90,.35);

  box-shadow:
    0 12px 40px
    rgba(255,50,70,.10);
}

.match-card::before{

  content:"";

  position:absolute;

  top:-80px;

  right:-70px;

  width:170px;

  height:170px;

  border-radius:50%;

  background:
    radial-gradient(
      circle,
      rgba(76,91,255,.18),
      transparent 70%
    );

  pointer-events:none;
}

.match-card:active{

  transform:scale(.985);
}

.light .match-card{

  background:#fff;

  border-color:#e2e5ef;

  box-shadow:
    0 10px 30px
    rgba(40,50,90,.08);
}


/* ================================
   COMPETITION
================================ */

.competition{

  display:flex;

  align-items:center;

  gap:9px;

  color:#aab1c6;

  font-size:14px;

  margin-bottom:19px;

  padding-right:55px;
}

.competition img{

  width:27px;

  height:27px;

  object-fit:contain;

  border-radius:7px;
}


/* ================================
   FAVORITE
================================ */

.favorite{

  position:absolute;

  top:15px;

  right:15px;

  width:45px;

  height:45px;

  border:0;

  border-radius:15px;

  background:
    rgba(255,255,255,.08);

  color:#fff;

  font-size:23px;

  cursor:pointer;

  z-index:5;
}

.favorite.active{

  color:#ffd52e;

  background:
    rgba(255,213,46,.10);
}


/* ================================
   TEAMS
================================ */

.teams{

  display:grid;

  grid-template-columns:
    1fr
    110px
    1fr;

  align-items:center;

  text-align:center;

  gap:5px;
}

.team{

  min-width:0;
}

.team-logo{

  width:72px;

  height:72px;

  margin:0 auto;

  object-fit:contain;

  display:block;

  filter:
    drop-shadow(
      0 7px 10px
      rgba(0,0,0,.25)
    );
}

.team-placeholder{

  width:72px;

  height:72px;

  margin:auto;

  display:flex;

  align-items:center;

  justify-content:center;

  font-size:48px;
}

.team-name{

  margin-top:10px;

  font-size:16px;

  font-weight:750;

  line-height:1.25;

  word-break:break-word;
}


/* ================================
   SCORE
================================ */

.score-area{

  display:flex;

  flex-direction:column;

  align-items:center;

  justify-content:center;
}

.score{

  font-size:29px;

  font-weight:900;

  letter-spacing:1px;

  white-space:nowrap;
}

.score.live-score{

  color:#fff;

  text-shadow:
    0 0 16px
    rgba(255,255,255,.18);
}


/* ================================
   CRICKET SCORE
================================ */

.cricket-score{

  display:flex;

  flex-direction:column;

  align-items:center;

  gap:3px;
}

.cricket-main{

  font-size:27px;

  font-weight:900;

  white-space:nowrap;
}

.cricket-overs{

  color:#aeb5c9;

  font-size:11px;

  white-space:nowrap;
}


/* ================================
   RESULT
================================ */

.result-text{

  margin-top:8px;

  color:#65e09a;

  font-size:11px;

  font-weight:700;

  max-width:120px;

  line-height:1.3;
}


/* ================================
   STATUS
================================ */

.status-badge{

  display:inline-flex;

  align-items:center;

  justify-content:center;

  gap:5px;

  margin-top:9px;

  min-height:27px;

  padding:5px 10px;

  border-radius:20px;

  background:
    rgba(255,255,255,.07);

  color:#aeb5c9;

  font-size:11px;

  font-weight:600;
}

.status-badge.live{

  background:
    rgba(255,55,75,.13);

  color:#ff6070;
}

.status-pulse{

  width:7px;

  height:7px;

  border-radius:50%;

  background:#ff3f55;

  animation:
    livePulse 1.5s infinite;
}

@keyframes livePulse{

  0%{
    box-shadow:
      0 0 0 0
      rgba(255,63,85,.7);
  }

  70%{
    box-shadow:
      0 0 0 7px
      rgba(255,63,85,0);
  }

  100%{
    box-shadow:
      0 0 0 0
      rgba(255,63,85,0);
  }

}


/* ================================
   MATCH TIME
================================ */

.match-time{

  margin-top:20px;

  padding-top:13px;

  border-top:1px solid
    rgba(255,255,255,.06);

  text-align:center;

  color:#9fa8bf;

  font-size:13px;
}

.light .match-time{

  border-color:#edf0f5;
}


/* ================================
   LOADING
================================ */

.loading{

  text-align:center;

  padding:45px 10px;

  color:#9ea6bd;
}

.spinner{

  width:40px;

  height:40px;

  border:4px solid
    rgba(255,255,255,.12);

  border-top-color:#5571ff;

  border-radius:50%;

  animation:
    spin .8s linear infinite;

  margin:
    0 auto 15px;
}

@keyframes spin{

  to{
    transform:rotate(360deg);
  }

}

.empty{

  text-align:center;

  padding:50px 15px;

  color:#9da5ba;
}


/* ================================
   MODAL
================================ */

.modal{

  position:fixed;

  inset:0;

  background:
    rgba(2,4,12,.82);

  backdrop-filter:blur(10px);

  display:none;

  align-items:flex-end;

  justify-content:center;

  z-index:1000;
}

.modal.show{

  display:flex;
}

.modal-box{

  width:100%;

  max-width:600px;

  max-height:90vh;

  overflow:auto;

  background:
    linear-gradient(
      145deg,
      #171d35,
      #0d1224
    );

  border-radius:
    30px 30px 0 0;

  padding:22px;

  animation:
    slideUp .25s ease;
}

@keyframes slideUp{

  from{
    transform:translateY(100%);
  }

  to{
    transform:translateY(0);
  }

}

.modal-head{

  display:flex;

  align-items:center;

  justify-content:space-between;

  margin-bottom:20px;
}

.modal-head h2{

  font-size:20px;
}

.close-btn{

  width:42px;

  height:42px;

  border:0;

  border-radius:14px;

  background:#262d47;

  color:#fff;

  font-size:20px;
}

.detail-content{

  color:#dce0ec;
}

.detail-score{

  text-align:center;

  font-size:32px;

  font-weight:800;

  margin:20px 0;
}


/* ================================
   BOTTOM NAV
================================ */

.bottom-nav{

  position:fixed;

  left:0;

  right:0;

  bottom:0;

  height:82px;

  display:grid;

  grid-template-columns:
    repeat(4,1fr);

  background:
    rgba(9,13,29,.97);

  border-top:1px solid
    rgba(255,255,255,.06);

  backdrop-filter:blur(15px);

  z-index:900;
}

.nav-btn{

  border:0;

  background:none;

  color:#838aa0;

  font-size:13px;

  cursor:pointer;
}

.nav-btn span{

  display:block;

  font-size:25px;

  margin-bottom:4px;
}

.nav-btn.active{

  color:#fff;
}


/* ================================
   TOAST
================================ */

.toast{

  position:fixed;

  left:50%;

  bottom:100px;

  transform:
    translateX(-50%)
    translateY(20px);

  background:#20263c;

  color:#fff;

  padding:12px 18px;

  border-radius:15px;

  opacity:0;

  pointer-events:none;

  transition:.25s;

  z-index:2000;

  white-space:nowrap;
}

.toast.show{

  opacity:1;

  transform:
    translateX(-50%)
    translateY(0);
}


/* ================================
   DESKTOP
================================ */

@media(min-width:700px){

  body{

    max-width:850px;

    margin:auto;
  }

  .bottom-nav{

    max-width:850px;

    left:50%;

    transform:
      translateX(-50%);
  }

  .modal-box{

    border-radius:30px;

    margin-bottom:30px;
  }

}

</style>

</head>


<body>


<header class="header">

  <div class="brand">

    <div class="brand-icon">
      🏏
    </div>

    <div>

      <div class="brand-title">
        Football Fan Zone
      </div>

      <div class="brand-sub">
        Live Scores & Match Center
      </div>

    </div>

  </div>


  <div class="header-actions">

    <button
      class="icon-btn"
      onclick="toggleTheme()"
      id="themeBtn"
    >
      🌙
    </button>

    <button
      class="icon-btn"
      onclick="manualRefresh()"
      id="refreshBtn"
    >
      🔄
    </button>

  </div>

</header>


<div class="search-box">

  <span>🔎</span>

  <input
    type="text"
    id="searchInput"
    placeholder="দল বা লীগ খুঁজুন..."
  >

</div>


<div class="sport-tabs">

  <button
    class="sport-btn"
    id="footballBtn"
    onclick="changeSport('football')"
  >
    ⚽ Football
  </button>

  <button
    class="sport-btn active"
    id="cricketBtn"
    onclick="changeSport('cricket')"
  >
    🏏 Cricket
  </button>

</div>


<section class="date-section">

  <div class="date-title">

    <div class="date-title-left">
      📅 ম্যাচের তারিখ
    </div>

    <div
      class="date-title-right"
      id="selectedDateText"
    >
      আজ
    </div>

  </div>


  <div
    class="date-scroll"
    id="dateScroll"
  ></div>

</section>


<div class="filters">

  <button
    class="filter-btn active"
    data-filter="all"
    onclick="changeFilter('all')"
  >
    সব
  </button>

  <button
    class="filter-btn"
    data-filter="live"
    onclick="changeFilter('live')"
  >
    🔴 Live
  </button>

  <button
    class="filter-btn"
    data-filter="upcoming"
    onclick="changeFilter('upcoming')"
  >
    🟢 Upcoming
  </button>

  <button
    class="filter-btn"
    data-filter="finished"
    onclick="changeFilter('finished')"
  >
    ⚪ Finished
  </button>

  <button
    class="filter-btn"
    data-filter="favorites"
    onclick="changeFilter('favorites')"
  >
    ⭐ Favorites
  </button>

</div>


<div class="info-bar">

  <div class="realtime">

    <span class="live-dot"></span>

    Live Score

  </div>

  <div id="updateText">
    শেষ আপডেট: --:--
  </div>

</div>


<main
  class="matches"
  id="matches"
>

  <div class="loading">

    <div class="spinner"></div>

    ম্যাচ লোড হচ্ছে...

  </div>

</main>


<div
  class="modal"
  id="matchModal"
  onclick="closeModalOutside(event)"
>

  <div class="modal-box">

    <div class="modal-head">

      <h2>
        ম্যাচ বিস্তারিত
      </h2>

      <button
        class="close-btn"
        onclick="closeModal()"
      >
        ✕
      </button>

    </div>

    <div
      class="detail-content"
      id="detailContent"
    ></div>

  </div>

</div>


<nav class="bottom-nav">

  <button
    class="nav-btn active"
    onclick="goHome()"
  >
    <span>🏠</span>
    Home
  </button>

  <button
    class="nav-btn"
    onclick="showLive()"
  >
    <span>🔴</span>
    Live
  </button>

  <button
    class="nav-btn"
    onclick="showFavorites()"
  >
    <span>⭐</span>
    Favorites
  </button>

  <button
    class="nav-btn"
    onclick="manualRefresh()"
  >
    <span>🔄</span>
    Refresh
  </button>

</nav>


<div
  class="toast"
  id="toast"
></div>


<script>

/* =================================
   SETTINGS
================================ */

const API_BASE = "";

let sport = "cricket";

let currentFilter = "all";

let allMatches = [];

let selectedDate =
  getDateString(new Date());

let lastGoodMatches = [];

let isLoading = false;

let favorites =
  JSON.parse(
    localStorage.getItem(
      "footballFanFavorites"
    ) || "[]"
  );


/* =================================
   DATE
================================ */

function getDateString(date){

  const year =
    date.getFullYear();

  const month =
    String(
      date.getMonth()+1
    ).padStart(2,"0");

  const day =
    String(
      date.getDate()
    ).padStart(2,"0");

  return `${year}-${month}-${day}`;

}


function getDateObject(value){

  const p =
    value.split("-");

  return new Date(
    Number(p[0]),
    Number(p[1])-1,
    Number(p[2])
  );

}


function getDayName(date){

  return date.toLocaleDateString(
    "bn-BD",
    {
      weekday:"short"
    }
  );

}


function formatShortDate(date){

  return date.toLocaleDateString(
    "bn-BD",
    {
      day:"numeric",
      month:"short"
    }
  );

}


function renderDates(){

  const box =
    document.getElementById(
      "dateScroll"
    );

  box.innerHTML = "";

  const center =
    getDateObject(
      selectedDate
    );


  for(
    let i=-3;
    i<=3;
    i++
  ){

    const date =
      new Date(center);

    date.setDate(
      center.getDate()+i
    );


    const value =
      getDateString(date);


    const btn =
      document.createElement(
        "button"
      );

    btn.className =
      "date-chip";


    if(
      value === selectedDate
    ){

      btn.classList.add(
        "active"
      );

    }


    if(
      value ===
      getDateString(new Date())
    ){

      btn.classList.add(
        "today"
      );

    }


    btn.innerHTML = `

      <span class="day">
        ${getDayName(date)}
      </span>

      <span class="number">
        ${date.getDate()}
      </span>

    `;


    btn.onclick = function(){

      selectedDate =
        value;

      renderDates();

      updateSelectedDateText();

      loadMatches(true);

    };


    box.appendChild(btn);

  }


}


function updateSelectedDateText(){

  const today =
    getDateString(
      new Date()
    );


  const date =
    getDateObject(
      selectedDate
    );


  document.getElementById(
    "selectedDateText"
  ).textContent =

    selectedDate === today

      ? "আজ"

/* =================================
   BUILD API URL
================================ */

function buildApiUrl(){

  let url =
    `/api/${sport}?date=${encodeURIComponent(
      selectedDate
    )}`;


  /*
    Live filter হলে server-কে
    live matches চাইতে বলবে।
  */

  if(
    currentFilter === "live"
  ){

    url +=
      "&status=live";

  }


  if(
    currentFilter === "finished"
  ){

    url +=
      "&status=finished";

  }


  if(
    currentFilter === "upcoming"
  ){

    url +=
      "&status=upcoming";

  }


  return url;

}


/* =================================
   EXTRACT MATCHES
================================ */

function extractMatches(data){

  if(
    Array.isArray(data)
  ){

    return data;

  }


  if(
    data &&
    Array.isArray(data.matches)
  ){

    return data.matches;

  }


  if(
    data &&
    Array.isArray(data.data)
  ){

    return data.data;

  }


  if(
    data &&
    data.data &&
    Array.isArray(
      data.data.matches
    )
  ){

    return data.data.matches;

  }


  return [];

}


/* =================================
   LOAD MATCHES
================================ */

async function loadMatches(
  showLoading = false
){

  if(
    isLoading
  ){

    return;

  }


  isLoading = true;


  const box =
    document.getElementById(
      "matches"
    );


  const refreshBtn =
    document.getElementById(
      "refreshBtn"
    );


  refreshBtn.classList.add(
    "refreshing"
  );


  if(
    showLoading &&
    !lastGoodMatches.length
  ){

    box.innerHTML = `

      <div class="loading">

        <div class="spinner"></div>

        ম্যাচ লোড হচ্ছে...

      </div>

    `;

  }


  try{

    const response =
      await fetch(
        buildApiUrl(),
        {
          cache:"no-store"
        }
      );


    if(
      !response.ok
    ){

      throw new Error(
        "API Error " +
        response.status
      );

    }


    const data =
      await response.json();


    const matches =
      extractMatches(data);


    /*
      Empty response এলে
      পুরোনো ভালো data মুছে ফেলব না।
    */

    if(
      matches.length ||
      !lastGoodMatches.length
    ){

      allMatches =
        matches;

      lastGoodMatches =
        [...matches];

    }


    updateTime();

    renderMatches();


  }catch(error){

    console.error(
      "Load error:",
      error
    );


    /*
      API fail করলে পুরোনো data
      দেখিয়ে রাখবে।
    */

    if(
      lastGoodMatches.length
    ){

      allMatches =
        [...lastGoodMatches];

      renderMatches();

      showToast(
        "⚠️ আপডেট পাওয়া যায়নি"
      );

    }else{

      box.innerHTML = `

        <div class="empty">

          😕 ম্যাচ ডাটা পাওয়া যাচ্ছে না।

          <br><br>

          আবার চেষ্টা করুন।

        </div>

      `;

    }

  }


  isLoading = false;


  setTimeout(
    () => {

      refreshBtn.classList.remove(
        "refreshing"
      );

    },
    300
  );

}

/* =================================
   FILTER MATCHES
================================ */

function getFilteredMatches(){

  let matches =
    [...allMatches];


  if(
    currentFilter ===
    "favorites"
  ){

    matches =
      matches.filter(
        match =>
          favorites.includes(
            getMatchId(match)
          )
      );

  }


  /*
    API status filter-এর পর
    client-side safety filter।
  */

  if(
    currentFilter ===
    "live"
  ){

    matches =
      matches.filter(
        match =>
          isLive(match)
      );

  }


  if(
    currentFilter ===
    "finished"
  ){

    matches =
      matches.filter(
        match =>
          isFinished(match)
      );

  }


  if(
    currentFilter ===
    "upcoming"
  ){

    matches =
      matches.filter(
        match =>
          !isLive(match) &&
          !isFinished(match)
      );

  }


  const search =
    document
      .getElementById(
        "searchInput"
      )
      .value
      .trim()
      .toLowerCase();


  if(
    search
  ){

    matches =
      matches.filter(
        match =>

          JSON.stringify(
            match
          )
          .toLowerCase()
          .includes(
            search
          )

      );

  }


  return matches;

}


/* =================================
   STATUS TEXT
================================ */

function getStatusText(match){

  return String(
    match.status ||
    match.status_text ||
    match.state ||
    match.match_status ||
    ""
  ).toLowerCase();

}


/* =================================
   LIVE
================================ */

function isLive(match){

  const text =
    getStatusText(match);


  return (

    text.includes("live") ||

    text.includes("inplay") ||

    text.includes("in-play") ||

    text.includes("playing") ||

    text.includes("1st half") ||

    text.includes("2nd half") ||

    text.includes("innings") ||

    text.includes("break")

  );

}


/* =================================
   FINISHED
================================ */

function isFinished(match){

  const text =
    getStatusText(match);


  return (

    text.includes("finished") ||

    text.includes("ended") ||

    text.includes("complete") ||

    text.includes("completed") ||

    text.includes("full time") ||

    text === "ft"

  );

}


/* =================================
   MATCH ID
================================ */

function getMatchId(match){

  return String(

    match.id ||

    match.match_id ||

    match.fixture_id ||

    match.slug ||

    (
      (match.home || "") +
      "-" +
      (match.away || "")
    )

  );

}


/* =================================
   GET TEAM NAME
================================ */

function getHomeName(match){

  return (

    match.home ||

    match.home_team ||

    match.home_name ||

    match.homeTeam ||

    (
      match.home &&
      match.home.name
    ) ||

    "Home"

  );

}


function getAwayName(match){

  return (

    match.away ||

    match.away_team ||

    match.away_name ||

    match.awayTeam ||

    (
      match.away &&
      match.away.name
    ) ||

    "Away"

  );

}


/* =================================
   GET SCORE
================================ */

function getScore(
  match,
  side
){

  const direct =
    side === "home"
      ? match.home_score
      : match.away_score;


  if(
    direct !== undefined &&
    direct !== null &&
    direct !== ""
  ){

    return String(direct);

  }


  const score =
    match.score;


  if(
    score &&
    typeof score === "object"
  ){

    const value =
      side === "home"
        ? (
            score.home ??
            score.home_score ??
            score.homeScore
          )
        : (
            score.away ??
            score.away_score ??
            score.awayScore
          );


    if(
      value !== undefined &&
      value !== null
    ){

      return String(value);

    }

  }


  return "-";

}


/* =================================
   CRICKET SCORE HELP
================================ */

function getCricketOvers(
  match,
  side
){

  const keys =
    side === "home"

      ?

      [
        "home_overs",
        "home_over",
        "homeOvers"
      ]

      :

      [
        "away_overs",
        "away_over",
        "awayOvers"
      ];


  for(
    const key of keys
  ){

    if(
      match[key] !== undefined &&
      match[key] !== null &&
      match[key] !== ""
    ){

      return String(
        match[key]
      );

    }

  }


  return "";

}


/* =================================
   RESULT TEXT
================================ */

function getResultText(match){

  return (

    match.result ||

    match.result_text ||

    match.status_text ||

    match.statusText ||

    match.outcome ||

    ""

  );

}


/* =================================
   RENDER
================================ */

function renderMatches(){

  const box =
    document.getElementById(
      "matches"

  const matches =
    getFilteredMatches();


  if(

  ){

    return;

  }


  box.innerHTML =
    matches
      .map(
        (

          index

          createMatchCard(
            match,
            index
          )

      )
      .join("");

}


/* =================================
   MATCH CARD
================================ */

function createMatchCard(

){

  const home =
    getHomeName(match);


  const away =
    getAwayName(match);


  const homeLogo =
    match.home_logo ||

    match.home_image ||

    match.home_logo_url ||

    "";


  const awayLogo =
    match.away_logo ||

    match.away_image ||

    match.away_logo_url ||

    "";


  const competition =
    match.competition ||

    match.league ||

    match.tournament ||

    match.competition_name ||

    "Match";


  const competitionLogo =
    match.competition_logo ||

    match.league_logo ||

    "";


  const homeScore =
    getScore(
      match,
      "home"
    );


  const awayScore =
    getScore(
      match,
      "away"
    );


  const live =
    isLive(match);


  const finished =
    isFinished(match);


  const status =
    match.status_text ||

    match.status ||

    match.state ||

    (
      live
        ? "Live"
        : finished
          ? "Finished"
          : "Upcoming"
    );


  const resultText =
    getResultText(match);


  const time =
    match.time ||

    match.date_time ||

    match.start_time ||

    match.startTime ||

    match.datetime ||

    "";


  const id =
    getMatchId(match);


  const fav =
    favorites.includes(id);


  const homeOvers =
    getCricketOvers(
      match,
      "home"
    );


  const awayOvers =
    getCricketOvers(
      match,
      "away"
    );


  const isCricket =
    sport === "cricket";


  let scoreHTML = "";


  if(
    isCricket
  ){

    scoreHTML = `

      <div class="cricket-score">

        <div class="cricket-main">

          ${escapeHtml(
            homeScore
          )}

          :

          ${escapeHtml(
            awayScore
          )}

        </div>


        ${
          homeOvers ||
          awayOvers

          ?

          `

            <div class="cricket-overs">

              ${
                homeOvers
                  ? "(" +
                    escapeHtml(
                      homeOvers
                    ) +
                    ")"
                  : ""
              }

              ${
                awayOvers
                  ? " / (" +
                    escapeHtml(
                      awayOvers
                    ) +
                    ")"
                  : ""
              }

            </div>

          `

          :

          ""

        }

      </div>

    `;

  }else{

    scoreHTML = `

      <div class="
        score
        ${live ? "live-score" : ""}
      ">

        ${escapeHtml(
          homeScore
        )}

        :

        ${escapeHtml(
          awayScore
        )}

      </div>

    `;

  }


  return `

    <div
      class="
        match-card
        ${live ? "live-card" : ""}
      "
      onclick="
        openMatchByIndex(
          ${index}
        )
      "
    >


      <div class="competition">

        ${
          competitionLogo

          ?

          `

            <img
              src="${safeUrl(
                competitionLogo
              )}"
              onerror="
                this.style.display='none'
              "
            >

          `

          :

          `🏆`

        }


        <span>

          ${escapeHtml(
            competition
          )}

        </span>

      </div>


      <button
        class="favorite ${
          fav ? "active" : ""
        }"
        onclick="
          toggleFavoriteByIndex(
            event,
            ${index}
          )
        "
      >

        ${fav ? "★" : "☆"}

      </button>


      <div class="teams">


        <div class="team">

          ${
            homeLogo

            ?

            `

              <img
                class="team-logo"
                src="${safeUrl(
                  homeLogo
                )}"
                onerror="
                  this.style.display='none'
                "
              >

            `

            :

            `

              <div class="team-placeholder">
                ${isCricket ? "🏏" : "⚽"}
              </div>

            `
          }


          <div class="team-name">

            ${escapeHtml(home)}

          </div>

        </div>


        <div class="score-area">

          ${scoreHTML}


          <div class="
            status-badge
            ${live ? "live" : ""}
          ">

            ${
              live

              ?

              `

                <span
                  class="status-pulse"
                ></span>

                LIVE

              `

              :

              escapeHtml(
                status
              )

            }

          </div>


          ${

            ?

            `

              <div class="result-text">

                ${escapeHtml(
                  resultText
                )}

              </div>

            `

            :

            ""

          }

        </div>


        <div class="team">

          ${
            awayLogo

            ?

            `

              <img
                class="team-logo"
                src="${safeUrl(
                  awayLogo
                )}"
                onerror="
                  this.style.display='none'
                "
              >

            `

            :

            `

              <div class="team-placeholder">
                ${isCricket ? "🏏" : "⚽"}
              </div>

            `
          }


          <div class="team-name">

            ${escapeHtml(away)}

          </div>

        </div>

      </div>

      </div>

/* =================================
   DATE FORMAT
================================ */

function formatDate(
  value
){

  if(
    !value
  ){

    return "সময় পাওয়া যায়নি";

  }


  try{

    const date =
      new Date(value);


    if(
      isNaN(
        date.getTime()
      )
    ){

      return escapeHtml(
        String(value)
      );

    }


    return date.toLocaleString(
      "bn-BD",
      {
        day:"numeric",
        month:"long",
        year:"numeric",
        hour:"numeric",
        minute:"2-digit"
      }
    );

  }catch{

    return escapeHtml(
      String(value)
    );

  }

}


/* =================================
   SECURITY
================================ */

function escapeHtml(
  text
){

  return String(
    text ?? ""
  )

  .replaceAll(
    "&",
    "&amp;"
  )

  .replaceAll(
    "<",
    "&lt;"
  )

  .replaceAll(
    ">",
    "&gt;"
  )

  .replaceAll(
    '"',
    "&quot;"
  )

  .replaceAll(
    "'",
    "&#039;"
  );

}


function safeUrl(
  url
){

  const value =
    String(
      url || ""
    );


  if(
    value.startsWith(
      "http://"
    ) ||

    value.startsWith(
      "https://"
    )
  ){

    return value;

  }


  return "";

}

================================ */

let toastTimer;


function showToast(
  message
){

  const toast =
    document.getElementById(
      "toast"
    );


  toast.textContent =
    message;


  toast.classList.add(
    "show"
  );


  clearTimeout(
    toastTimer
  );


  toastTimer =
    setTimeout(
      () => {

        toast.classList.remove(
          "show"
        );

      },
      2200
    );

}


/* =================================
   START
================================ */

renderDates();

updateSelectedDateText();

loadMatches(true);


/* =================================
   REAL-TIME AUTO UPDATE
================================ */

/*
   Every 15 seconds.

   Page reload হবে না।
   শুধু নতুন score/data এনে
   match cards update করবে।
*/

setInterval(
  () => {

    loadMatches(false);

  },
  15000
);


/*
   Page visible হলে update.
*/

document.addEventListener(
  "visibilitychange",
  () => {

    if(
      !document.hidden
    ){

      loadMatches(false);

    }

  }
);


/*
   Network ফিরে এলে update.
*/

window.addEventListener(
  "online",
  () => {

    showToast(
      "🌐 Internet ফিরে এসেছে"
    );

    loadMatches(true);

  }
);

</script>

</body>
