<!DOCTYPE html>
<html lang="bn">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"
>

<meta
  name="theme-color"
  content="#070b18"
>

<title>Football Fan Zone</title>

<style>

/* =====================================================
   RESET
===================================================== */

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{

  font-family:
    Arial,
    "Noto Sans Bengali",
    sans-serif;

  min-height:100vh;

  color:#fff;

  overflow-x:hidden;

  padding-bottom:95px;

  background:
    radial-gradient(
      circle at 10% 0%,
      rgba(49,91,255,.35),
      transparent 28%
    ),
    radial-gradient(
      circle at 90% 15%,
      rgba(143,47,255,.25),
      transparent 28%
    ),
    linear-gradient(
      145deg,
      #050816,
      #0b1023 50%,
      #070b18
    );

  transition:
    background .4s ease,
    color .4s ease;
}


/* =====================================================
   LIGHT THEME
===================================================== */

body.light{

  color:#15182a;

  background:
    radial-gradient(
      circle at 0% 0%,
      rgba(90,120,255,.18),
      transparent 30%
    ),
    linear-gradient(
      145deg,
      #eef2ff,
      #ffffff
    );
}


/* =====================================================
   BACKGROUND GLOW
===================================================== */

body::before{

  content:"";

  position:fixed;

  width:280px;
  height:280px;

  border-radius:50%;

  background:
    radial-gradient(
      circle,
      rgba(47,109,255,.16),
      transparent 70%
    );

  top:20%;

  left:-140px;

  pointer-events:none;

  animation:
    floatGlow 8s ease-in-out infinite;
}

body::after{

  content:"";

  position:fixed;

  width:300px;
  height:300px;

  border-radius:50%;

  background:
    radial-gradient(
      circle,
      rgba(154,55,255,.13),
      transparent 70%
    );

  right:-150px;

  bottom:20%;

  pointer-events:none;

  animation:
    floatGlow2 10s ease-in-out infinite;
}

@keyframes floatGlow{

  0%,100%{
    transform:translateY(0);
  }

  50%{
    transform:translateY(-40px);
  }

}

@keyframes floatGlow2{

  0%,100%{
    transform:translateY(0);
  }

  50%{
    transform:translateY(45px);
  }

}


/* =====================================================
   HEADER
===================================================== */

.header{

  position:relative;

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:12px;

  padding:
    20px
    18px
    14px;

  z-index:5;
}

.brand{

  display:flex;

  align-items:center;

  gap:12px;
}

.brand-icon{

  width:58px;
  height:58px;

  display:flex;

  align-items:center;

  justify-content:center;

  border-radius:19px;

  font-size:30px;

  background:
    linear-gradient(
      135deg,
      #2f74ff,
      #923eff
    );

  box-shadow:
    0 12px 35px
    rgba(65,82,255,.35);

  animation:
    iconFloat 3s ease-in-out infinite;
}

@keyframes iconFloat{

  0%,100%{
    transform:translateY(0) rotate(0);
  }

  50%{
    transform:translateY(-4px) rotate(2deg);
  }

}

.brand-title{

  font-size:23px;

  font-weight:900;

  letter-spacing:.2px;
}

.brand-sub{

  margin-top:5px;

  color:#9099b3;

  font-size:13px;
}

.light .brand-sub{
  color:#69718a;
}

.header-actions{

  display:flex;

  gap:8px;
}

.icon-btn{

  width:48px;
  height:48px;

  border:1px solid
    rgba(255,255,255,.07);

  border-radius:16px;

  background:
    rgba(24,30,53,.9);

  color:#fff;

  font-size:21px;

  cursor:pointer;

  transition:
    transform .2s,
    background .2s;
}

.icon-btn:active{

  transform:scale(.88);
}

.light .icon-btn{

  background:#fff;

  color:#171b2d;

  border-color:#e1e5f0;
}


/* =====================================================
   SEARCH
===================================================== */

.search-box{

  position:relative;

  margin:
    8px
    22px
    14px;

  height:60px;

  display:flex;

  align-items:center;

  padding:0 18px;

  border-radius:21px;

  background:
    rgba(22,28,50,.86);

  border:1px solid
    rgba(255,255,255,.07);

  box-shadow:
    0 12px 35px
    rgba(0,0,0,.12);

  backdrop-filter:blur(18px);

  transition:
    transform .25s,
    border .25s;
}

.search-box:focus-within{

  transform:translateY(-2px);

  border-color:
    rgba(84,119,255,.65);

  box-shadow:
    0 12px 35px
    rgba(47,93,255,.14);
}

.light .search-box{

  background:#fff;

  border-color:#e2e6f0;
}

.search-box span{

  font-size:22px;

  margin-right:12px;
}

.search-box input{

  width:100%;

  border:0;

  outline:0;

  background:none;

  color:#fff;

  font-size:16px;
}

.light .search-box input{
  color:#111827;
}

.search-box input::placeholder{
  color:#737c96;
}


/* =====================================================
   SPORT BUTTON
===================================================== */

.sport-tabs{

  display:grid;

  grid-template-columns:1fr 1fr;

  gap:11px;

  padding:
    8px
    22px
    15px;
}

.sport-btn{

  height:63px;

  border:1px solid
    rgba(255,255,255,.06);

  border-radius:21px;

  background:
    rgba(23,29,50,.88);

  color:#aeb6cb;

  font-size:17px;

  font-weight:800;

  cursor:pointer;

  transition:
    transform .2s,
    box-shadow .3s,
    background .3s;
}

.sport-btn:active{
  transform:scale(.96);
}

.sport-btn.active{

  color:#fff;

  background:
    linear-gradient(
      135deg,
      #2675ff,
      #9139f2
    );

  box-shadow:
    0 12px 30px
    rgba(69,78,255,.3);

  animation:
    activeSport .35s ease;
}

@keyframes activeSport{

  0%{
    transform:scale(.94);
  }

  100%{
    transform:scale(1);
  }

}

.light .sport-btn{

  background:#e9ecf7;

  color:#555d73;
}

.light .sport-btn.active{
  color:#fff;
}


/* =====================================================
   DATE
===================================================== */

.date-section{

  padding:
    0
    19px
    8px;
}

.date-title{

  display:flex;

  justify-content:space-between;

  align-items:center;

  margin-bottom:9px;
}

.date-title-left{

  font-size:15px;

  font-weight:800;
}

.date-title-right{

  color:#8c95ad;

  font-size:12px;
}

.date-scroll{

  display:flex;

  gap:8px;

  overflow-x:auto;

  scrollbar-width:none;

  padding:
    3px
    3px
    8px;
}

.date-scroll::-webkit-scrollbar{
  display:none;
}

.date-chip{

  flex:0 0 auto;

  min-width:65px;

  padding:
    9px
    8px;

  border-radius:17px;

  border:1px solid
    rgba(255,255,255,.07);

  background:
    rgba(25,31,54,.88);

  color:#aeb6ca;

  cursor:pointer;

  transition:
    transform .2s,
    background .25s;
}

.date-chip:active{
  transform:scale(.93);
}

.date-chip .day{

  display:block;

  font-size:11px;

  margin-bottom:4px;
}

.date-chip .number{

  display:block;

  color:#fff;

  font-size:18px;

  font-weight:900;
}

.date-chip.active{

  color:#fff;

  border-color:transparent;

  background:
    linear-gradient(
      135deg,
      #2f72ff,
      #8e3af0
    );

  box-shadow:
    0 8px 22px
    rgba(64,77,255,.25);
}

.date-chip.today{

  border-color:
    rgba(76,112,255,.8);
}

.light .date-chip{

  background:#fff;

  color:#697187;

  border-color:#e1e5ef;
}

.light .date-chip .number{
  color:#252a3b;
}

.light .date-chip.active .number{
  color:#fff;
}


/* =====================================================
   FILTER
===================================================== */

.filters{

  display:flex;

  gap:8px;

  overflow-x:auto;

  padding:
    7px
    22px
    10px;

  scrollbar-width:none;
}

.filters::-webkit-scrollbar{
  display:none;
}

.filter-btn{

  flex:0 0 auto;

  padding:
    11px
    16px;

  border:0;

  border-radius:20px;

  background:
    rgba(25,31,53,.9);

  color:#aeb6ca;

  font-size:14px;

  cursor:pointer;

  transition:
    transform .2s,
    background .25s;
}

.filter-btn:active{
  transform:scale(.93);
}

.filter-btn.active{

  color:#fff;

  background:
    linear-gradient(
      135deg,
      #3474ff,
      #8739ee
    );
}


/* =====================================================
   INFO BAR
===================================================== */

.info-bar{

  display:flex;

  justify-content:space-between;

  align-items:center;

  padding:
    7px
    23px
    13px;

  color:#8993ac;

  font-size:12px;
}

.live-status{

  display:flex;

  align-items:center;

  gap:7px;
}

.live-dot{

  width:9px;
  height:9px;

  border-radius:50%;

  background:#20d37a;

  box-shadow:
    0 0 14px
    rgba(32,211,122,.8);

  animation:
    livePulse 1.3s infinite;
}

@keyframes livePulse{

  0%,100%{
    transform:scale(1);
    opacity:1;
  }

  50%{
    transform:scale(1.35);
    opacity:.5;
  }

}

.updating{
  color:#7196ff;
}


/* =====================================================
   MATCH LIST
===================================================== */

.matches{

  padding:
    0
    21px;
}

.match-card{

  position:relative;

  margin-bottom:17px;

  padding:
    18px
    14px
    15px;

  border-radius:27px;

  background:
    linear-gradient(
      145deg,
      rgba(31,42,76,.96),
      rgba(15,21,42,.98)
    );

  border:
    1px solid
    rgba(255,255,255,.07);

  box-shadow:
    0 15px 40px
    rgba(0,0,0,.20);

  cursor:pointer;

  overflow:hidden;

  transform:translateY(0);

  animation:
    cardIn .45s ease both;

  transition:
    transform .25s,
    box-shadow .25s;
}

.match-card::before{

  content:"";

  position:absolute;

  top:-80px;
  right:-70px;

  width:180px;
  height:180px;

  border-radius:50%;

  background:
    radial-gradient(
      circle,
      rgba(72,103,255,.18),
      transparent 70%
    );

  pointer-events:none;
}

.match-card:active{

  transform:
    scale(.985);

  box-shadow:
    0 8px 25px
    rgba(0,0,0,.3);
}

@keyframes cardIn{

  from{
    opacity:0;
    transform:
      translateY(15px);
  }

  to{
    opacity:1;
    transform:
      translateY(0);
  }

}

.light .match-card{

  background:#fff;

  border-color:#e2e5ef;

  box-shadow:
    0 12px 32px
    rgba(50,60,100,.08);
}


/* =====================================================
   COMPETITION
===================================================== */

.competition{

  display:flex;

  align-items:center;

  gap:8px;

  margin-bottom:17px;

  padding-right:50px;

  color:#a7b0c6;

  font-size:13px;
}

.competition img{

  width:26px;
  height:26px;

  object-fit:contain;

  border-radius:7px;
}


/* =====================================================
   FAVORITE
===================================================== */

.favorite{

  position:absolute;

  top:14px;
  right:14px;

  width:43px;
  height:43px;

  border:0;

  border-radius:14px;

  background:
    rgba(255,255,255,.07);

  color:#fff;

  font-size:23px;

  cursor:pointer;

  z-index:4;

  transition:
    transform .2s,
    background .2s;
}

.favorite:active{
  transform:scale(.82);
}

.favorite.active{

  color:#ffd42e;

  background:
    rgba(255,211,46,.11);

  animation:
    starPop .3s ease;
}

@keyframes starPop{

  50%{
    transform:scale(1.25);
  }

}


/* =====================================================
   TEAMS
===================================================== */

.teams{

  display:grid;

  grid-template-columns:
    1fr
    120px
    1fr;

  gap:5px;

  align-items:center;

  text-align:center;
}

.team{
  min-width:0;
}

.team-logo{

  width:68px;
  height:68px;

  margin:auto;

  display:block;

  object-fit:contain;

  filter:
    drop-shadow(
      0 5px 12px
      rgba(0,0,0,.22)
    );
}

.team-placeholder{

  width:68px;
  height:68px;

  margin:auto;

  display:flex;

  align-items:center;

  justify-content:center;

  font-size:42px;
}

.team-name{

  margin-top:9px;

  font-size:14px;

  font-weight:800;

  line-height:1.3;

  word-break:break-word;
}

.light .team-name{
  color:#1b2031;
}


/* =====================================================
   SCORE
===================================================== */

.score-area{

  display:flex;

  flex-direction:column;

  align-items:center;

  justify-content:center;
}

.score{

  font-size:29px;

  font-weight:950;

  letter-spacing:1px;

  white-space:nowrap;

  animation:
    scoreAppear .4s ease;
}

@keyframes scoreAppear{

  from{
    opacity:.3;
    transform:scale(.9);
  }

  to{
    opacity:1;
    transform:scale(1);
  }

}

.live-score{
  text-shadow:
    0 0 18px
    rgba(255,255,255,.2);
}


/* =====================================================
   FOOTBALL MINUTE
===================================================== */

.football-minute{

  margin-top:5px;

  color:#ff6376;

  font-size:12px;

  font-weight:800;

  animation:
    minutePulse 1.5s infinite;
}

@keyframes minutePulse{

  50%{
    opacity:.55;
  }

}


/* =====================================================
   STATUS
===================================================== */

.status-badge{

  display:inline-flex;

  align-items:center;

  gap:5px;

  min-height:26px;

  margin-top:8px;

  padding:
    5px
    10px;

  border-radius:20px;

  background:
    rgba(255,255,255,.07);

  color:#aeb6ca;

  font-size:10px;

  font-weight:800;
}

.status-badge.live{

  color:#ff6172;

  background:
    rgba(255,55,75,.13);

  animation:
    liveBadge 1.6s infinite;
}

@keyframes liveBadge{

  50%{
    box-shadow:
      0 0 16px
      rgba(255,55,75,.08);
  }

}

.status-pulse{

  width:7px;
  height:7px;

  border-radius:50%;

  background:#ff4056;

  box-shadow:
    0 0 8px
    rgba(255,64,86,.7);

}


/* =====================================================
   TIME
===================================================== */

.match-time{

  margin-top:17px;

  padding-top:12px;

  border-top:
    1px solid
    rgba(255,255,255,.06);

  text-align:center;

  color:#8f99b1;

  font-size:12px;
}

.light .match-time{
  border-color:#edf0f5;
}


/* =====================================================
   LOADING
===================================================== */

.loading{

  text-align:center;

  padding:
    55px
    10px;

  color:#9aa4bd;
}

.spinner{

  width:42px;
  height:42px;

  margin:
    0
    auto
    16px;

  border:
    4px solid
    rgba(255,255,255,.1);

  border-top-color:#5278ff;

  border-radius:50%;

  animation:
    spin .8s linear infinite;
}

@keyframes spin{

  to{
    transform:rotate(360deg);
  }

}

.empty{

  text-align:center;

  padding:
    55px
    15px;

  color:#929cb5;

  line-height:1.7;
}


/* =====================================================
   MODAL
===================================================== */

.modal{

  position:fixed;

  inset:0;

  display:none;

  align-items:flex-end;

  justify-content:center;

  background:
    rgba(1,3,12,.83);

  backdrop-filter:blur(13px);

  z-index:1000;
}

.modal.show{
  display:flex;
  animation:
    modalFade .25s ease;
}

@keyframes modalFade{

  from{
    opacity:0;
  }

  to{
    opacity:1;
  }

}

.modal-box{

  width:100%;

  max-width:650px;

  max-height:91vh;

  overflow-y:auto;

  padding:
    21px
    20px
    30px;

  border-radius:
    30px
    30px
    0
    0;

  background:
    linear-gradient(
      145deg,
      #171f3b,
      #0b1023
    );

  animation:
    modalUp .3s ease;
}

@keyframes modalUp{

  from{
    transform:translateY(80px);
  }

  to{
    transform:translateY(0);
  }

}

.modal-head{

  display:flex;

  align-items:center;

  justify-content:space-between;

  margin-bottom:18px;
}

.modal-head h2{

  font-size:20px;

  font-weight:900;
}

.close-btn{

  width:42px;
  height:42px;

  border:0;

  border-radius:14px;

  background:#252e4b;

  color:#fff;

  font-size:19px;

  cursor:pointer;
}


/* =====================================================
   DETAIL
===================================================== */

.detail-content{
  color:#dce2f0;
}

.detail-score{

  text-align:center;

  margin:
    18px
    0;

  font-size:34px;

  font-weight:950;
}

.detail-team-grid{

  display:grid;

  grid-template-columns:1fr 1fr;

  gap:10px;

  margin:
    18px
    0;
}

.detail-team{

  padding:15px;

  border-radius:18px;

  background:
    rgba(255,255,255,.045);

  text-align:center;

  line-height:1.5;
}

.detail-team-score{

  margin-top:6px;

  font-size:25px;

  font-weight:900;
}

.detail-section{

  margin-top:15px;

  padding:15px;

  border-radius:18px;

  background:
    rgba(255,255,255,.045);

  border:
    1px solid
    rgba(255,255,255,.04);
}

.detail-section h3{

  margin-bottom:10px;

  font-size:15px;

  font-weight:900;
}

.detail-row{

  display:flex;

  justify-content:space-between;

  align-items:flex-start;

  gap:12px;

  padding:
    9px
    0;

  border-bottom:
    1px solid
    rgba(255,255,255,.05);

  font-size:12px;

  line-height:1.5;
}

.detail-row:last-child{
  border-bottom:0;
}

.detail-row strong{
  text-align:right;
}

.event-goal{
  color:#48e48e;
}

.event-card{
  color:#ffd45c;
}

.event-sub{
  color:#8eb4ff;
}

.lineup-player{

  display:flex;

  justify-content:space-between;

  gap:10px;

  padding:8px 0;

  border-bottom:
    1px solid
    rgba(255,255,255,.04);

  font-size:12px;
}

.lineup-player:last-child{
  border-bottom:0;
}

.raw-scorecard{

  color:#aeb8cf;

  font-size:12px;

  line-height:1.7;

  white-space:pre-wrap;

  word-break:break-word;
}


/* =====================================================
   BOTTOM NAV
===================================================== */

.bottom-nav{

  position:fixed;

  left:0;
  right:0;
  bottom:0;

  height:78px;

  display:grid;

  grid-template-columns:
    repeat(4,1fr);

  background:
    rgba(7,11,25,.96);

  border-top:
    1px solid
    rgba(255,255,255,.07);

  backdrop-filter:blur(20px);

  z-index:900;
}

.nav-btn{

  border:0;

  background:none;

  color:#747e99;

  font-size:11px;

  cursor:pointer;

  transition:
    color .2s,
    transform .2s;
}

.nav-btn:active{
  transform:scale(.9);
}

.nav-btn span{

  display:block;

  margin-bottom:3px;

  font-size:23px;
}

.nav-btn.active{
  color:#fff;
}


/* =====================================================
   TOAST
===================================================== */

.toast{

  position:fixed;

  left:50%;

  bottom:94px;

  transform:
    translate(-50%,25px);

  padding:
    12px
    17px;

  border-radius:15px;

  background:
    rgba(30,37,62,.96);

  color:#fff;

  box-shadow:
    0 12px 30px
    rgba(0,0,0,.3);

  opacity:0;

  pointer-events:none;

  transition:
    opacity .25s,
    transform .25s;

  z-index:2000;

  white-space:nowrap;

  font-size:13px;
}

.toast.show{

  opacity:1;

  transform:
    translate(-50%,0);
}


/* =====================================================
   DESKTOP
===================================================== */

@media(min-width:700px){

  body{

    max-width:850px;

    margin:auto;
  }

  .bottom-nav{

    max-width:850px;

    left:50%;

    right:auto;

    width:100%;

    transform:
      translateX(-50%);
  }

  .modal-box{

    margin-bottom:25px;

    border-radius:30px;
  }

}

</style>

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header class="header">

  <div class="brand">

    <div class="brand-icon">
      ⚽
    </div>

    <div>

  >

  >

  >

    Refresh

  id="toast"
  class="toast"

<script>

/* =====================================================
   SETTINGS
===================================================== */

const API_BASE = "";

let sport = "football";

let currentFilter = "all";

let allMatches = [];

let selectedDate =
  getDateString(
    new Date()
  );

let loading = false;

let firstLoad = true;

let favorites =
  JSON.parse(
    localStorage.getItem(
      "footballFanFavorites"
    ) || "[]"
  );


/* =====================================================
   DATE
===================================================== */

function getDateString(date){

  return (
    date.getFullYear() +
    "-" +
    String(
      date.getMonth()+1
    ).padStart(2,"0") +
    "-" +
    String(
      date.getDate()
    ).padStart(2,"0")
  );

}


function getDateObject(value){

  const p =
    value.split("-");

  return new Date(
    Number(p[0]),
    Number(p[1])-1,
    Number(p[2])
  );

}


function getDayName(date){

  return date.toLocaleDateString(
    "bn-BD",
    {
      weekday:"short"
    }
  );

}


function formatShortDate(date){

  return date.toLocaleDateString(
    "bn-BD",
    {
      day:"numeric",
      month:"short"
    }
  );

}


/* =====================================================
   DATES
===================================================== */

function renderDates(){

  const box =
    document.getElementById(
      "dateScroll"
    );

  box.innerHTML = "";

  const center =
    getDateObject(
      selectedDate
    );

  for(
    let i=-3;
    i<=3;
    i++
  ){

    const date =
      new Date(center);

    date.setDate(
      center.getDate()+i
    );

    const value =
      getDateString(date);

    const btn =
      document.createElement(
        "button"
      );

    btn.className =
      "date-chip";

    if(
      value === selectedDate
    ){

      btn.classList.add(
        "active"
      );

    }

    if(
      value ===
      getDateString(
        new Date()
      )
    ){

      btn.classList.add(
        "today"
      );

    }

    btn.innerHTML = `

      <span class="day">
        ${getDayName(date)}
      </span>

      <span class="number">
        ${date.getDate()}
      </span>

    `;

    btn.onclick = () => {

      selectedDate =
        value;

      renderDates();

      updateSelectedDateText();

      loadMatches(true);

    };

    box.appendChild(btn);

  }

}


function updateSelectedDateText(){

  const today =
    getDateString(
      new Date()
    );

  const date =
    getDateObject(
      selectedDate
    );

  document.getElementById(
    "selectedDateText"
  ).textContent =

    selectedDate === today
      ? "আজ"
      : formatShortDate(date);

}


/* =====================================================
   SPORT
===================================================== */

function changeSport(value){

  sport =
    value;

  document.getElementById(
    "footballBtn"
  ).classList.toggle(
    "active",
    sport === "football"
  );

  document.getElementById(
    "cricketBtn"
  ).classList.toggle(
    "active",
    sport === "cricket"
  );

  playClickSound();

  loadMatches(true);

}


/* =====================================================
   LOAD
===================================================== */

async function loadMatches(
  showLoading=false
){

  if(loading){
    return;
  }

  loading=true;

  const box =
    document.getElementById(
      "matches"
    );

  const updateText =
    document.getElementById(
      "updateText"
    );

  if(
    firstLoad ||
    showLoading
  ){

    box.innerHTML = `

      <div class="loading">

        <div class="spinner"></div>

        ম্যাচ লোড হচ্ছে...

      </div>

    `;

  }

  updateText.classList.add(
    "updating"
  );

  updateText.textContent =
    "আপডেট হচ্ছে...";

  try{

    const url =
      `/api/${sport}` +
      `?date=${encodeURIComponent(
        selectedDate
      )}` +
      `&_=${Date.now()}`;

    const response =
      await fetch(
        url,
        {
          cache:"no-store"
        }
      );

    if(!response.ok){

      throw new Error(
        "API Error " +
        response.status
      );

    }

    const data =
      await response.json();

    let newMatches=[];

    if(
      Array.isArray(data)
    ){

      newMatches=data;

    }
    else if(
      Array.isArray(data.matches)
    ){

      newMatches=data.matches;

    }
    else if(
      Array.isArray(data.data)
    ){

      newMatches=data.data;

    }

    detectScoreChanges(
      allMatches,
      newMatches
    );

    allMatches =
      newMatches;

    renderMatches();

    updateTime();

    firstLoad=false;

  }
  catch(error){

    console.error(error);

    if(firstLoad){

      box.innerHTML = `

        <div class="empty">

          😕 ম্যাচ ডাটা পাওয়া যাচ্ছে না।

          <br><br>

          🔄 আবার Refresh করুন।

        </div>

      `;

    }

    updateText.textContent =
      "আপডেট ব্যর্থ";

  }
  finally{

    loading=false;

    updateText.classList.remove(
      "updating"
    );

  }

}


/* =====================================================
   REFRESH
===================================================== */

function manualRefresh(){

  playClickSound();

  loadMatches(true);

  showToast(
    "🔄 Live score আপডেট হচ্ছে..."
  );

}


/* =====================================================
   UPDATE TIME
===================================================== */

function updateTime(){

  document.getElementById(
    "updateText"
  ).textContent =

    "শেষ আপডেট: " +

    new Date()
      .toLocaleTimeString(
        "bn-BD",
        {
          hour:"numeric",
          minute:"2-digit",
          second:"2-digit"
        }
      );

}


/* =====================================================
   FILTER
===================================================== */

function changeFilter(value){

  currentFilter=value;

  document
    .querySelectorAll(
      ".filter-btn"
    )
    .forEach(
      btn => {

        btn.classList.toggle(
          "active",
          btn.dataset.filter === value
        );

      }
    );

  playClickSound();

  renderMatches();

}


/* =====================================================
   SEARCH
===================================================== */

document
  .getElementById(
    "searchInput"
  )
  .addEventListener(
    "input",
    renderMatches
  );


/* =====================================================
   FILTER MATCHES
===================================================== */

function getFilteredMatches(){

  let matches =
    [...allMatches];

  if(
    currentFilter ===
    "favorites"
  ){

    matches =
      matches.filter(
        match =>
          favorites.includes(
            getMatchId(match)
          )
      );

  }

  if(
    currentFilter ===
    "live"
  ){

    matches =
      matches.filter(
        isLive
      );

  }

  if(
    currentFilter ===
    "finished"
  ){

    matches =
      matches.filter(
        isFinished
      );

  }

  if(
    currentFilter ===
    "upcoming"
  ){

    matches =
      matches.filter(
        match =>
          !isLive(match) &&
          !isFinished(match)
      );

  }

  const search =
    document
      .getElementById(
        "searchInput"
      )
      .value
      .trim()
      .toLowerCase();

  if(search){

    matches =
      matches.filter(
        match =>
          JSON.stringify(match)
            .toLowerCase()
            .includes(search)
      );

  }

  return matches;

}


/* =====================================================
   STATUS
===================================================== */

function getStatusText(match){

  return String(
    match.status_text ||
    match.status ||
    match.state ||
    match.match_status ||
    ""
  ).toLowerCase();

}


function isLive(match){

  const text =
    getStatusText(match);

  return (

    text.includes("live") ||
    text.includes("inplay") ||
    text.includes("in-play") ||
    text.includes("playing") ||
    text.includes("1st") ||
    text.includes("2nd") ||
    text.includes("half") ||
    text.includes("quarter")

  );

}


function isFinished(match){

  const text =
    getStatusText(match);

  return (

    text.includes("finished") ||
    text.includes("finish") ||
    text.includes("ended") ||
    text.includes("complete") ||
    text === "ft" ||
    text.includes("full time") ||
    text.includes("result")

  );

}


/* =====================================================
   MATCH ID
===================================================== */

function getMatchId(match){

  return String(

    match.id ||
    match.match_id ||
    match.fixture_id ||
    match.slug ||
    match.match_slug ||
    match.tracker?.id ||
    (
      (match.home || "") +
      "-" +
      (match.away || "")
    )

  );

}


/* =====================================================
   DETAIL SLUG
===================================================== */

function getDetailSlug(match){

  /*
    সবচেয়ে গুরুত্বপূর্ণ অংশ:

    API response-এ tracker.id পাওয়া যাচ্ছে।
    যেমন:
    tracker.id = dn1m1ghlp9e2moe

    এটিই আগে ব্যবহার করা হবে।
  */

  if(
    match.tracker &&
    match.tracker.id
  ){

    return String(
      match.tracker.id
    );

  }


  if(
    match.slug
  ){

    return String(
      match.slug
    );

  }


  if(
    match.match_slug
  ){

    return String(
      match.match_slug
    );

  }


  if(
    match.id
  ){

    return String(
      match.id
    );

  }


  if(
    match.url
  ){

    const parts =
      String(
        match.url
      )
      .split("/")
      .filter(Boolean);

    if(parts.length){

      return parts[
        parts.length-1
      ];

    }

  }

  return "";

}


/* =====================================================
   SCORE
===================================================== */

function getScore(
  match,
  side
){

  const keys =
    side === "home"

      ?

      [
        "home_score",
        "homeScore",
        "home_runs",
        "home_run",
        "score_home"
      ]

      :

      [
        "away_score",
        "awayScore",
        "away_runs",
        "away_run",
        "score_away"
      ];

  for(
    const key of keys
  ){

    if(
      match[key] !== undefined &&
      match[key] !== null
    ){

      return String(
        match[key]
      );

    }

  }

  const team =
    match[side];

  if(
    team &&
    typeof team === "object"
  ){

    for(
      const key of [
        "score",
        "runs",
        "points",
        "goals"
      ]
    ){

      if(
        team[key] !== undefined &&
        team[key] !== null
      ){

        return String(
          team[key]
        );

      }

    }

  }

  return "-";

}


/* =====================================================
   WICKETS
===================================================== */

function getWickets(
  match,
  side
){

  const keys =
    side === "home"

      ?

      [
        "home_wickets",
        "homeWickets",
        "home_wicket"
      ]

      :

      [
        "away_wickets",
        "awayWickets",
        "away_wicket"
      ];

  for(
    const key of keys
  ){

    if(
      match[key] !== undefined &&
      match[key] !== null
    ){

      return match[key];

    }

  }

  return null;

}


/* =====================================================
   OVERS
===================================================== */

function getOvers(match){

  for(
    const key of [
      "overs",
      "over",
      "current_over",
      "current_overs",
      "home_overs",
      "away_overs"
    ]
  ){

    if(
      match[key] !== undefined &&
      match[key] !== null
    ){

      return String(
        match[key]
      );

    }

  }

  return "";

}


/* =====================================================
   SCORE CHANGE
===================================================== */

function getScoreKey(match){

  return [

    getMatchId(match),

    getScore(
      match,
      "home"
    ),

    getScore(
      match,
      "away"
    ),

    getOvers(match)

  ].join("|");

}


function detectScoreChanges(
  oldMatches,
  newMatches
){

  if(
    !oldMatches.length
  ){

    return;

  }

  const oldMap={};

  oldMatches.forEach(
    match => {

      oldMap[
        getMatchId(match)
      ] =
        getScoreKey(match);

    }
  );

  newMatches.forEach(
    match => {

      const id =
        getMatchId(match);

      const oldKey =
        oldMap[id];

      const newKey =
        getScoreKey(match);

      if(
        oldKey &&
        oldKey !== newKey &&
        isLive(match)
      ){

        playGoalSound();

        notifyScoreChange(
          match
        );

      }

    }
  );

}


/* =====================================================
   RENDER MATCHES
===================================================== */

function renderMatches(){

  const box =
    document.getElementById(
      "matches"
    );

  const matches =
    getFilteredMatches();

  if(!matches.length){

    box.innerHTML = `

      <div class="empty">

        🏟️

        <br><br>

        এই তারিখে কোনো ম্যাচ পাওয়া যায়নি।

      </div>

    `;

    return;

  }

  box.innerHTML =
    matches
      .map(
        (
          match,
          index
        ) =>
          createMatchCard(
            match,
            index
          )
      )
      .join("");

}


/* =====================================================
   CARD
===================================================== */

function createMatchCard(
  match,
  index
){

  const home =
    match.home ||
    match.home_team ||
    match.home_name ||
    "Home";

  const away =
    match.away ||
    match.away_team ||
    match.away_name ||
    "Away";

  const homeLogo =
    match.home_logo ||
    match.home_image ||
    match.home_team_logo ||
    "";

  const awayLogo =
    match.away_logo ||
    match.away_image ||
    match.away_team_logo ||
    "";

  const competition =
    match.competition ||
    match.league ||
    match.tournament ||
    "Match";

  const competitionLogo =
    match.competition_logo ||
    match.league_logo ||
    "";

  let homeScore =
    getScore(
      match,
      "home"
    );

  let awayScore =
    getScore(
      match,
      "away"
    );

  const live =
    isLive(match);

  const finished =
    isFinished(match);

  const status =
    match.status_text ||
    match.status ||
    (
      live
        ? "Live"
        : finished
          ? "Finished"
          : "Not started"
    );

  const time =
    match.time ||
    match.date_time ||
    match.start_time ||
    "";

  const id =
    getMatchId(match);

  const fav =
    favorites.includes(id);

  const cricket =
    sport === "cricket";

  const homeWickets =
    getWickets(
      match,
      "home"
    );

  const awayWickets =
    getWickets(
      match,
      "away"
    );

  const overs =
    getOvers(match);

  const footballMinute =
    match.live_minute ??
    match.minute ??
    match.minutes ??
    match.elapsed ??
    match.match_minute ??
    "";

  if(
    cricket &&
    homeWickets !== null &&
    !homeScore.includes("/")
  ){

    homeScore =
      `${homeScore}/${homeWickets}`;

  }

  if(
    cricket &&
    awayWickets !== null &&
    !awayScore.includes("/")
  ){

    awayScore =
      `${awayScore}/${awayWickets}`;

  }


  return `

    <div
      class="match-card"
      onclick="
        openMatchByIndex(${index})
      "
    >

      <div class="competition">

        ${
          competitionLogo

          ?

          `
            <img
              src="${safeUrl(
                competitionLogo
              )}"
              onerror="
                this.style.display='none'
              "
            >
          `

          :

          "🏆"

        }

        <span>
          ${escapeHtml(
            competition
          )}
        </span>

      </div>


      <button
        class="favorite ${
          fav
            ? "active"
            : ""
        }"
        onclick="
          toggleFavoriteByIndex(
            event,
            ${index}
          )
        "
      >

        ${
          fav
            ? "★"
            : "☆"
        }

      </button>


      <div class="teams">


        <div class="team">

          ${
            homeLogo

            ?

            `
              <img
                class="team-logo"
                src="${safeUrl(
                  homeLogo
                )}"
                onerror="
                  this.style.display='none'
                "
              >
            `

            :

            `
              <div class="team-placeholder">
                ${
                  cricket
                    ? "🏏"
                    : "⚽"
                }
              </div>
            `
          }

          <div class="team-name">
            ${escapeHtml(home)}
          </div>

        </div>


        <div class="score-area">

          <div class="
            score
            ${live ? "live-score" : ""}
          ">

            ${escapeHtml(
              homeScore
            )}

            :

            ${escapeHtml(
              awayScore
            )}

          </div>


          ${
            cricket && overs

            ?

            `
              <div
                class="cricket-summary"
                style="
                  color:#8da2df;
                  margin-top:5px;
                  font-size:11px;
                "
              >
                ${escapeHtml(
                  overs
                )} Overs
              </div>
            `

            :

            ""
          }


          ${
            !cricket &&
            live &&
            footballMinute !== ""

            ?

            `
              <div class="football-minute">
                ${escapeHtml(
                  String(
                    footballMinute
                  )
                )}'
              </div>
            `

            :

            ""
          }


          <div class="
            status-badge
            ${live ? "live" : ""}
          ">

            ${
              live

              ?

              `
                <span
                  class="status-pulse"
                ></span>

                LIVE
              `

              :

              escapeHtml(
                String(status)
              )

            }

          </div>

        </div>


        <div class="team">

          ${
            awayLogo

            ?

            `
              <img
                class="team-logo"
                src="${safeUrl(
                  awayLogo
                )}"
                onerror="
                  this.style.display='none'
                "
              >
            `

            :

            `
              <div class="team-placeholder">
                ${
                  cricket
                    ? "🏏"
                    : "⚽"
                }
              </div>
            `
          }

          <div class="team-name">
            ${escapeHtml(away)}
          </div>

        </div>

      </div>


      <div class="match-time">

        🕐

/* =====================================================
   SCORECARD
===================================================== */

function renderScorecard(data){

  const box =
    document.getElementById(
      "apiScorecard"
    );

  if(!box){
    return;
  }


  const match =
    data.match ||
    data.data ||
    data;


  let html = "";


  /* =================================================
     INCIDENTS
  ================================================= */

  const incidents =
    match.incidents;

  if(
    Array.isArray(incidents) &&
    incidents.length
  ){

    html += `

      <div class="detail-section">

        <h3>
          ⚡ Match Events
        </h3>

    `;


    incidents
      .forEach(
        event => {

          const type =
            String(
              event.type ||
              ""
            );

          const minute =
            event.time ??
            "";

          let cls =
            "";

          let icon =
            "⚡";

          if(
            event.is_goal ||
            type.toLowerCase()
              .includes("goal")
          ){

            cls =
              "event-goal";

            icon =
              "⚽";

          }
          else if(
            event.is_card ||
            type.toLowerCase()
              .includes("yellow")
          ){

            cls =
              "event-card";

            icon =
              "🟨";

          }
          else if(
            event.is_sub ||
            type.toLowerCase()
              .includes("sub")
          ){

            cls =
              "event-sub";

            icon =
              "🔄";

          }


          let description =
            event.player ||
            "";


          if(
            event.is_sub
          ){

            description =
              `${event.player_in || ""} ↔ ${event.player_out || ""}`;

          }


          html += `

            <div
              class="detail-row ${cls}"
            >

              <span>

                ${icon}

                ${escapeHtml(
                  String(minute)
                )}'

                ${escapeHtml(
                  type
                )}

              </span>

              <strong>

                ${escapeHtml(
                  description
                )}

              </strong>

            </div>

          `;

        }
      );


    html += `
      </div>
    `;

  }


  /* =================================================
     LINEUPS
  ================================================= */

  const lineups =
    match.lineups;


  if(lineups){

    html += `

      <div class="detail-section">

        <h3>
          👥 Lineups
        </h3>

        <div
          style="
            color:#8fa0c5;
            margin-bottom:8px;
            font-size:12px;
          "
        >

          ${escapeHtml(
            lineups.home_formation ||
            ""
          )}

          &nbsp; — &nbsp;

          ${escapeHtml(
            lineups.away_formation ||
            ""
          )}

        </div>

    `;


    if(
      Array.isArray(
        lineups.home_xi
      )
    ){

      html += `

        <div
          style="
            margin-top:10px;
            margin-bottom:5px;
            font-weight:900;
            font-size:13px;
          "
        >
          🏠 ${escapeHtml(
            match.home ||
            "Home"
          )}
        </div>

      `;


      lineups.home_xi
        .forEach(
          player => {

            html += `

              <div class="lineup-player">

                <span>

                  #${escapeHtml(
                    String(
                      player.number ??
                      ""
                    )
                  )}

                  &nbsp;

                  ${escapeHtml(
                    player.name ||
                    ""
                  )}

                </span>

                <strong>

                  ${escapeHtml(
                    player.position ||
                    ""
                  )}

                  ${
                    player.captain
                      ? " ©"
                      : ""
                  }

                </strong>

              </div>

            `;

          }
        );

    }


    if(
      Array.isArray(
        lineups.away_xi
      )
    ){

      html += `

        <div
          style="
            margin-top:15px;
            margin-bottom:5px;
            font-weight:900;
            font-size:13px;
          "
        >
          ✈️ ${escapeHtml(
            match.away ||
            "Away"
          )}
        </div>

      `;


      lineups.away_xi
        .forEach(
          player => {

            html += `

              <div class="lineup-player">

                <span>

                  #${escapeHtml(
                    String(
                      player.number ??
                      ""
                    )
                  )}

                  &nbsp;

                  ${escapeHtml(
                    player.name ||
                    ""
                  )}

                </span>

                <strong>

                  ${escapeHtml(
                    player.position ||
                    ""
                  )}

                  ${
                    player.captain
                      ? " ©"
                      : ""
                  }

                </strong>

              </div>

            `;

          }
        );

    }


    html += `
      </div>
    `;

  }


  /* =================================================
     STATS
  ================================================= */

  if(
    Array.isArray(
      match.stats
    ) &&
    match.stats.length
  ){

    html += `

      <div class="detail-section">

        <h3>
          📈 Statistics
        </h3>

    `;


    match.stats
      .forEach(
        stat => {

          if(
            typeof stat ===
            "object"
          ){

            const values =
              Object.entries(
                stat
              );

            values.forEach(
              ([key,value]) => {

                if(
                  value !== null &&
                  typeof value !==
                  "object"
                ){

                  html += `

                    <div
                      class="detail-row"
                    >

                      <span>
                        ${escapeHtml(
                          key
                        )}
                      </span>

                      <strong>
                        ${escapeHtml(
                          String(value)
                        )}
                      </strong>

                    </div>

                  `;

                }

              }
            );

          }

        }
      );


    html += `
      </div>
    `;

  }


  /* =================================================
     BASIC INFO
  ================================================= */

  html += `

    <div class="detail-section">

      <h3>
        📋 Match Information
      </h3>

      <div class="detail-row">

        <span>
          Status
        </span>

        <strong>
          ${escapeHtml(
            String(
              match.status_text ||
              match.status ||
              "-"
            )
          )}
        </strong>

      </div>


      ${
        match.home_ht_score !== undefined

        ?

        `
          <div class="detail-row">

            <span>
              Half Time
            </span>

            <strong>
              ${escapeHtml(
                String(
                  match.home_ht_score
                )
              )}

              :

              ${escapeHtml(
                String(
                  match.away_ht_score ??
                  "-"
                )
              )}

            </strong>

          </div>
        `

        :

        ""
      }


    </div>

  `;


  if(!html){

    html = `

      <div class="raw-scorecard">

        API থেকে অতিরিক্ত scorecard পাওয়া যায়নি।

      </div>

    `;

  }


  box.innerHTML =
    `<h3>📊 বিস্তারিত Scorecard</h3>` +
    html;

}

/* =====================================================

===================================================== */

async function enableNotifications(){

  if(
    !("Notification" in window)
  ){

    return false;

  }


  if(
    Notification.permission ===
    "granted"
  ){

    return true;

  }


  if(
    Notification.permission ===
    "denied"
  ){

    return false;

  }


  try{

    const permission =
      await Notification.requestPermission();

    return (
      permission ===
      "granted"
    );

  }
  catch{

    return false;

  }

}

/* =====================================================
   SOUND ENGINE
===================================================== */

let audioContext = null;


function getAudioContext(){

  if(!audioContext){

    try{

      audioContext =
        new (
          window.AudioContext ||
          window.webkitAudioContext
        )();

    }
    catch{

      return null;

    }

  }

  return audioContext;

}


function playTone(
  frequency,
  duration,
  volume=.06,
  type="sine"
){

  const ctx =
    getAudioContext();

  if(!ctx){
    return;
  }

  try{

    if(
      ctx.state ===
      "suspended"
    ){

      ctx.resume();

    }


    const oscillator =
      ctx.createOscillator();

    const gain =
      ctx.createGain();


    oscillator.type =
      type;

    oscillator.frequency.value =
      frequency;


    gain.gain.setValueAtTime(
      0,
      ctx.currentTime
    );

    gain.gain.linearRampToValueAtTime(
      volume,
      ctx.currentTime + .02
    );

    gain.gain.exponentialRampToValueAtTime(
      .001,
      ctx.currentTime + duration
    );


    oscillator.connect(
      gain
    );

    gain.connect(
      ctx.destination
    );


    oscillator.start();

    oscillator.stop(
      ctx.currentTime +
      duration
    );

  }
  catch(error){

    console.log(
      "Sound:",
      error
    );

  }

}

/* =====================================================
   DATE FORMAT
===================================================== */

function formatDate(value){

  if(!value){

    return "সময় পাওয়া যায়নি";

  }

  try{

    const date =
      new Date(value);

    if(
      isNaN(
        date.getTime()
      )
    ){

      return escapeHtml(
        String(value)
      );

    }

    return date.toLocaleString(
      "bn-BD",
      {
        day:"numeric",
        month:"long",
        year:"numeric",
        hour:"numeric",
        minute:"2-digit"
      }
    );

  }
  catch{

    return escapeHtml(
      String(value)
    );

  }

}


/* =====================================================
   SECURITY
===================================================== */

function escapeHtml(text){

  return String(text)

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}


function safeUrl(url){

  const value =
    String(url || "");

  if(
    value.startsWith(
      "https://"
    ) ||
    value.startsWith(
      "http://"
    )
  ){

    return value;

  }

  return "";

}

}
