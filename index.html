<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#080b14">

<title>Live Score ⚽🏏</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:
    radial-gradient(circle at top,#17213d 0%,#080b14 45%,#05070c 100%);
  color:#fff;
  min-height:100vh;
}

.header{
  padding:25px 18px 18px;
  text-align:center;
}

.logo{
  font-size:30px;
  font-weight:800;
}

.subtitle{
  color:#9ca8bd;
  margin-top:7px;
  font-size:14px;
}

.tabs{
  display:flex;
  gap:10px;
  padding:10px 15px;
}

.tab{
  flex:1;
  border:0;
  padding:13px;
  border-radius:14px;
  background:#151b2b;
  color:#aeb8ca;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.tab.active{
  background:linear-gradient(135deg,#6757ff,#9b45ff);
  color:white;
}

.filters{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:8px 15px 15px;
}

.filter{
  white-space:nowrap;
  border:1px solid #252d40;
  background:#101522;
  color:#9faabe;
  padding:9px 16px;
  border-radius:20px;
}

.filter.active{
  background:#222b43;
  color:white;
  border-color:#6574ff;
}

.container{
  padding:0 15px 30px;
}

.status{
  text-align:center;
  color:#8995aa;
  padding:20px;
}

.card{
  background:rgba(18,23,37,.94);
  border:1px solid #252c3d;
  border-radius:18px;
  padding:16px;
  margin-bottom:12px;
  box-shadow:0 8px 25px rgba(0,0,0,.22);
}

.league{
  color:#8f9bb0;
  font-size:12px;
  margin-bottom:13px;
}

.teams{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.team{
  width:38%;
  text-align:center;
}

.team img{
  width:42px;
  height:42px;
  object-fit:contain;
  margin-bottom:7px;
}

.team-name{
  font-size:14px;
  font-weight:bold;
  line-height:1.3;
}

.score{
  width:24%;
  text-align:center;
  font-size:22px;
  font-weight:800;
}

.time{
  display:block;
  font-size:11px;
  color:#7f8ba0;
  margin-top:5px;
  font-weight:normal;
}

.live{
  color:#35e58a;
  font-size:11px;
  margin-top:5px;
}

.error{
  text-align:center;
  color:#ff7185;
  padding:25px 10px;
}

.refresh{
  position:fixed;
  right:18px;
  bottom:20px;
  width:54px;
  height:54px;
  border:0;
  border-radius:50%;
  background:linear-gradient(135deg,#695cff,#a346ff);
  color:#fff;
  font-size:23px;
  box-shadow:0 8px 25px rgba(100,70,255,.4);
}

.empty{
  text-align:center;
  padding:45px 20px;
  color:#8995aa;
}

@media(min-width:700px){
  .container{
    max-width:700px;
    margin:auto;
  }

  .tabs,
  .filters{
    max-width:700px;
    margin:auto;
  }
}
</style>
</head>

<body>

<header class="header">
  <div class="logo">⚡ Live Score</div>
  <div class="subtitle">Football & Cricket Live Scores</div>
</header>

<div class="tabs">

  <button
    class="tab active"
    onclick="changeSport('football',this)">
    ⚽ Football
  </button>

  <button
    class="tab"
    onclick="changeSport('cricket',this)">
    🏏 Cricket
  </button>

</div>

<div class="filters">

  <button
    class="filter active"
    onclick="changeFilter('live',this)">
    🔴 Live
  </button>

  <button
    class="filter"
    onclick="changeFilter('upcoming',this)">
    🕐 Upcoming
  </button>

  <button
    class="filter"
    onclick="changeFilter('finished',this)">
    ✅ Finished
  </button>

</div>

<main class="container">

  <div id="status" class="status">
    স্কোর লোড হচ্ছে...
  </div>

  <div id="matches"></div>

</main>

<button
  class="refresh"
  onclick="loadScores()"
  title="Refresh">
  ↻
</button>

<script>

let currentSport = "football";
let currentFilter = "live";


function changeSport(sport,button){

  currentSport = sport;

  document
    .querySelectorAll(".tab")
    .forEach(btn => btn.classList.remove("active"));

  button.classList.add("active");

  loadScores();
}


function changeFilter(filter,button){

  currentFilter = filter;

  document
    .querySelectorAll(".filter")
    .forEach(btn => btn.classList.remove("active"));

  button.classList.add("active");

  loadScores();
}


function getValue(obj,keys,defaultValue=""){

  for(const key of keys){

    if(
      obj &&
      obj[key] !== undefined &&
      obj[key] !== null &&
      obj[key] !== ""
    ){

      return obj[key];

    }

  }

  return defaultValue;
}


function findArray(data){

  if(Array.isArray(data)){
    return data;
  }

  if(!data || typeof data !== "object"){
    return [];
  }

  const possibleKeys=[
    "matches",
    "events",
    "data",
    "results",
    "items",
    "response"
  ];

  for(const key of possibleKeys){

    if(Array.isArray(data[key])){
      return data[key];
    }

  }

  for(const key of Object.keys(data)){

    if(Array.isArray(data[key])){
      return data[key];
    }

  }

  return [];

}


function getTeam(match,side){

  const prefix =
    side === "home"
    ? ["home","homeTeam","team1","team_home"]
    : ["away","awayTeam","team2","team_away"];

  for(const key of prefix){

    if(
      match[key] &&
      typeof match[key] === "object"
    ){

      return match[key];

    }

  }

  return {};

}


function teamName(team,side){

  return getValue(
    team,
    ["name","title","shortName","team"],
    side === "home" ? "Home" : "Away"
  );

}


function teamLogo(team){

  return getValue(
    team,
    ["logo","image","icon","crest","badge"],
    ""
  );

}


function teamScore(team){

  return getValue(
    team,
    ["score","goals","runs","points","result"],
    "-"
  );

}


function formatDate(value){

  if(!value){
    return "";
  }

  try{

    const d = new Date(value);

    if(isNaN(d.getTime())){
      return String(value);
    }

    return d.toLocaleString(
      "bn-BD",
      {
        day:"numeric",
        month:"short",
        hour:"numeric",
        minute:"2-digit"
      }
    );

  }catch(e){

    return String(value);

  }

}


function isLive(match){

  const text = JSON.stringify(match).toLowerCase();

  return(
    text.includes("live") ||
    text.includes("inplay") ||
    text.includes("in_play") ||
    text.includes("1h") ||
    text.includes("2h")
  );

}


function renderMatches(data){

  const matches =
    findArray(data);

  const box =
    document.getElementById("matches");

  box.innerHTML = "";

  if(!matches.length){

    box.innerHTML = `
      <div class="empty">
        <div style="font-size:40px;margin-bottom:10px">
          📭
        </div>
        আজ কোনো ম্যাচ পাওয়া যায়নি।
      </div>
    `;

    return;

  }


  matches.forEach(match => {

    const home =
      getTeam(match,"home");

    const away =
      getTeam(match,"away");


    const homeName =
      teamName(home,"home");

    const awayName =
      teamName(away,"away");


    const homeScore =
      teamScore(home);

    const awayScore =
      teamScore(away);


    const homeLogo =
      teamLogo(home);

    const awayLogo =
      teamLogo(away);


    const league =
      getValue(
        match,
        [
          "league",
          "tournament",
          "competition",
          "category"
        ],
        currentSport === "football"
        ? "Football"
        : "Cricket"
      );


    const date =
      getValue(
        match,
        [
          "startTime",
          "start_time",
          "date",
          "time",
          "timestamp"
        ],
        ""
      );


    const live =
      isLive(match);


    const card =
      document.createElement("div");

    card.className = "card";


    card.innerHTML = `

      <div class="league">
        ${escapeHtml(String(league))}
      </div>

      <div class="teams">

        <div class="team">

          ${
            homeLogo
            ? `<img
                src="${escapeAttribute(homeLogo)}"
                onerror="this.style.display='none'"
              >`
            : ""
          }

          <div class="team-name">
            ${escapeHtml(String(homeName))}
          </div>

        </div>


        <div class="score">

          ${escapeHtml(String(homeScore))}
          -
          ${escapeHtml(String(awayScore))}

          ${
            live
            ? `<span class="live">● LIVE</span>`
            : `<span class="time">
                ${escapeHtml(formatDate(date))}
              </span>`
          }

        </div>


        <div class="team">

          ${
            awayLogo
            ? `<img
                src="${escapeAttribute(awayLogo)}"
                onerror="this.style.display='none'"
              >`
            : ""
          }

          <div class="team-name">
            ${escapeHtml(String(awayName))}
          </div>

        </div>

      </div>

    `;


    box.appendChild(card);

  });

}


function escapeHtml(value){

  return value
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function escapeAttribute(value){

  return String(value)
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


async function loadScores(){

  const status =
    document.getElementById("status");

  const matches =
    document.getElementById("matches");


  status.style.display = "block";

  status.textContent =
    currentSport === "football"
    ? "⚽ Football স্কোর লোড হচ্ছে..."
    : "🏏 Cricket স্কোর লোড হচ্ছে...";


  matches.innerHTML = "";


  try{

    const response =
      await fetch(
        `/api/${currentSport}?filter=${currentFilter}`,
        {
          cache:"no-store"
        }
      );


    if(!response.ok){

      throw new Error(
        "HTTP " + response.status
      );

    }


    const data =
      await response.json();


    status.style.display = "none";

    renderMatches(data);


  }catch(error){

    console.error(error);

    status.style.display = "none";

    matches.innerHTML = `
      <div class="error">
        স্কোর লোড করা যাচ্ছে না।<br>
        কিছুক্ষণ পর আবার চেষ্টা করুন।
      </div>
    `;

  }

}


loadScores();


// প্রতি ৩০ সেকেন্ডে আপডেট
setInterval(
  loadScores,
  30000
);

</script>

</body>
</html>
