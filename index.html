<!DOCTYPE html>
<html lang="bn">

<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<meta
  name="theme-color"
  content="#090d1d"
>

<title>Football Fan Zone</title>

<style>

/* ================================
   RESET
================================ */

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:
    Arial,
    "Noto Sans Bengali",
    sans-serif;

  background:
    radial-gradient(
      circle at top left,
      #172b66 0,
      #090d1d 42%,
      #070a15 100%
    );

  color:#fff;
  min-height:100vh;
  padding-bottom:90px;
  overflow-x:hidden;
}

body.light{
  background:
    linear-gradient(
      135deg,
      #eef2ff,
      #ffffff
    );

  color:#15182a;
}


/* ================================
   HEADER
================================ */

.header{
  padding:20px 18px 12px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:12px;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
}

.brand-icon{
  width:58px;
  height:58px;

  border-radius:18px;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:31px;

  background:
    linear-gradient(
      135deg,
      #286cff,
      #7b36ee
    );

  box-shadow:
    0 8px 25px rgba(56,93,255,.35);
}

.brand-title{
  font-size:24px;
  font-weight:800;
}

.brand-sub{
  margin-top:5px;
  color:#9da5bd;
  font-size:14px;
}

.light .brand-sub{
  color:#6c7285;
}

.header-actions{
  display:flex;
  gap:9px;
}

.icon-btn{
  width:50px;
  height:50px;

  border:0;
  border-radius:16px;

  background:#171c30;
  color:#fff;

  font-size:24px;

  cursor:pointer;
}

.light .icon-btn{
  background:#e7eafa;
  color:#161a2c;
}


/* ================================
   SEARCH
================================ */

.search-box{
  margin:10px 24px 14px;

  height:80px;

  border-radius:25px;

  background:
    rgba(27,31,49,.9);

  border:1px solid
    rgba(255,255,255,.07);

  display:flex;
  align-items:center;

  padding:0 20px;

  box-shadow:
    0 10px 30px rgba(0,0,0,.15);
}

.light .search-box{
  background:#fff;
  border-color:#e2e5ef;
}

.search-box span{
  font-size:25px;
  margin-right:13px;
}

.search-box input{
  width:100%;

  background:none;
  border:0;
  outline:0;

  color:#fff;

  font-size:17px;
}

.light .search-box input{
  color:#111;
}

.search-box input::placeholder{
  color:#777d92;
}


/* ================================
   SPORT TABS
================================ */

.sport-tabs{
  display:grid;

  grid-template-columns:1fr 1fr;

  gap:12px;

  padding:10px 24px 16px;
}

.sport-btn{
  height:74px;

  border:0;
  border-radius:24px;

  background:#171b2d;

  color:#fff;

  font-size:20px;
  font-weight:700;

  cursor:pointer;

  transition:.25s;
}

.sport-btn.active{
  background:
    linear-gradient(
      135deg,
      #286cff,
      #8136ec
    );

  box-shadow:
    0 10px 30px
    rgba(79,74,255,.35);
}

.light .sport-btn{
  background:#e7eafa;
  color:#22263a;
}

.light .sport-btn.active{
  color:#fff;
}


/* ================================
   DATE SELECTOR
================================ */

.date-section{
  margin:2px 0 8px;
  padding:0 20px;
}

.date-title{
  display:flex;
  align-items:center;
  justify-content:space-between;

  margin-bottom:10px;
}

.date-title-left{
  font-size:16px;
  font-weight:700;
}

.date-title-right{
  color:#8f98b2;
  font-size:13px;
}

.date-scroll{
  display:flex;

  gap:9px;

  overflow-x:auto;

  padding:3px 4px 9px;

  scrollbar-width:none;
}

.date-scroll::-webkit-scrollbar{
  display:none;
}

.date-chip{
  flex:0 0 auto;

  min-width:68px;

  padding:10px 9px;

  border:1px solid
    rgba(255,255,255,.07);

  border-radius:18px;

  background:
    rgba(29,35,61,.85);

  color:#aeb5ca;

  text-align:center;

  cursor:pointer;

  transition:.2s;
}

.date-chip .day{
  display:block;

  font-size:12px;

  margin-bottom:5px;
}

.date-chip .number{
  display:block;

  font-size:19px;

  font-weight:800;

  color:#fff;
}

.date-chip.active{
  background:
    linear-gradient(
      135deg,
      #316dff,
      #7d39ee
    );

  border-color:transparent;

  color:#fff;

  transform:translateY(-2px);

  box-shadow:
    0 8px 20px
    rgba(65,75,255,.3);
}

.date-chip.active .number{
  color:#fff;
}

.date-chip.today{
  border-color:#536cff;
}

.light .date-chip{
  background:#fff;
  color:#73798d;
  border-color:#e2e5ef;
}

.light .date-chip .number{
  color:#20243a;
}

.light .date-chip.active .number{
  color:#fff;
}


/* ================================
   FILTERS
================================ */

.filters{
  display:flex;

  gap:9px;

  padding:8px 24px 12px;

  overflow-x:auto;

  scrollbar-width:none;
}

.filters::-webkit-scrollbar{
  display:none;
}

.filter-btn{
  flex:0 0 auto;

  border:0;

  padding:12px 17px;

  border-radius:22px;

  background:#1a2035;

  color:#d6d9e5;

  font-size:15px;

  cursor:pointer;
}

.filter-btn.active{
  background:
    linear-gradient(
      135deg,
      #376cff,
      #7c39ed
    );

  color:#fff;
}

.light .filter-btn{
  background:#e7eafa;
  color:#444a60;
}


/* ================================
   INFO
================================ */

.info-bar{
  padding:8px 24px 12px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  color:#9fa7bd;

  font-size:13px;
}

.live-dot{
  width:11px;
  height:11px;

  background:#20c875;

  border-radius:50%;

  display:inline-block;

  margin-right:7px;

  box-shadow:
    0 0 12px
    rgba(32,200,117,.7);
}


/* ================================
   MATCH LIST
================================ */

.matches{
  padding:0 24px;
}

.match-card{
  position:relative;

  margin-bottom:18px;

  padding:18px 14px 17px;

  border-radius:28px;

  background:
    linear-gradient(
      145deg,
      rgba(37,45,76,.95),
      rgba(23,29,53,.96)
    );

  border:1px solid
    rgba(255,255,255,.06);

  box-shadow:
    0 12px 35px
    rgba(0,0,0,.16);

  cursor:pointer;

  transition:.2s;
}

.match-card:active{
  transform:scale(.985);
}

.light .match-card{
  background:#fff;

  border-color:#e2e5ef;

  box-shadow:
    0 10px 30px
    rgba(40,50,90,.08);
}

.competition{
  display:flex;
  align-items:center;

  gap:9px;

  color:#aab1c6;

  font-size:14px;

  margin-bottom:18px;
}

.competition img{
  width:25px;
  height:25px;

  object-fit:contain;

  border-radius:6px;
}

.teams{
  display:grid;

  grid-template-columns:1fr 100px 1fr;

  align-items:center;

  text-align:center;
}

.team img{
  width:58px;
  height:58px;

  object-fit:contain;

  margin:auto;

  display:block;
}

.team-name{
  margin-top:9px;

  font-size:17px;
  font-weight:700;

  line-height:1.2;
}

.score{
  font-size:25px;

  font-weight:800;

  letter-spacing:4px;
}

.status{
  margin-top:8px;

  font-size:13px;

  color:#a9afc1;
}

.status.live{
  color:#23d17c;
  font-weight:700;
}

.match-time{
  text-align:center;

  color:#aab1c5;

  font-size:13px;

  margin-top:20px;
}

.favorite{
  position:absolute;

  top:16px;
  right:15px;

  width:48px;
  height:48px;

  border:0;

  border-radius:16px;

  background:
    rgba(255,255,255,.07);

  color:#fff;

  font-size:23px;

  cursor:pointer;
}

.favorite.active{
  color:#ffd42a;
}


/* ================================
   LOADING
================================ */

.loading{
  text-align:center;

  padding:45px 10px;

  color:#9ea6bd;
}

.spinner{
  width:40px;
  height:40px;

  border:4px solid
    rgba(255,255,255,.12);

  border-top-color:#5571ff;

  border-radius:50%;

  animation:spin .8s linear infinite;

  margin:0 auto 15px;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

.empty{
  text-align:center;

  padding:50px 15px;

  color:#9da5ba;
}


/* ================================
   MODAL
================================ */

.modal{
  position:fixed;

  inset:0;

  background:
    rgba(2,4,12,.82);

  backdrop-filter:blur(10px);

  display:none;

  align-items:flex-end;

  justify-content:center;

  z-index:1000;
}

.modal.show{
  display:flex;
}

.modal-box{
  width:100%;
  max-width:600px;

  max-height:90vh;

  overflow:auto;

  background:
    linear-gradient(
      145deg,
      #171d35,
      #0d1224
    );

  border-radius:
    30px 30px 0 0;

  padding:22px;

  animation:slideUp .25s ease;
}

@keyframes slideUp{
  from{
    transform:translateY(100%);
  }

  to{
    transform:translateY(0);
  }
}

.modal-head{
  display:flex;

  align-items:center;
  justify-content:space-between;

  margin-bottom:20px;
}

.modal-head h2{
  font-size:20px;
}

.close-btn{
  width:42px;
  height:42px;

  border:0;

  border-radius:14px;

  background:#262d47;

  color:#fff;

  font-size:20px;
}

.detail-content{
  color:#dce0ec;
}

.detail-score{
  text-align:center;

  font-size:32px;

  font-weight:800;

  margin:20px 0;
}


/* ================================
   BOTTOM NAV
================================ */

.bottom-nav{
  position:fixed;

  left:0;
  right:0;
  bottom:0;

  height:82px;

  display:grid;

  grid-template-columns:
    repeat(4,1fr);

  background:
    rgba(9,13,29,.96);

  border-top:1px solid
    rgba(255,255,255,.06);

  backdrop-filter:blur(15px);

  z-index:900;
}

.nav-btn{
  border:0;

  background:none;

  color:#838aa0;

  font-size:13px;

  cursor:pointer;
}

.nav-btn span{
  display:block;

  font-size:25px;

  margin-bottom:4px;
}

.nav-btn.active{
  color:#fff;
}


/* ================================
   TOAST
================================ */

.toast{
  position:fixed;

  left:50%;
  bottom:100px;

  transform:
    translateX(-50%)
    translateY(20px);

  background:#20263c;

  color:#fff;

  padding:12px 18px;

  border-radius:15px;

  opacity:0;

  pointer-events:none;

  transition:.25s;

  z-index:2000;

  white-space:nowrap;
}

.toast.show{
  opacity:1;

  transform:
    translateX(-50%)
    translateY(0);
}


/* ================================
   DESKTOP
================================ */

@media(min-width:700px){

  body{
    max-width:850px;
    margin:auto;
  }

  .bottom-nav{
    max-width:850px;
    left:50%;
    transform:translateX(-50%);
  }

  .modal-box{
    border-radius:30px;
    margin-bottom:30px;
  }

}

</style>
</head>


<body>


<!-- ================================
     HEADER
================================ -->

<header class="header">

  <div class="brand">

    <div class="brand-icon">
      ⚽
    </div>

    <div>
      <div class="brand-title">
        Football Fan Zone
      </div>

      <div class="brand-sub">
        Live Scores & Match Center
      </div>
    </div>

  </div>


  <div class="header-actions">

    <button
      class="icon-btn"
      onclick="toggleTheme()"
      id="themeBtn"
    >
      🌙
    </button>

    <button
      class="icon-btn"
      onclick="loadMatches()"
    >
      🔄
    </button>

  </div>

</header>



<!-- ================================
     SEARCH
================================ -->

<div class="search-box">

  <span>🔎</span>

  <input
    type="text"
    id="searchInput"
    placeholder="দল বা লীগ খুঁজুন..."
  >

</div>



<!-- ================================
     SPORT
================================ -->

<div class="sport-tabs">

  <button
    class="sport-btn active"
    id="footballBtn"
    onclick="changeSport('football')"
  >
    ⚽ Football
  </button>

  <button
    class="sport-btn"
    id="cricketBtn"
    onclick="changeSport('cricket')"
  >
    🏏 Cricket
  </button>

</div>



<!-- ================================
     DATE SELECTOR
================================ -->

<section class="date-section">

  <div class="date-title">

    <div class="date-title-left">
      📅 ম্যাচের তারিখ
    </div>

    <div
      class="date-title-right"
      id="selectedDateText"
    >
      আজ
    </div>

  </div>


  <div
    class="date-scroll"
    id="dateScroll"
  ></div>

</section>



<!-- ================================
     FILTER
================================ -->

<div class="filters">

  <button
    class="filter-btn active"
    data-filter="all"
    onclick="changeFilter('all')"
  >
    সব
  </button>

  <button
    class="filter-btn"
    data-filter="live"
    onclick="changeFilter('live')"
  >
    🔴 Live
  </button>

  <button
    class="filter-btn"
    data-filter="upcoming"
    onclick="changeFilter('upcoming')"
  >
    🟢 Upcoming
  </button>

  <button
    class="filter-btn"
    data-filter="finished"
    onclick="changeFilter('finished')"
  >
    ⚪ Finished
  </button>

  <button
    class="filter-btn"
    data-filter="favorites"
    onclick="changeFilter('favorites')"
  >
    ⭐ Favorites
  </button>

</div>



<!-- ================================
     INFO
================================ -->

<div class="info-bar">

  <div>
    <span class="live-dot"></span>
    Live Score
  </div>

  <div id="updateText">
    শেষ আপডেট: --:--
  </div>

</div>



<!-- ================================
     MATCHES
================================ -->

<main
  class="matches"
  id="matches"
>

  <div class="loading">

    <div class="spinner"></div>

    ম্যাচ লোড হচ্ছে...

  </div>

</main>



<!-- ================================
     MODAL
================================ -->

<div
  class="modal"
  id="matchModal"
  onclick="closeModalOutside(event)"
>

  <div class="modal-box">

    <div class="modal-head">

      <h2>
        ম্যাচ বিস্তারিত
      </h2>

      <button
        class="close-btn"
        onclick="closeModal()"
      >
        ✕
      </button>

    </div>

    <div
      class="detail-content"
      id="detailContent"
    ></div>

  </div>

</div>



<!-- ================================
     BOTTOM NAV
================================ -->

<nav class="bottom-nav">

  <button
    class="nav-btn active"
    onclick="goHome()"
  >
    <span>🏠</span>
    Home
  </button>

  <button
    class="nav-btn"
    onclick="showLive()"
  >
    <span>🔴</span>
    Live
  </button>

  <button
    class="nav-btn"
    onclick="showFavorites()"
  >
    <span>⭐</span>
    Favorites
  </button>

  <button
    class="nav-btn"
    onclick="loadMatches()"
  >
    <span>🔄</span>
    Refresh
  </button>

</nav>



<!-- ================================
     TOAST
================================ -->

<div
  class="toast"
  id="toast"
></div>



<script>

/* =================================
   SETTINGS
================================ */

const API_BASE = "";

let sport = "cricket";

let currentFilter = "all";

let allMatches = [];

let selectedDate = getDateString(
  new Date()
);

let favorites =
  JSON.parse(
    localStorage.getItem(
      "footballFanFavorites"
    ) || "[]"
  );


/* =================================
   DATE
================================ */

function getDateString(date){

  const year =
    date.getFullYear();

  const month =
    String(
      date.getMonth()+1
    ).padStart(2,"0");

  const day =
    String(
      date.getDate()
    ).padStart(2,"0");

  return `${year}-${month}-${day}`;
}


function getDateObject(dateString){

  const parts =
    dateString.split("-");

  return new Date(
    Number(parts[0]),
    Number(parts[1])-1,
    Number(parts[2])
  );

}


function formatShortDate(date){

  return date.toLocaleDateString(
    "bn-BD",
    {
      day:"numeric",
      month:"short"
    }
  );

}


function getDayName(date){

  return date.toLocaleDateString(
    "bn-BD",
    {
      weekday:"short"
    }
  );

}


function renderDates(){

  const container =
    document.getElementById(
      "dateScroll"
    );

  container.innerHTML = "";

  const selected =
    getDateObject(
      selectedDate
    );


  for(
    let i=-3;
    i<=3;
    i++
  ){

    const date =
      new Date(selected);

    date.setDate(
      selected.getDate()+i
    );


    const value =
      getDateString(date);


    const chip =
      document.createElement(
        "button"
      );

    chip.className =
      "date-chip";


    if(
      value === selectedDate
    ){

      chip.classList.add(
        "active"
      );

    }


    const today =
      getDateString(
        new Date()
      );


    if(
      value === today
    ){

      chip.classList.add(
        "today"
      );

    }


    chip.innerHTML = `

      <span class="day">
        ${getDayName(date)}
      </span>

      <span class="number">
        ${date.getDate()}
      </span>

    `;


    chip.onclick = () => {

      selectedDate =
        value;

      renderDates();

      updateSelectedDateText();

      loadMatches();

    };


    container.appendChild(
      chip
    );

  }


  setTimeout(() => {

    const active =
      container.querySelector(
        ".active"
      );

    if(active){

      active.scrollIntoView({
        behavior:"smooth",
        block:"nearest",
        inline:"center"
      });

    }

  },50);

}


function updateSelectedDateText(){

  const date =
    getDateObject(
      selectedDate
    );

  const today =
    getDateString(
      new Date()
    );


  document.getElementById(
    "selectedDateText"
  ).textContent =
    selectedDate === today
      ? "আজ"
      : formatShortDate(date);

}


/* =================================
   SPORT
================================ */

function changeSport(
  selectedSport
){

  sport =
    selectedSport;


  document
    .getElementById(
      "footballBtn"
    )
    .classList.toggle(
      "active",
      sport === "football"
    );


  document
    .getElementById(
      "cricketBtn"
    )
    .classList.toggle(
      "active",
      sport === "cricket"
    );


  loadMatches();

}


/* =================================
   LOAD MATCHES
================================ */

async function loadMatches(){

  const container =
    document.getElementById(
      "matches"
    );


  container.innerHTML = `

    <div class="loading">

      <div class="spinner"></div>

      ${sport === "football"
        ? "Football"
        : "Cricket"
      } ম্যাচ লোড হচ্ছে...

    </div>

  `;


  try{

    const url =
      `${API_BASE}/api/${sport}?date=${selectedDate}`;


    const response =
      await fetch(url);


    if(!response.ok){

      throw new Error(
        "API error"
      );

    }


    const data =
      await response.json();


    if(
      Array.isArray(data)
    ){

      allMatches =
        data;

    }

    else if(
      Array.isArray(data.matches)
    ){

      allMatches =
        data.matches;

    }

    else if(
      Array.isArray(data.data)
    ){

      allMatches =
        data.data;

    }

    else{

      allMatches = [];

    }


    updateTime();

    renderMatches();


  }catch(error){

    console.error(error);

    container.innerHTML = `

      <div class="empty">

        😕 ম্যাচ ডাটা পাওয়া যাচ্ছে না।

        <br><br>

        আবার Refresh করুন।

      </div>

    `;

  }

}


/* =================================
   UPDATE TIME
================================ */

function updateTime(){

  const now =
    new Date();


  document.getElementById(
    "updateText"
  ).textContent =
    "শেষ আপডেট: " +
    now.toLocaleTimeString(
      "bn-BD",
      {
        hour:"numeric",
        minute:"2-digit"
      }
    );

}


/* =================================
   FILTER
================================ */

function changeFilter(
  filter
){

  currentFilter =
    filter;


  document
    .querySelectorAll(
      ".filter-btn"
    )
    .forEach(btn => {

      btn.classList.toggle(
        "active",
        btn.dataset.filter === filter
      );

    });


  renderMatches();

}


/* =================================
   SEARCH
================================ */

document
  .getElementById(
    "searchInput"
  )
  .addEventListener(
    "input",
    renderMatches
  );


/* =================================
   FILTERED MATCHES
================================ */

function getFilteredMatches(){

  let matches =
    [...allMatches];


  if(
    currentFilter ===
    "favorites"
  ){

    matches =
      matches.filter(
        match =>
          favorites.includes(
            getMatchId(match)
          )
      );

  }


  else if(
    currentFilter ===
    "live"
  ){

    matches =
      matches.filter(
        match =>
          isLive(match)
      );

  }


  else if(
    currentFilter ===
    "finished"
  ){

    matches =
      matches.filter(
        match =>
          isFinished(match)
      );

  }


  else if(
    currentFilter ===
    "upcoming"
  ){

    matches =
      matches.filter(
        match =>
          !isLive(match) &&
          !isFinished(match)
      );

  }


  const search =
    document
      .getElementById(
        "searchInput"
      )
      .value
      .trim()
      .toLowerCase();


  if(search){

    matches =
      matches.filter(
        match => {

          const text =
            JSON.stringify(
              match
            )
            .toLowerCase();

          return text.includes(
            search
          );

        }
      );

  }


  return matches;

}


/* =================================
   STATUS
================================ */

function isLive(match){

  const text =
    String(
      match.status ||
      match.status_text ||
      ""
    ).toLowerCase();


  return (
    text.includes("live") ||
    text.includes("inplay") ||
    text.includes("playing")
  );

}


function isFinished(match){

  const text =
    String(
      match.status ||
      match.status_text ||
      ""
    ).toLowerCase();


  return (
    text.includes("finished") ||
    text.includes("ended") ||
    text.includes("complete")
  );

}


/* =================================
   RENDER
================================ */

function renderMatches(){

  const container =
    document.getElementById(
      "matches"
    );


  const matches =
    getFilteredMatches();


  if(!matches.length){

    container.innerHTML = `

      <div class="empty">

        🏟️

        <br><br>

        এই তারিখে কোনো ম্যাচ পাওয়া যায়নি।

      </div>

    `;

    return;

  }


  container.innerHTML =
    matches
      .map(
        (match,index) =>
          createMatchCard(
            match,
            index
          )
      )
      .join("");

}


/* =================================
   MATCH ID
================================ */

function getMatchId(match){

  return String(
    match.id ||
    match.match_id ||
    match.url ||
    (
      match.home +
      "-" +
      match.away
    )
  );

}


/* =================================
   MATCH CARD
================================ */

function createMatchCard(
  match,
  index
){

  const home =
    match.home ||
    match.home_team ||
    "Home";


  const away =
    match.away ||
    match.away_team ||
    "Away";


  const homeLogo =
    match.home_logo ||
    match.home_image ||
    "";


  const awayLogo =
    match.away_logo ||
    match.away_image ||
    "";


  const competition =
    match.competition ||
    match.league ||
    "Football";


  const competitionLogo =
    match.competition_logo ||
    "";


  const homeScore =
    match.home_score ??
    "-";


  const awayScore =
    match.away_score ??
    "-";


  const live =
    isLive(match);


  const finished =
    isFinished(match);


  const status =
    match.status_text ||
    match.status ||
    (
      live
        ? "Live"
        : finished
          ? "Finished"
          : "Not started"
    );


  const time =
    match.time ||
    match.date_time ||
    match.start_time ||
    "";


  const id =
    getMatchId(match);


  const fav =
    favorites.includes(id);


  return `

    <div
      class="match-card"
      onclick="openMatchByIndex(${index})"
    >

      <div class="competition">

        ${
          competitionLogo
            ? `
              <img
                src="${safeUrl(
                  competitionLogo
                )}"
                onerror="this.style.display='none'"
              >
            `
            : "🏆"
        }

        <span>
          ${escapeHtml(
            competition
          )}
        </span>

      </div>


      <button
        class="favorite ${fav ? "active" : ""}"
        onclick="toggleFavoriteByIndex(event,${index})"
      >
        ${fav ? "★" : "☆"}
      </button>


      <div class="teams">

        <div class="team">

          ${
            homeLogo
              ? `
                <img
                  src="${safeUrl(
                    homeLogo
                  )}"
                  onerror="this.style.display='none'"
                >
              `
              : "⚽"
          }

          <div class="team-name">
            ${escapeHtml(home)}
          </div>

        </div>


        <div>

          <div class="score">

            ${escapeHtml(
              String(homeScore)
            )}

            -

            ${escapeHtml(
              String(awayScore)
            )}

          </div>


          <div
            class="status ${live ? "live" : ""}"
          >

            ${live ? "🔴 " : ""}

            ${escapeHtml(
              status
            )}

          </div>

        </div>


        <div class="team">

          ${
            awayLogo
              ? `
                <img
                  src="${safeUrl(
                    awayLogo
                  )}"
                  onerror="this.style.display='none'"
                >
              `
              : "⚽"
          }

          <div class="team-name">
            ${escapeHtml(away)}
          </div>

        </div>

      </div>


      <div class="match-time">

        🕐

        ${formatDate(time)}

      </div>

    </div>

  `;

}


/* =================================
   OPEN MATCH
================================ */

function openMatchByIndex(
  index
){

  const matches =
    getFilteredMatches();


  const match =
    matches[index];


  if(match){

    openMatch(match);

  }

}


async function openMatch(match){

  const modal =
    document.getElementById(
      "matchModal"
    );


  const content =
    document.getElementById(
      "detailContent"
    );


  const home =
    match.home ||
    match.home_team ||
    "Home";


  const away =
    match.away ||
    match.away_team ||
    "Away";


  const homeScore =
    match.home_score ?? "-";


  const awayScore =
    match.away_score ?? "-";


  content.innerHTML = `

    <div style="text-align:center">

      <div style="
        color:#9ea6bd;
        margin-bottom:15px;
      ">

        ${escapeHtml(
          match.competition ||
          match.league ||
          ""
        )}

      </div>


      <div class="detail-score">

        ${escapeHtml(
          String(homeScore)
        )}

        &nbsp; - &nbsp;

        ${escapeHtml(
          String(awayScore)
        )}

      </div>


      <div style="
        display:grid;
        grid-template-columns:1fr 1fr;
        gap:15px;
        margin-top:20px;
      ">

        <div>

          <div style="
            font-size:18px;
            font-weight:700;
          ">

            ${escapeHtml(home)}

          </div>

        </div>


        <div>

          <div style="
            font-size:18px;
            font-weight:700;
          ">

            ${escapeHtml(away)}

          </div>

        </div>

      </div>


      <div style="
        margin-top:25px;
        color:#aab1c5;
      ">

        ${escapeHtml(
          match.status_text ||
          match.status ||
          "Not started"
        )}

        <br><br>

        ${formatDate(
          match.time ||
          match.date_time ||
          ""
        )}

      </div>

    </div>

  `;


  modal.classList.add(
    "show"
  );


  /* ==========================
     EXTRA MATCH DETAILS
  ========================== */

  const slug =
    match.slug ||
    match.match_slug ||
    "";


  if(slug){

    try{

      const response =
        await fetch(
          `/api/match?sport=${encodeURIComponent(
            sport
          )}&slug=${encodeURIComponent(
            slug
          )}`
        );


      if(response.ok){

        const details =
          await response.json();


        console.log(
          "Match details:",
          details
        );

      }

    }catch(error){

      console.log(
        "Details unavailable",
        error
      );

    }

  }

}


/* =================================
   FAVORITE
================================ */

function toggleFavoriteByIndex(
  event,
  index
){

  event.stopPropagation();


  const matches =
    getFilteredMatches();


  const match =
    matches[index];


  if(!match)return;


  const id =
    getMatchId(match);


  toggleFavorite(id);

}


function toggleFavorite(id){

  if(
    favorites.includes(id)
  ){

    favorites =
      favorites.filter(
        item => item !== id
      );

    showToast(
      "⭐ Favorites থেকে সরানো হয়েছে"
    );

  }else{

    favorites.push(id);

    showToast(
      "⭐ Favorites এ যোগ হয়েছে"
    );

  }


  localStorage.setItem(
    "footballFanFavorites",
    JSON.stringify(
      favorites
    )
  );


  renderMatches();

}


/* =================================
   THEME
================================ */

function toggleTheme(){

  document.body.classList.toggle(
    "light"
  );


  const light =
    document.body.classList.contains(
      "light"
    );


  document.getElementById(
    "themeBtn"
  ).textContent =
    light
      ? "☀️"
      : "🌙";


  localStorage.setItem(
    "fanZoneTheme",
    light
      ? "light"
      : "dark"
  );

}


if(
  localStorage.getItem(
    "fanZoneTheme"
  ) === "light"
){

  document.body.classList.add(
    "light"
  );

  document.getElementById(
    "themeBtn"
  ).textContent =
    "☀️";

}


/* =================================
   BOTTOM NAV
================================ */

  currentFilter =
    "all";

  document

      ".filter-btn"
    )

  });

function showLive(){

    "live"
  );

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


function showFavorites(){

  changeFilter(
    "favorites"
  );

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* =================================
   MODAL
================================ */

function closeModal(){

  document
    .getElementById(
      "matchModal"
    )
    .classList.remove(
      "show"
    );

}


function closeModalOutside(
  event
){

  if(
    event.target.id ===
    "matchModal"
  ){

    closeModal();

  }

}


/* =================================
   FORMAT DATE
================================ */

function formatDate(
  value
){

  if(!value){

    return "সময় পাওয়া যায়নি";

  }


  try{

    const date =
      new Date(value);


    if(
      isNaN(
        date.getTime()
      )
    ){

      return escapeHtml(
        String(value)
      );

    }


    return date.toLocaleString(
      "bn-BD",
      {
        day:"numeric",
        month:"long",
        year:"numeric",
        hour:"numeric",
        minute:"2-digit"
      }
    );

  }catch{

    return String(value);

  }

}


/* =================================
   SECURITY
================================ */

function escapeHtml(
  text
){

  return String(text)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function safeUrl(
  url
){

  const value =
    String(url || "");


  if(
    value.startsWith("http://") ||
    value.startsWith("https://")
  ){

    return value;

  }


  return "";

}


/* =================================
   TOAST
================================ */

let toastTimer;

function showToast(
  message
){

  const toast =
    document.getElementById(
      "toast"
    );


  toast.textContent =
    message;


  toast.classList.add(
    "show"
  );


  clearTimeout(
    toastTimer
  );


  toastTimer =
    setTimeout(
      () => {

        toast.classList.remove(
          "show"
        );

      },
      2200
    );

}

   INITIAL

renderDates();

updateSelectedDateText();

loadMatches();

setInterval(

    loadMatches();

);
