<!DOCTYPE html>
<html lang="bn">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<meta
  name="theme-color"
  content="#0b1020"
>

<title>Football Fan Zone</title>

<style>

/* =========================================
   RESET
========================================= */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}

body{

  background:
    radial-gradient(
      circle at top left,
      #172554,
      transparent 35%
    ),
    radial-gradient(
      circle at bottom right,
      #312e81,
      transparent 35%
    ),
    #070b16;

  color:#fff;

  min-height:100vh;

  transition:
    background .3s,
    color .3s;

}

body.light{

  background:
    linear-gradient(
      135deg,
      #eef2ff,
      #f8fafc
    );

  color:#111827;

}


/* =========================================
   HEADER
========================================= */

.header{

  position:sticky;

  top:0;

  z-index:50;

  padding:
    15px
    15px
    12px;

  background:
    rgba(7,11,22,.84);

  backdrop-filter:
    blur(18px);

  border-bottom:
    1px solid
    rgba(255,255,255,.08);

}

body.light .header{

  background:
    rgba(255,255,255,.85);

  border-bottom:
    1px solid
    rgba(0,0,0,.08);

}

.header-top{

  display:flex;

  align-items:center;

  justify-content:space-between;

}

.logo{

  display:flex;

  align-items:center;

  gap:10px;

}

.logo-icon{

  width:42px;

  height:42px;

  border-radius:14px;

  display:flex;

  align-items:center;

  justify-content:center;

  font-size:23px;

  background:
    linear-gradient(
      135deg,
      #2563eb,
      #7c3aed
    );

  box-shadow:
    0 8px 25px
    rgba(79,70,229,.35);

}

.logo-text{

  font-size:18px;

  font-weight:800;

}

.logo-sub{

  font-size:11px;

  opacity:.6;

  margin-top:2px;

}

.header-actions{

  display:flex;

  gap:8px;

}

.icon-btn{

  width:40px;

  height:40px;

  border:0;

  border-radius:13px;

  background:
    rgba(255,255,255,.08);

  color:inherit;

  font-size:18px;

  cursor:pointer;

}

body.light .icon-btn{

  background:
    rgba(0,0,0,.06);

}


/* =========================================
   SEARCH
========================================= */

.search-box{

  margin-top:14px;

  position:relative;

}

.search-box input{

  width:100%;

  height:48px;

  border:
    1px solid
    rgba(255,255,255,.08);

  border-radius:15px;

  outline:none;

  padding:
    0 16px
    0 45px;

  background:
    rgba(255,255,255,.06);

  color:inherit;

  font-size:14px;

}

body.light .search-box input{

  background:
    rgba(0,0,0,.05);

  border-color:
    rgba(0,0,0,.08);

}

.search-icon{

  position:absolute;

  left:16px;

  top:14px;

  opacity:.65;

}


/* =========================================
   SPORT TABS
========================================= */

.sport-tabs{

  display:flex;

  gap:8px;

  margin-top:14px;

}

.sport-tab{

  flex:1;

  height:44px;

  border:0;

  border-radius:14px;

  background:
    rgba(255,255,255,.06);

  color:inherit;

  font-weight:700;

  cursor:pointer;

}

.sport-tab.active{

  background:
    linear-gradient(
      135deg,
      #2563eb,
      #7c3aed
    );

  box-shadow:
    0 8px 25px
    rgba(79,70,229,.3);

}


/* =========================================
   DATE BAR
========================================= */

.date-bar{

  display:flex;

  align-items:center;

  gap:8px;

  padding:
    12px 15px 4px;

}

.date-btn{

  width:42px;

  height:42px;

  border:0;

  border-radius:13px;

  background:
    rgba(255,255,255,.07);

  color:inherit;

  font-size:25px;

  cursor:pointer;

}

.date-main{

  flex:1;

  height:42px;

  border:0;

  border-radius:13px;

  background:
    rgba(255,255,255,.07);

  color:inherit;

  cursor:pointer;

}

.date-main span{

  display:block;

  font-size:13px;

  font-weight:800;

}

.date-main small{

  display:block;

  font-size:10px;

  opacity:.55;

  margin-top:2px;

}

body.light .date-btn,
body.light .date-main{

  background:
    rgba(0,0,0,.06);

}


/* =========================================
   FILTERS
========================================= */

.filters{

  display:flex;

  gap:8px;

  overflow-x:auto;

  padding:
    15px
    15px
    5px;

}

.filters::-webkit-scrollbar{

  display:none;

}

.filter{

  white-space:nowrap;

  padding:
    9px 14px;

  border:0;

  border-radius:20px;

  background:
    rgba(255,255,255,.07);

  color:inherit;

  font-size:12px;

  cursor:pointer;

}

.filter.active{

  background:
    linear-gradient(
      135deg,
      #2563eb,
      #7c3aed
    );

}


/* =========================================
   INFO
========================================= */

.info-bar{

  display:flex;

  align-items:center;

  justify-content:space-between;

  padding:
    8px 15px
    12px;

  font-size:11px;

  opacity:.7;

}

.live-dot{

  width:7px;

  height:7px;

  border-radius:50%;

  background:#22c55e;

  display:inline-block;

  margin-right:5px;

  box-shadow:
    0 0 10px
    #22c55e;

}


/* =========================================
   MATCH LIST
========================================= */

.matches{

  padding:
    0 15px
    90px;

}

.date-title{

  margin:
    12px 0 9px;

  font-size:12px;

  font-weight:800;

  opacity:.65;

}


/* =========================================
   MATCH CARD
========================================= */

.match-card{

  position:relative;

  margin-bottom:12px;

  padding:15px;

  border-radius:20px;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.095),
      rgba(255,255,255,.035)
    );

  border:
    1px solid
    rgba(255,255,255,.08);

  backdrop-filter:
    blur(15px);

  box-shadow:
    0 10px 35px
    rgba(0,0,0,.18);

  cursor:pointer;

  transition:
    transform .18s;

}

.match-card:active{

  transform:scale(.985);

}

body.light .match-card{

  background:
    rgba(255,255,255,.82);

  border-color:
    rgba(0,0,0,.07);

  box-shadow:
    0 8px 25px
    rgba(0,0,0,.06);

}

.competition{

  display:flex;

  align-items:center;

  gap:8px;

  font-size:11px;

  opacity:.65;

  margin-bottom:12px;

}

.competition img{

  width:22px;

  height:22px;

  object-fit:contain;

  border-radius:6px;

}

.favorite{

  position:absolute;

  top:12px;

  right:12px;

  width:32px;

  height:32px;

  border:0;

  border-radius:10px;

  background:
    rgba(255,255,255,.07);

  color:#fff;

  cursor:pointer;

}

.favorite.active{

  color:#facc15;

}

.teams{

  display:grid;

  grid-template-columns:
    1fr
    65px
    1fr;

  align-items:center;

  gap:10px;

}

.team{

  display:flex;

  flex-direction:column;

  align-items:center;

  text-align:center;

  gap:7px;

}

.team img{

  width:46px;

  height:46px;

  object-fit:contain;

}

.team-name{

  font-size:13px;

  font-weight:700;

  line-height:1.25;

}

.score{

  text-align:center;

}

.score-number{

  font-size:23px;

  font-weight:900;

}

.score-status{

  margin-top:5px;

  font-size:10px;

  opacity:.65;

}

.score-status.live{

  color:#22c55e;

  opacity:1;

  font-weight:800;

}

.match-time{

  text-align:center;

  margin-top:13px;

  font-size:11px;

  opacity:.6;

}


/* =========================================
   EMPTY
========================================= */

.empty{

  text-align:center;

  padding:
    60px 20px;

  opacity:.65;

}

.empty-icon{

  font-size:42px;

  margin-bottom:10px;

}


/* =========================================
   LOADING
========================================= */

.loading{

  display:flex;

  flex-direction:column;

  align-items:center;

  justify-content:center;

  padding:70px 20px;

  opacity:.7;

}

.spinner{

  width:35px;

  height:35px;

  border:
    3px solid
    rgba(255,255,255,.15);

  border-top-color:#7c3aed;

  border-radius:50%;

  animation:
    spin .8s linear infinite;

  margin-bottom:12px;

}

@keyframes spin{

  to{
    transform:rotate(360deg);
  }

}


/* =========================================
   MODAL
========================================= */

.modal{

  position:fixed;

  inset:0;

  z-index:100;

  display:none;

  align-items:flex-end;

  justify-content:center;

  background:
    rgba(0,0,0,.7);

  backdrop-filter:
    blur(8px);

}

.modal.show{

  display:flex;

}

.modal-box{

  width:100%;

  max-width:600px;

  max-height:90vh;

  overflow-y:auto;

  padding:20px;

  border-radius:
    25px 25px 0 0;

  background:#101525;

  border-top:
    1px solid
    rgba(255,255,255,.1);

}

body.light .modal-box{

  background:#fff;

}

.modal-head{

  display:flex;

  align-items:center;

  justify-content:space-between;

  margin-bottom:20px;

}

.modal-title{

  font-size:18px;

  font-weight:800;

}

.close{

  width:38px;

  height:38px;

  border:0;

  border-radius:12px;

  background:
    rgba(255,255,255,.08);

  color:inherit;

  font-size:20px;

  cursor:pointer;

}


/* =========================================
   DETAIL
========================================= */

.detail-competition{

  text-align:center;

  font-size:12px;

  opacity:.65;

  margin-bottom:15px;

}

.detail-teams{

  display:grid;

  grid-template-columns:
    1fr
    80px
    1fr;

  align-items:center;

  gap:10px;

}

.detail-team{

  text-align:center;

}

.detail-team img{

  width:65px;

  height:65px;

  object-fit:contain;

  margin-bottom:8px;

}

.detail-team-name{

  font-weight:800;

  font-size:14px;

}

.detail-score{

  text-align:center;

}

.detail-score-number{

  font-size:30px;

  font-weight:900;

}

.detail-status{

  margin-top:5px;

  font-size:11px;

  opacity:.7;

}

.detail-status.live{

  color:#22c55e;

  font-weight:800;

}

.detail-info{

  margin-top:22px;

  display:grid;

  gap:9px;

}

.detail-row{

  display:flex;

  align-items:center;

  justify-content:space-between;

  padding:
    13px 14px;

  border-radius:14px;

  background:
    rgba(255,255,255,.05);

}

.detail-label{

  opacity:.6;

  font-size:12px;

}

.detail-value{

  font-size:12px;

  font-weight:700;

  text-align:right;

}

.detail-actions{

  display:flex;

  gap:9px;

  margin-top:15px;

}

.detail-btn{

  flex:1;

  height:45px;

  border:0;

  border-radius:13px;

  cursor:pointer;

  font-weight:800;

  color:#fff;

  background:
    linear-gradient(
      135deg,
      #2563eb,
      #7c3aed
    );

}

.detail-btn.secondary{

  background:
    rgba(255,255,255,.08);

  color:inherit;

}


/* =========================================
   BOTTOM NAV
========================================= */

.bottom-nav{

  position:fixed;

  bottom:0;

  left:0;

  right:0;

  z-index:40;

  height:67px;

  display:flex;

  justify-content:space-around;

  align-items:center;

  background:
    rgba(7,11,22,.9);

  backdrop-filter:
    blur(18px);

  border-top:
    1px solid
    rgba(255,255,255,.08);

}

body.light .bottom-nav{

  background:
    rgba(255,255,255,.92);

  border-top:
    1px solid
    rgba(0,0,0,.08);

}

.nav-btn{

  background:none;

  border:0;

  color:inherit;

  opacity:.55;

  display:flex;

  flex-direction:column;

  align-items:center;

  gap:4px;

  font-size:10px;

  cursor:pointer;

}

.nav-btn span:first-child{

  font-size:19px;

}

.nav-btn.active{

  opacity:1;

}


/* =========================================
   TOAST
========================================= */

.toast{

  position:fixed;

  left:50%;

  bottom:80px;

  transform:
    translate(-50%,20px);

  padding:
    11px 16px;

  border-radius:13px;

  background:#111827;

  color:#fff;

  font-size:12px;

  opacity:0;

  pointer-events:none;

  transition:.25s;

  z-index:200;

}

.toast.show{

  opacity:1;

  transform:
    translate(-50%,0);

}


/* =========================================
   DATE PICKER
========================================= */

#datePicker{

  position:fixed;

  left:50%;

  top:50%;

  transform:
    translate(-50%,-50%);

  z-index:300;

}


/* =========================================
   DESKTOP
========================================= */

@media(min-width:700px){

  .header{

    padding-left:
      max(
        15px,
        calc((100% - 700px)/2 + 15px)
      );

    padding-right:
      max(
        15px,
        calc((100% - 700px)/2 + 15px)
      );

  }

  .matches{

    max-width:700px;

    margin:auto;

  }

  .filters,
  .date-bar,
  .info-bar{

    max-width:700px;

    margin:auto;

  }

}

</style>

</head>


<body>


<!-- =========================================
     HEADER
========================================= -->

<header class="header">

  <div class="header-top">

    <div class="logo">

      <div class="logo-icon">
        ⚽
      </div>

      <div>

        <div class="logo-text">
          Football Fan Zone
        </div>

        <div class="logo-sub">
          Live Scores & Match Center
        </div>

      </div>

    </div>


    <div class="header-actions">

      <button
        class="icon-btn"
        id="themeBtn"
        onclick="toggleTheme()"
      >
        🌙
      </button>

      <button
        class="icon-btn"
        onclick="loadMatches()"
      >
        🔄
      </button>

    </div>

  </div>


  <div class="search-box">

    <span class="search-icon">
      🔎
    </span>

    <input
      id="search"
      type="search"
      placeholder="দল বা লীগ খুঁজুন..."
      autocomplete="off"
    >

  </div>


  <div class="sport-tabs">

    <button
      class="sport-tab active"
      id="footballTab"
      onclick="changeSport('football')"
    >
      ⚽ Football
    </button>

      class="sport-tab"
      id="cricketTab"
      onclick="changeSport('cricket')"
    >
      🏏 Cricket
    </button>

  </div>

</header>


<!-- =========================================
     DATE
========================================= -->

<div class="date-bar">

  <button
    class="date-btn"
    onclick="changeDate(-1)"
  >
    ‹
  </button>


  <button
    class="date-main"
    onclick="openDatePicker()"
  >

    <span id="dateTitle">
      আজ
    </span>

    <small id="dateValue">
      -
    </small>

  </button>


  <button
    class="date-btn"
    onclick="changeDate(1)"
  >
    ›
  </button>

</div>


<input
  type="date"
  id="datePicker"
>


<!-- =========================================
     FILTERS
========================================= -->

<div class="filters">

  <button
    class="filter active"
    data-filter="all"
    onclick="changeFilter('all',this)"
  >
    সব
  </button>


  <button
    class="filter"
    data-filter="live"
    onclick="changeFilter('live',this)"
  >
    🔴 Live
  </button>


  <button
    class="filter"
    data-filter="upcoming"
    onclick="changeFilter('upcoming',this)"
  >
    🟢 Upcoming
  </button>


  <button
    class="filter"
    data-filter="finished"
    onclick="changeFilter('finished',this)"
  >
    ⚪ Finished
  </button>


  <button
    class="filter"
    data-filter="favorites"
    onclick="changeFilter('favorites',this)"
  >
    ⭐ Favorites
  </button>

</div>


<!-- =========================================
     INFO
========================================= -->

<div class="info-bar">

  <div>

    <span class="live-dot"></span>

    Live Score

  </div>


  <div id="updated">
    আপডেট হচ্ছে...
  </div>

</div>


<!-- =========================================
     MATCHES
========================================= -->

<main
  class="matches"
  id="matches"
>

  <div class="loading">

    <div class="spinner"></div>

    ম্যাচ লোড হচ্ছে...

  </div>

</main>


<!-- =========================================
     MODAL
========================================= -->

<div
  class="modal"
  id="modal"
  onclick="closeModalOutside(event)"
>

  <div
    class="modal-box"
    id="modalBox"
  >

    <div class="modal-head">

      <div class="modal-title">
        Match Details
      </div>

      <button
        class="close"
        onclick="closeModal()"
      >
        ×
      </button>

    </div>


    <div id="detailContent">

      Loading...

    </div>

  </div>

</div>


<!-- =========================================
     BOTTOM NAV
========================================= -->

<nav class="bottom-nav">

  <button
    class="nav-btn active"
    onclick="goHome()"
  >

    <span>🏠</span>
    <span>Home</span>

  </button>


  <button
    class="nav-btn"
    onclick="showLive()"
  >

    <span>🔴</span>
    <span>Live</span>

  </button>


  <button
    class="nav-btn"
    onclick="showFavorites()"
  >

    <span>⭐</span>
    <span>Favorites</span>

  </button>


  <button
    class="nav-btn"
    onclick="loadMatches()"
  >

    <span>🔄</span>
    <span>Refresh</span>

  </button>

</nav>


<div
  class="toast"
  id="toast"
></div>


<script>

/* =========================================
   CONFIG
========================================= */

const API_URL = "";


/* =========================================
   STATE
========================================= */

let sport =
  "football";

let currentFilter =
  "all";

let allMatches =
  [];

let favorites =
  JSON.parse(
    localStorage.getItem(
      "footballFanFavorites"
    ) || "[]"
  );


/* =========================================
   DATE STATE
========================================= */

let selectedDate =
  new Date();


/* =========================================
   DATE STRING
========================================= */

function getDateString(
  date
){

  const year =
    date.getFullYear();

  const month =
    String(
      date.getMonth() + 1
    ).padStart(2,"0");

  const day =
    String(
      date.getDate()
    ).padStart(2,"0");

  return (
    year +
    "-" +
    month +
    "-" +
    day
  );

}


/* =========================================
   DATE UI
========================================= */

function updateDateUI(){

  const today =
    new Date();


  const todayString =
    getDateString(
      today
    );


  const selectedString =
    getDateString(
      selectedDate
    );


  const title =
    document.getElementById(
      "dateTitle"
    );


  const value =
    document.getElementById(
      "dateValue"
    );


  if(
    selectedString ===
    todayString
  ){

    title.textContent =
      "আজ";

  }else{

    title.textContent =
      selectedDate.toLocaleDateString(
        "bn-BD",
        {
          weekday:
            "long"
        }
      );

  }


  value.textContent =
    selectedDate.toLocaleDateString(
      "bn-BD",
      {
        day:
          "numeric",

        month:
          "long",

        year:
          "numeric"
      }
    );

}


/* =========================================
   CHANGE DATE
========================================= */

function changeDate(
  amount
){

  selectedDate =
    new Date(
      selectedDate
    );


  selectedDate.setDate(
    selectedDate.getDate() +
    amount
  );


  updateDateUI();

  loadMatches();

}


/* =========================================
   DATE PICKER
========================================= */

function openDatePicker(){

  const picker =
    document.getElementById(
      "datePicker"
    );


  picker.value =
    getDateString(
      selectedDate
    );


  if(
    picker.showPicker
  ){

    picker.showPicker();

  }else{

    picker.click();

  }

}


document
  .getElementById(
    "datePicker"
  )
  .addEventListener(
    "change",
    function(){

      if(!this.value){

        return;

      }


      selectedDate =
        new Date(
          this.value +
          "T00:00:00"
        );


      updateDateUI();

      loadMatches();

    }
  );


/* =========================================
   CHANGE SPORT
========================================= */

function changeSport(
  newSport
){

  sport =
    newSport;


  currentFilter =
    "all";


  document
    .getElementById(
      "footballTab"
    )
    .classList
    .toggle(
      "active",
      sport ===
      "football"
    );


  document
    .getElementById(
      "cricketTab"
    )
    .classList
    .toggle(
      "active",
      sport ===
      "cricket"
    );


  document
    .querySelectorAll(
      ".filter"
    )
    .forEach(
      btn =>
        btn.classList
          .remove(
            "active"
          )
    );


  document
    .querySelector(
      '[data-filter="all"]'
    )
    .classList
    .add(
      "active"
    );


  loadMatches();

}


/* =========================================
   LOAD MATCHES
========================================= */

async function loadMatches(){

  const container =
    document.getElementById(
      "matches"
    );


  container.innerHTML = `

    <div class="loading">

      <div class="spinner"></div>

      ম্যাচ লোড হচ্ছে...

    </div>

  `;


  try{

    const date =
      getDateString(
        selectedDate
      );


    const response =
      await fetch(
        API_URL +
        "/api/" +
        sport +
        "?date=" +
        encodeURIComponent(
          date
        ) +
        "&t=" +
        Date.now()
      );


    if(!response.ok){

      throw new Error(
        "HTTP " +
        response.status
      );

    }


    const data =
      await response.json();


    allMatches =
      Array.isArray(
        data
      )
      ?
      data
      :
      (
        Array.isArray(
          data.matches
        )
        ?
        data.matches
        :
        []
      );


    document.getElementById(
      "updated"
    ).textContent =
      "শেষ আপডেট: " +
      new Date()
        .toLocaleTimeString(
          "bn-BD",
          {
            hour:
              "2-digit",

            minute:
              "2-digit"
          }
        );


    renderMatches();


  }catch(error){

    console.error(
      error
    );


    container.innerHTML = `

      <div class="empty">

        <div class="empty-icon">
          ⚠️
        </div>

        <div>
          ম্যাচের তথ্য পাওয়া যাচ্ছে না
        </div>

        <button
          class="detail-btn"
          style="
            margin-top:15px;
            max-width:180px;
          "
          onclick="loadMatches()"
        >
          আবার চেষ্টা করুন
        </button>

      </div>

    `;

  }

}


/* =========================================
   FILTER
========================================= */

function changeFilter(
  filter,
  button
){

  currentFilter =
    filter;


  document
    .querySelectorAll(
      ".filter"
    )
    .forEach(
      btn =>
        btn.classList
          .remove(
            "active"
          )
    );


  button.classList.add(
    "active"
  );


  renderMatches();

}


/* =========================================
   SEARCH
========================================= */

document
  .getElementById(
    "search"
  )
  .addEventListener(
    "input",
    renderMatches
  );


/* =========================================
   GET FILTERED
========================================= */

function getFilteredMatches(){

  const search =
    document
      .getElementById(
        "search"
      )
      .value
      .trim()
      .toLowerCase();


  let matches =
    [
      ...allMatches
    ];


  if(
    currentFilter !==
      "all" &&
    currentFilter !==
      "favorites"
  ){

    matches =
      matches.filter(
        match =>
          String(
            match.status ||
            ""
          ).toLowerCase()
          ===
          currentFilter
      );

  }


  if(
    currentFilter ===
    "favorites"
  ){

    matches =
      matches.filter(
        match =>
          favorites.includes(
            getMatchId(
              match
            )
          )
      );

  }


  if(search){

    matches =
      matches.filter(
        match => {

          const text = (

            (match.home ||
              "") +
            " " +

            (match.away ||
              "") +
            " " +

            (match.competition ||
              "")

          ).toLowerCase();


          return text.includes(
            search
          );

        }
      );

  }


  return matches;

}


/* =========================================
   RENDER
========================================= */

function renderMatches(){

  const container =
    document.getElementById(
      "matches"
    );


  const matches =
    getFilteredMatches();


  if(
    matches.length === 0
  ){

    container.innerHTML = `

      <div class="empty">

        <div class="empty-icon">
          ⚽
        </div>

        <div>
          এই তারিখে কোনো ম্যাচ পাওয়া যায়নি
        </div>

      </div>

    `;

    return;

  }


  container.innerHTML =
    matches
      .map(
        match =>
          createMatchCard(
            match
          )
      )
      .join("");

}


/* =========================================
   MATCH ID
========================================= */

function getMatchId(
  match
){

  return (
    match.url ||
    (
      (match.home ||
        "") +
      "_" +
      (match.away ||
        "") +
      "_" +
      (match.time ||
        "")
    )
  );

}


/* =========================================
   MATCH CARD
========================================= */

function createMatchCard(
  match
){

  const id =
    getMatchId(
      match
    );


  const isFavorite =
    favorites.includes(
      id
    );


  const status =
    String(
      match.status ||
      ""
    ).toLowerCase();


  const isLive =
    status ===
    "live";


  const scoreHome =
    match.home_score ??
    "-";


  const scoreAway =
    match.away_score ??
    "-";


  return `

    <article
      class="match-card"
      onclick='openMatch(${JSON.stringify(match)})'
    >

      <button
        class="favorite ${
          isFavorite
          ? "active"
          : ""
        }"
        onclick="
          event.stopPropagation();
          toggleFavorite(
            '${escapeJs(id)}'
          )
        "
      >
        ${
          isFavorite
          ? "★"
          : "☆"
        }
      </button>


      <div class="competition">

        ${
          match.competition_logo
          ?
          `
          <img
            src="${safeUrl(
              match.competition_logo
            )}"
            alt=""
          >
          `
          :
          "🏆"
        }


        <span>
          ${
            escapeHtml(
              match.competition ||
              "Competition"
            )
          }
        </span>

      </div>


      <div class="teams">


        <div class="team">

          ${
            match.home_logo
            ?
            `
            <img
              src="${safeUrl(
                match.home_logo
              )}"
              alt=""
              onerror="
                this.style.display='none'
              "
            >
            `
            :
            `
            <div style="
              font-size:35px
            ">
              ⚽
            </div>
            `
          }


          <div class="team-name">

            ${
              escapeHtml(
                match.home ||
                "Home"
              )
            }

          </div>

        </div>


        <div class="score">

          <div class="score-number">

            ${
              escapeHtml(
                String(
                  scoreHome
                )
              )
            }

            -

            ${
              escapeHtml(
                String(
                  scoreAway
                )
              )
            }

          </div>


          <div
            class="
              score-status
              ${
                isLive
                ? "live"
                : ""
              }
            "
          >

            ${
              escapeHtml(
                match.status_text ||
                match.status ||
                "Unknown"
              )
            }

          </div>

        </div>


        <div class="team">

          ${
            match.away_logo
            ?
            `
            <img
              src="${safeUrl(
                match.away_logo
              )}"
              alt=""
              onerror="
                this.style.display='none'
              "
            >
            `
            :
            `
            <div style="
              font-size:35px
            ">
              ⚽
            </div>
            `
          }


          <div class="team-name">

            ${
              escapeHtml(
                match.away ||
                "Away"
              )
            }

          </div>

        </div>

      </div>


      <div class="match-time">

        🕐

        ${
          formatDate(
            match.time
          )
        }

      </div>

    </article>

  `;

}


/* =========================================

            escapeHtml(
              match.away ||

            )

    </div>

      <div class="detail-row">

            )
          }

        </span>

      </div>


      <div class="detail-row">

        <span class="detail-label">
          📅 Date & Time
        </span>

        <span class="detail-value">

          ${
            formatDate(
              match.time
            )
          }

      </div>

        <span class="detail-label">
          📊 Status

/* =========================================
   FAVORITE
========================================= */

function toggleFavorite(
  id
){

  const index =
    favorites.indexOf(
      id
    );


  if(index >= 0){

    favorites.splice(
      index,
      1
    );

    showToast(
      "⭐ Favorite থেকে সরানো হয়েছে"
    );

  }else{

    favorites.push(
      id
    );

    showToast(
      "⭐ Favorite-এ যোগ হয়েছে"
    );

  }


  localStorage.setItem(
    "footballFanFavorites",
    JSON.stringify(
      favorites
    )
  );


  renderMatches();

}


/* =========================================
   THEME
========================================= */

function toggleTheme(){

  document.body.classList.toggle(
    "light"
  );


  const light =
    document.body.classList.contains(
      "light"
    );


  document.getElementById(
    "themeBtn"
  ).textContent =
    light
    ? "☀️"
    : "🌙";


  localStorage.setItem(
    "fanZoneTheme",
    light
    ? "light"
    : "dark"
  );

}


if(
  localStorage.getItem(
    "fanZoneTheme"
  ) === "light"
){

  document.body.classList.add(
    "light"
  );


  document.getElementById(
    "themeBtn"
  ).textContent =
    "☀️";

}

  event

    event.target.id ===
    "modal"
  ){

    closeModal();

  }

}


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHtml(
  value
){

  return String(
    value
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}


/* =========================================
   ESCAPE JS
========================================= */

function escapeJs(
  value
){

  return String(
    value
  )
  .replace(
    /\\/g,
    "\\\\"
  )
  .replace(
    /'/g,
    "\\'"
  );

}


/* =========================================
   SAFE URL
========================================= */

function safeUrl(
  url
){

  if(
    typeof url !==
    "string"
  ){

    return "";

  }


  if(
    url.startsWith(
      "https://"
    ) ||
    url.startsWith(
      "http://"
    )
  ){

    return url;

  }


  return "";

}


/* =========================================
   FORMAT DATE
========================================= */

function formatDate(
  value
){

  if(!value){

    return "সময় পাওয়া যায়নি";

  }


  try{

    const date =
      new Date(
        value
      );


    if(
      Number.isNaN(
        date.getTime()
      )
    ){

      return value;

    }


    return date.toLocaleString(
      "bn-BD",
      {
        day:
          "numeric",

        month:
          "short",

        year:
          "numeric",

        hour:
          "2-digit",

        minute:
          "2-digit"
      }
    );

  }catch{

    return value;

  }

}


/* =========================================
   TOAST
========================================= */

let toastTimer;


function showToast(
  message
){

  const toast =
    document.getElementById(
      "toast"
    );


  toast.textContent =
    message;


  toast.classList.add(
    "show"
  );


  clearTimeout(
    toastTimer
  );


  toastTimer =
    setTimeout(
      () => {

        toast.classList.remove(
          "show"
        );

      },
      2200
    );

}


/* =========================================
   INITIAL
========================================= */

updateDateUI();

loadMatches();


/* =========================================
   AUTO REFRESH
========================================= */

setInterval(
  () => {

    loadMatches();

  },
  30000
);
