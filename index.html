<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ফুটবল ফ্যান জোন - Football Fan Zone</title>
  <style>
    :root {
      --bg-dark: #0a0f1d;
      --card-bg: #131b2e;
      --accent-green: #00ff88;
      --accent-yellow: #ffcc00;
      --accent-blue: #00d2ff;
      --text-light: #f0f4f8;
      --text-dim: #8a99ad;
      --border-color: #23314a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-light);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      background: linear-gradient(135deg, #0d1527, #18253f);
      border-bottom: 2px solid var(--accent-green);
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      font-size: 1.4rem;
      font-weight: bold;
      color: var(--accent-green);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .controls {
      display: flex;
      gap: 10px;
    }

    .btn-sound {
      background: #1e2c48;
      border: 1px solid var(--border-color);
      color: var(--text-light);
      padding: 8px 12px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.2s;
    }

    .btn-sound:hover {
      background: var(--accent-green);
      color: #000;
    }

    nav {
      background: #0d1527;
      display: flex;
      justify-content: space-around;
      border-bottom: 1px solid var(--border-color);
      overflow-x: auto;
    }

    nav button {
      background: none;
      border: none;
      color: var(--text-dim);
      padding: 12px 16px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      border-bottom: 3px solid transparent;
      transition: all 0.2s;
    }

    nav button.active {
      color: var(--accent-green);
      border-bottom-color: var(--accent-green);
    }

    main {
      flex: 1;
      padding: 15px;
      max-width: 1000px;
      width: 100%;
      margin: 0 auto;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 15px;
    }

    .card-title {
      color: var(--accent-yellow);
      font-size: 1.1rem;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .live-tracker-container {
      width: 100%;
      height: 650px;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border-color);
      background: #1e293b;
    }

    .chat-box {
      height: 300px;
      overflow-y: auto;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 10px;
      background: #0b1120;
      margin-bottom: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .chat-message {
      background: #182339;
      padding: 8px 12px;
      border-radius: 8px;
      max-width: 85%;
    }

    .chat-user {
      font-size: 0.8rem;
      color: var(--accent-blue);
      font-weight: bold;
      margin-bottom: 3px;
    }

    .chat-text {
      font-size: 0.9rem;
    }

    .chat-input-group {
      display: flex;
      gap: 8px;
    }

    .chat-input-group input {
      flex: 1;
      background: #0b1120;
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 10px;
      border-radius: 6px;
      outline: none;
    }

    .chat-input-group button {
      background: var(--accent-green);
      color: #000;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }

    .reactions {
      display: flex;
      gap: 8px;
      margin-top: 10px;
      flex-wrap: wrap;
    }

    .react-btn {
      background: #1a263d;
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 6px 12px;
      border-radius: 15px;
      cursor: pointer;
      font-size: 0.85rem;
    }

    .react-btn:hover {
      background: var(--accent-blue);
      color: #000;
    }

    .floating-emoji {
      position: fixed;
      bottom: 20px;
      font-size: 2rem;
      animation: floatUp 2s linear forwards;
      pointer-events: none;
      z-index: 1000;
    }

    @keyframes floatUp {
      0% { transform: translateY(0); opacity: 1; }
      100% { transform: translateY(-300px); opacity: 0; }
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">⚽ ফুটবল ফ্যান জোন</div>
    <div class="controls">
      <button class="btn-sound" onclick="playSound('horn')">📢 হর্ন</button>
      <button class="btn-sound" onclick="playSound('whistle')">🏁 বাঁশি</button>
    </div>
  </header>

  <nav>
    <button class="nav-btn active" onclick="switchTab('tracker')">📺 লাইভ ট্র্যাকার</button>
    <button class="nav-btn" onclick="switchTab('chat')">💬 ফ্যান চ্যাট</button>
    <button class="nav-btn" onclick="switchTab('polls')">📊 প্রেডিকশন</button>
  </nav>

  <main>

    <!-- LIVE TRACKER TAB -->
    <div id="tracker" class="tab-content active">
      <div class="card">
        <div class="card-title">📡 রিয়েল-টাইম ফুটবল লাইভ স্কোর ট্র্যাকার</div>
        <div class="live-tracker-container">
          <iframe 
            src="https://www.scorespro.com/widgets/live-soccer/" 
            style="width: 100%; height: 100%; border: none;" 
            scrolling="yes">
          </iframe>
        </div>
      </div>
    </div>

    <!-- CHAT TAB -->
    <div id="chat" class="tab-content">
      <div class="card">
        <div class="card-title">💬 লাইভ ম্যাচ চ্যাট রুম</div>
        <div class="chat-box" id="chatBox">
          <div class="chat-message">
            <div class="chat-user">SuperFan_88</div>
            <div class="chat-text">আজকের ম্যাচে জয় নিশ্চিত! গোল কে করবে প্রথম?</div>
          </div>
          <div class="chat-message">
            <div class="chat-user">SambaMagic</div>
            <div class="chat-text">ব্রাজিল আজ ৩-০ গোলে জিতবে! 🇧🇷🔥</div>
          </div>
        </div>
        <div class="chat-input-group">
          <input type="text" id="chatInput" placeholder="আপনার বার্তা লিখুন...">
          <button onclick="sendMessage()">পাঠান</button>
        </div>
        <div class="reactions">
          <button class="react-btn" onclick="triggerFx('⚽')">⚽ গোল!</button>
          <button class="react-btn" onclick="triggerFx('🔥')">🔥 আগুন</button>
          <button class="react-btn" onclick="triggerFx('🟨')">🟨 কার্ড</button>
          <button class="react-btn" onclick="triggerFx('👏')">👏 তালি</button>
        </div>
      </div>
    </div>

    <!-- POLLS TAB -->
    <div id="polls" class="tab-content">
      <div class="card">
        <div class="card-title">📊 আজকের ম্যাচ প্রেডিকশন</div>
        <p style="margin-bottom: 12px; font-size: 0.95rem;">আজকের ম্যাচে জয়ী হবে কোন দল?</p>
        <button class="react-btn" style="width: 100%; margin-bottom: 8px; padding: 10px;" onclick="vote('brazil')">🇧🇷 ব্রাজিল</button>
        <button class="react-btn" style="width: 100%; margin-bottom: 8px; padding: 10px;" onclick="vote('argentina')">🇦🇷 আর্জেন্টিনা</button>
        <button class="react-btn" style="width: 100%; padding: 10px;" onclick="vote('draw')">🤝 ড্র</button>
      </div>
    </div>

  </main>

  <script>
    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
      
      document.getElementById(tabId).classList.add('active');
      event.target.classList.add('active');
    }

    function sendMessage() {
      const input = document.getElementById('chatInput');
      const text = input.value.trim();
      if (!text) return;

      const chatBox = document.getElementById('chatBox');
      const msgDiv = document.createElement('div');
      msgDiv.className = 'chat-message';
      msgDiv.innerHTML = `<div class="chat-user">আপনি</div><div class="chat-text">${text}</div>`;
      
      chatBox.appendChild(msgDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
      input.value = '';
    }

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    function playSound(type) {
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (type === 'whistle') {
        osc.frequency.setValueAtTime(2500, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.3);
      } else if (type === 'horn') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(200, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.8);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.8);
      }
    }

    function triggerFx(emoji) {
      const el = document.createElement('div');
      el.className = 'floating-emoji';
      el.innerText = emoji;
      el.style.left = (Math.random() * 80 + 10) + 'vw';
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 2000);
    }

    function vote(team) {
      alert('আপনার ভোটিং সফল হয়েছে!');
    }
  </script>

</body>
</html>
