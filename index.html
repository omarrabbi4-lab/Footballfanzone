<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Live Score ⚽🏏</title>

  <meta name="theme-color" content="#090912">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background:
        radial-gradient(circle at top, #24134d 0%, #090912 45%, #050509 100%);
      color: white;
      min-height: 100vh;
    }

    .app {
      max-width: 600px;
      margin: auto;
      padding: 18px;
    }

    /* HEADER */

    header {
      text-align: center;
      padding: 20px 10px 25px;
    }

    header h1 {
      font-size: 30px;
      margin-bottom: 7px;
    }

    header p {
      color: #aaa;
      font-size: 14px;
    }

    /* LIVE STATUS */

    .live-status {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 7px;
      margin-top: 12px;
      color: #62ff91;
      font-size: 13px;
    }

    .dot {
      width: 9px;
      height: 9px;
      background: #39ff72;
      border-radius: 50%;
      box-shadow: 0 0 12px #39ff72;
    }

    /* SPORTS TABS */

    .sports {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .sport-btn {
      flex: 1;
      border: none;
      padding: 14px 10px;
      border-radius: 15px;
      background: rgba(255,255,255,0.08);
      color: white;
      font-size: 15px;
      cursor: pointer;
      border: 1px solid rgba(255,255,255,0.08);
    }

    .sport-btn.active {
      background: linear-gradient(135deg, #ff4f91, #814cff);
      box-shadow: 0 8px 25px rgba(129,76,255,0.25);
    }

    /* FILTER */

    .filters {
      display: flex;
      gap: 8px;
      margin-bottom: 18px;
      overflow-x: auto;
    }

    .filter {
      white-space: nowrap;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.06);
      color: #ddd;
      padding: 9px 15px;
      border-radius: 20px;
      cursor: pointer;
    }

    .filter.active {
      background: rgba(255,79,145,0.18);
      color: #ff72aa;
      border-color: #ff4f91;
    }

    /* MATCH CARD */

    .match-card {
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 22px;
      padding: 18px;
      margin-bottom: 15px;
      backdrop-filter: blur(15px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    }

    .league {
      display: flex;
      justify-content: space-between;
      color: #aaa;
      font-size: 12px;
      margin-bottom: 18px;
    }

    .live {
      color: #ff4f6d;
      font-weight: bold;
    }

    .teams {
      display: flex;
      align-items: center;
      justify-content: space-between;
      text-align: center;
    }

    .team {
      width: 35%;
    }

    .team-icon {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: linear-gradient(135deg, #30204c, #151525);
      display: flex;
      justify-content: center;
      align-items: center;
      margin: auto auto 8px;
      font-size: 22px;
    }

    .team-name {
      font-size: 14px;
      line-height: 1.3;
    }

    .score {
      width: 30%;
    }

    .score-number {
      font-size: 27px;
      font-weight: bold;
    }

    .score-info {
      font-size: 11px;
      color: #aaa;
      margin-top: 4px;
    }

    .vs {
      font-size: 13px;
      color: #777;
    }

    /* FOOTBALL EVENT */

    .event {
      margin-top: 16px;
      padding-top: 13px;
      border-top: 1px solid rgba(255,255,255,0.08);
      color: #bbb;
      font-size: 12px;
      text-align: center;
    }

    /* EMPTY */

    .empty {
      text-align: center;
      padding: 50px 20px;
      color: #888;
    }

    .empty-icon {
      font-size: 45px;
      margin-bottom: 12px;
    }

    /* BOTTOM NAV */

    .bottom-nav {
      position: sticky;
      bottom: 10px;
      margin-top: 25px;
      display: flex;
      justify-content: space-around;
      background: rgba(15,15,25,0.92);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px;
      padding: 12px 5px;
      backdrop-filter: blur(15px);
    }

    .nav-item {
      text-align: center;
      color: #888;
      font-size: 11px;
    }

    .nav-item span {
      display: block;
      font-size: 20px;
      margin-bottom: 4px;
    }

    .nav-item.active {
      color: #ff5b9d;
    }

    /* LOADING */

    .loading {
      text-align: center;
      color: #aaa;
      padding: 30px;
    }

  </style>
</head>

<body>

<div class="app">

  <header>
    <h1>⚡ Live Score</h1>

    <p>Football & Cricket-এর লাইভ স্কোর</p>

    <div class="live-status">
      <span class="dot"></span>
      Live Score
    </div>
  </header>


  <!-- SPORTS -->

  <div class="sports">

    <button
      class="sport-btn active"
      onclick="changeSport('football', this)"
    >
      ⚽ Football
    </button>

    <button
      class="sport-btn"
      onclick="changeSport('cricket', this)"
    >
      🏏 Cricket
    </button>

  </div>


  <!-- FILTER -->

  <div class="filters">

    <button class="filter active">
      🔴 Live
    </button>

    <button class="filter">
      📅 Upcoming
    </button>

    <button class="filter">
      ✅ Finished
    </button>

  </div>


  <!-- MATCH AREA -->

  <div id="matches">

    <!-- DEMO FOOTBALL MATCH -->

    <div class="match-card">

      <div class="league">
        <span>Premier League</span>
        <span class="live">● LIVE</span>
      </div>

      <div class="teams">

        <div class="team">

          <div class="team-icon">
            ⚽
          </div>

          <div class="team-name">
            Team A
          </div>

        </div>


        <div class="score">

          <div class="score-number">
            2 - 1
          </div>

          <div class="score-info">
            67'
          </div>

        </div>


        <div class="team">

          <div class="team-icon">
            ⚽
          </div>

          <div class="team-name">
            Team B
          </div>

        </div>

      </div>


      <div class="event">
        ⚽ 45' Team A &nbsp; • &nbsp; ⚽ 63' Team A
      </div>

    </div>


    <!-- DEMO CRICKET -->

    <div class="match-card">

      <div class="league">
        <span>International Cricket</span>
        <span class="live">● LIVE</span>
      </div>

      <div class="teams">

        <div class="team">

          <div class="team-icon">
            🏏
          </div>

          <div class="team-name">
            Bangladesh
          </div>

        </div>


        <div class="score">

          <div class="score-number">
            156/4
          </div>

          <div class="score-info">
            18.2 Overs
          </div>

        </div>


        <div class="team">

          <div class="team-icon">
            🏏
          </div>

          <div class="team-name">
            India
          </div>

        </div>

      </div>


      <div class="event">
        Bangladesh batting
      </div>

    </div>

  </div>


  <!-- BOTTOM NAV -->

  <div class="bottom-nav">

    <div class="nav-item active">
      <span>🏠</span>
      Home
    </div>

    <div class="nav-item">
      <span>⚽</span>
      Football
    </div>

    <div class="nav-item">
      <span>🏏</span>
      Cricket
    </div>

    <div class="nav-item">
      <span>❤️</span>
      Favorites
    </div>

  </div>

</div>


<script>

let currentSport = "football";


function changeSport(sport, button) {

  currentSport = sport;

  document
    .querySelectorAll(".sport-btn")
    .forEach(btn => {
      btn.classList.remove("active");
    });

  button.classList.add("active");

  const matches = document.getElementById("matches");

  if (sport === "football") {

    matches.innerHTML = `

      <div class="match-card">

        <div class="league">
          <span>Premier League</span>
          <span class="live">● LIVE</span>
        </div>

        <div class="teams">

          <div class="team">

            <div class="team-icon">
              ⚽
            </div>

            <div class="team-name">
              Team A
            </div>

          </div>

          <div class="score">

            <div class="score-number">
              2 - 1
            </div>

            <div class="score-info">
              67'
            </div>

          </div>

          <div class="team">

            <div class="team-icon">
              ⚽
            </div>

            <div class="team-name">
              Team B
            </div>

          </div>

        </div>

        <div class="event">
          ⚽ Live match চলছে
        </div>

      </div>

    `;

  }


  if (sport === "cricket") {

    matches.innerHTML = `

      <div class="match-card">

        <div class="league">
          <span>International Cricket</span>
          <span class="live">● LIVE</span>
        </div>

        <div class="teams">

          <div class="team">

            <div class="team-icon">
              🏏
            </div>

            <div class="team-name">
              Bangladesh
            </div>

          </div>

          <div class="score">

            <div class="score-number">
              156/4
            </div>

            <div class="score-info">
              18.2 Overs
            </div>

          </div>

          <div class="team">

            <div class="team-icon">
              🏏
            </div>

            <div class="team-name">
              India
            </div>

          </div>

        </div>

        <div class="event">
          🏏 Bangladesh batting
        </div>

      </div>

    `;

  }

}

</script>

</body>
</html>
