<!DOCTYPE html>
<html lang="bn">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1.0"
>

<meta
  name="theme-color"
  content="#07111f"
>

<title>Football Fan Zone</title>

<style>

/* =========================================
   RESET
========================================= */

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}


/* =========================================
   THEME VARIABLES
========================================= */

:root{

  --bg:#07111f;

  --bg2:#0b1729;

  --card:rgba(16,30,50,.88);

  --card2:#12223a;

  --border:rgba(115,170,255,.16);

  --text:#f7fbff;

  --muted:#8fa4bd;

  --primary:#00b7ff;

  --secondary:#705cff;

  --green:#39e58c;

  --red:#ff536f;

  --yellow:#ffd35a;

  --shadow:0 15px 40px rgba(0,0,0,.28);

}


body.light{

  --bg:#eef5fc;

  --bg2:#dce9f7;

  --card:rgba(255,255,255,.88);

  --card2:#ffffff;

  --border:rgba(40,90,140,.13);

  --text:#102033;

  --muted:#63758a;

  --shadow:0 15px 35px rgba(40,80,120,.13);

}


/* =========================================
   BODY
========================================= */

body{

  font-family:
    Arial,
    "Noto Sans Bengali",
    sans-serif;

  background:

    radial-gradient(
      circle at 10% 0%,
      rgba(0,183,255,.16),
      transparent 30%
    ),

    radial-gradient(
      circle at 90% 10%,
      rgba(112,92,255,.18),
      transparent 32%
    ),

    linear-gradient(
      180deg,
      var(--bg2),
      var(--bg)
    );

  color:var(--text);

  min-height:100vh;

  transition:
    background .3s,
    color .3s;

}


/* =========================================
   HEADER
========================================= */

.header{

  position:relative;

  padding:
    25px
    18px
    18px;

  text-align:center;

}


.logo{

  font-size:31px;

  font-weight:900;

  letter-spacing:-1px;

}


.logo span{

  background:

    linear-gradient(
      90deg,
      var(--primary),
      #7a65ff
    );

  -webkit-background-clip:text;

  color:transparent;

}


.subtitle{

  color:var(--muted);

  font-size:13px;

  margin-top:7px;

}


.header-actions{

  position:absolute;

  right:15px;

  top:20px;

  display:flex;

  gap:8px;

}


.icon-btn{

  width:40px;

  height:40px;

  border:1px solid var(--border);

  border-radius:13px;

  background:var(--card);

  color:var(--text);

  font-size:18px;

  cursor:pointer;

}


/* =========================================
   TABS
========================================= */

.tabs{

  display:flex;

  gap:10px;

  padding:
    5px
    15px
    12px;

  max-width:760px;

  margin:auto;

}


.tab{

  flex:1;

  border:1px solid var(--border);

  padding:14px;

  border-radius:17px;

  background:var(--card);

  color:var(--muted);

  font-size:16px;

  font-weight:800;

  cursor:pointer;

  transition:.2s;

}


.tab.active{

  background:

    linear-gradient(
      135deg,
      var(--primary),
      var(--secondary)
    );

  color:#fff;

  border-color:transparent;

  box-shadow:
    0 10px 25px
    rgba(0,160,255,.2);

}


/* =========================================
   SEARCH
========================================= */

.search-box{

  max-width:760px;

  margin:auto;

  padding:
    4px
    15px
    12px;

}


.search{

  width:100%;

  border:1px solid var(--border);

  background:var(--card);

  color:var(--text);

  border-radius:15px;

  padding:13px 15px;

  outline:none;

  font-size:14px;

}


.search::placeholder{

  color:var(--muted);

}


/* =========================================
   FILTERS
========================================= */

.filters{

  display:flex;

  gap:8px;

  overflow-x:auto;

  padding:
    4px
    15px
    15px;

  max-width:760px;

  margin:auto;

}


.filter{

  white-space:nowrap;

  border:1px solid var(--border);

  background:var(--card);

  color:var(--muted);

  padding:
    9px
    15px;

  border-radius:20px;

  font-size:13px;

  cursor:pointer;

}


.filter.active{

  background:

    linear-gradient(
      135deg,
      rgba(0,183,255,.22),
      rgba(112,92,255,.25)
    );

  color:var(--text);

  border-color:
    rgba(0,183,255,.5);

}


/* =========================================
   INFO BAR
========================================= */

.info-bar{

  max-width:760px;

  margin:auto;

  padding:
    0
    15px
    12px;

  display:flex;

  justify-content:space-between;

  align-items:center;

  color:var(--muted);

  font-size:11px;

}


/* =========================================
   CONTAINER
========================================= */

.container{

  max-width:760px;

  margin:auto;

  padding:
    0
    15px
    100px;

}


/* =========================================
   STATUS
========================================= */

.status{

  text-align:center;

  color:var(--muted);

  padding:30px;

}


.loading{

  animation:
    pulse 1.2s infinite;

}


@keyframes pulse{

  0%{
    opacity:.4;
  }

  50%{
    opacity:1;
  }

  100%{
    opacity:.4;
  }

}


/* =========================================
   MATCH CARD
========================================= */

.card{

  background:var(--card);

  border:
    1px solid
    var(--border);

  border-radius:20px;

  padding:16px;

  margin-bottom:13px;

  box-shadow:var(--shadow);

  backdrop-filter:
    blur(16px);

  cursor:pointer;

  transition:
    transform .18s,
    border .18s;

}


.card:active{

  transform:scale(.985);

}


.competition{

  display:flex;

  align-items:center;

  gap:8px;

  color:var(--muted);

  font-size:12px;

  margin-bottom:15px;

}


.competition img{

  width:23px;

  height:23px;

  object-fit:contain;

}


.favorite{

  margin-left:auto;

  border:0;

  background:transparent;

  color:#68788d;

  font-size:20px;

  cursor:pointer;

}


.favorite.active{

  color:#ffd34e;

}


/* =========================================
   MATCH
========================================= */

.match{

  display:grid;

  grid-template-columns:
    1fr
    90px
    1fr;

  align-items:center;

  gap:7px;

}


.team{

  text-align:center;

}


.team img{

  width:52px;

  height:52px;

  object-fit:contain;

  margin-bottom:8px;

}


.team-name{

  font-size:14px;

  font-weight:800;

  line-height:1.35;

}


.center{

  text-align:center;

}


.score{

  font-size:24px;

  font-weight:900;

}


.match-status{

  display:inline-block;

  margin-top:7px;

  padding:
    4px
    8px;

  border-radius:10px;

  background:rgba(120,140,170,.12);

  color:var(--muted);

  font-size:10px;

}


.match-status.live{

  background:
    rgba(57,229,140,.13);

  color:var(--green);

}


.match-status.finished{

  color:var(--muted);

}


.match-status.upcoming{

  color:var(--yellow);

}


.match-time{

  margin-top:6px;

  color:var(--muted);

  font-size:10px;

}


/* =========================================
   EMPTY
========================================= */

.empty{

  text-align:center;

  color:var(--muted);

  padding:55px 15px;

}


.empty-icon{

  font-size:45px;

  margin-bottom:12px;

}


/* =========================================
   ERROR
========================================= */

.error{

  text-align:center;

  color:#ff7185;

  padding:35px 10px;

}


/* =========================================
   FLOAT BUTTON
========================================= */

.refresh{

  position:fixed;

  right:20px;

  bottom:22px;

  width:58px;

  height:58px;

  border:0;

  border-radius:50%;

  background:

    linear-gradient(
      135deg,
      var(--primary),
      var(--secondary)
    );

  color:white;

  font-size:25px;

  box-shadow:
    0 10px 30px
    rgba(0,160,255,.28);

  cursor:pointer;

}


/* =========================================
   MODAL
========================================= */

.modal{

  position:fixed;

  inset:0;

  background:
    rgba(0,0,0,.68);

  display:none;

  align-items:flex-end;

  justify-content:center;

  z-index:1000;

  padding:0;

}


.modal.show{

  display:flex;

}


.modal-box{

  width:100%;

  max-width:760px;

  max-height:88vh;

  overflow:auto;

  background:

    linear-gradient(
      180deg,
      var(--card2),
      var(--bg2)
    );

  border-radius:
    25px
    25px
    0
    0;

  padding:22px 18px 30px;

  border:
    1px solid
    var(--border);

}


.modal-head{

  display:flex;

  justify-content:space-between;

  align-items:center;

  margin-bottom:20px;

}


.modal-title{

  font-size:18px;

  font-weight:800;

}


.close{

  width:38px;

  height:38px;

  border:0;

  border-radius:12px;

  background:rgba(120,140,170,.12);

  color:var(--text);

  font-size:20px;

}


.detail-competition{

  text-align:center;

  color:var(--muted);

  font-size:13px;

  margin-bottom:20px;

}


.detail-teams{

  display:grid;

  grid-template-columns:
    1fr
    80px
    1fr;

  align-items:center;

  gap:10px;

}


.detail-team{

  text-align:center;

}


.detail-team img{

  width:72px;

  height:72px;

  object-fit:contain;

  margin-bottom:10px;

}


.detail-team-name{

  font-weight:800;

  line-height:1.4;

}


.detail-score{

  text-align:center;

  font-size:29px;

  font-weight:900;

}


.detail-status{

  text-align:center;

  margin-top:8px;

  color:var(--green);

  font-size:12px;

}


.details-list{

  margin-top:25px;

  display:grid;

  gap:9px;

}


.detail-row{

  display:flex;

  justify-content:space-between;

  gap:10px;

  padding:13px;

  border-radius:13px;

  background:rgba(120,140,170,.08);

}


.detail-label{

  color:var(--muted);

}


.detail-value{

  font-weight:700;

  text-align:right;

}


/* =========================================
   MODAL BUTTON
========================================= */

.visit-btn{

  display:block;

  text-align:center;

  margin-top:17px;

  padding:13px;

  border-radius:14px;

  text-decoration:none;

  color:#fff;

  background:

    linear-gradient(
      135deg,
      var(--primary),
      var(--secondary)
    );

  font-weight:800;

}


/* =========================================
   BOTTOM NAV
========================================= */

.bottom-nav{

  position:fixed;

  bottom:0;

  left:0;

  right:0;

  z-index:500;

  display:flex;

  justify-content:center;

  padding:8px 12px;

  background:
    rgba(7,17,31,.88);

  backdrop-filter:
    blur(18px);

  border-top:
    1px solid
    var(--border);

}


body.light .bottom-nav{

  background:
    rgba(255,255,255,.9);

}


.nav-inner{

  width:100%;

  max-width:760px;

  display:flex;

  justify-content:space-around;

}


.nav-btn{

  border:0;

  background:transparent;

  color:var(--muted);

  font-size:11px;

  padding:5px 12px;

}


.nav-btn.active{

  color:var(--primary);

}


</style>

</head>


<body>


<!-- =====================================
     HEADER
===================================== -->

<header class="header">

  <div class="header-actions">

    <button
      class="icon-btn"
      onclick="toggleTheme()"
      id="themeBtn"
    >
      🌙
    </button>

  </div>


  <div class="logo">

    ⚡ <span>Football Fan Zone</span>

  </div>


  <div class="subtitle">

    Football & Cricket Live Scores

  </div>

</header>



<!-- =====================================
     SPORT TABS
===================================== -->

<div class="tabs">

  <button
    id="footballTab"
    class="tab active"
    onclick="changeSport('football')"
  >

    ⚽ Football

  </button>


  <button
    id="cricketTab"
    class="tab"
    onclick="changeSport('cricket')"
  >

    🏏 Cricket

  </button>

</div>



<!-- =====================================
     SEARCH
===================================== -->

<div class="search-box">

  <input
    id="searchInput"
    class="search"
    type="search"
    placeholder="🔎 Team বা competition খুঁজুন..."
    oninput="applySearch()"
  >

</div>



<!-- =====================================
     FILTERS
===================================== -->

<div class="filters">

  <button
    id="liveFilter"
    class="filter active"
    onclick="changeFilter('live')"
  >
    🔴 Live
  </button>


  <button
    id="upcomingFilter"
    class="filter"
    onclick="changeFilter('upcoming')"
  >
    🕐 Upcoming
  </button>


  <button
    id="finishedFilter"
    class="filter"
    onclick="changeFilter('finished')"
  >
    ✅ Finished
  </button>


  <button
    id="favoriteFilter"
    class="filter"
    onclick="changeFilter('favorite')"
  >
    ⭐ Favorites
  </button>

</div>



<!-- =====================================
     INFO
===================================== -->

<div class="info-bar">

  <span id="matchCount">
    0 ম্যাচ
  </span>


  <span id="updated">
    আপডেট হয়নি
  </span>

</div>



<!-- =====================================
     MATCHES
===================================== -->

<main class="container">

  <div
    id="status"
    class="status loading"
  >
    স্কোর লোড হচ্ছে...
  </div>


  <div id="matches"></div>

</main>



<!-- =====================================
     REFRESH
===================================== -->

<button
  class="refresh"
  onclick="loadScores()"
>
  ↻
</button>



<!-- =====================================
     DETAILS MODAL
===================================== -->

<div
  id="modal"
  class="modal"
  onclick="closeModalOutside(event)"
>

  <div class="modal-box">

    <div class="modal-head">

      <div class="modal-title">
        Match Details
      </div>


      <button
        class="close"
        onclick="closeModal()"
      >
        ×
      </button>

    </div>


    <div id="modalContent"></div>

  </div>

</div>



<!-- =====================================
     BOTTOM NAV
===================================== -->

<div class="bottom-nav">

  <div class="nav-inner">

    <button
      class="nav-btn active"
      onclick="scrollTopPage()"
    >
      🏠<br>
      Home
    </button>


    <button
      class="nav-btn"
      onclick="changeFilter('live')"
    >
      🔴<br>
      Live
    </button>


    <button
      class="nav-btn"
      onclick="changeFilter('favorite')"
    >
      ⭐<br>
      Favorites
    </button>


    <button
      class="nav-btn"
      onclick="loadScores()"
    >
      🔄<br>
      Refresh
    </button>

  </div>

</div>



<script>


/* =========================================
   VARIABLES
========================================= */

let currentSport =
  "football";


let currentFilter =
  "live";


let allMatches =
  [];


let favorites =
  JSON.parse(
    localStorage.getItem(
      "footballFanFavorites"
    ) || "[]"
  );


/* =========================================
   THEME
========================================= */

function toggleTheme(){

  document.body.classList.toggle(
    "light"
  );


  const light =
    document.body.classList.contains(
      "light"
    );


  localStorage.setItem(
    "fanZoneTheme",
    light
      ? "light"
      : "dark"
  );


  document.getElementById(
    "themeBtn"
  ).textContent =
    light
      ? "☀️"
      : "🌙";

}


(function loadTheme(){

  const theme =
    localStorage.getItem(
      "fanZoneTheme"
    );


  if(theme === "light"){

    document.body.classList.add(
      "light"
    );


    document.getElementById(
      "themeBtn"
    ).textContent =
      "☀️";

  }

})();


/* =========================================
   SPORT
========================================= */

function changeSport(
  sport
){

  currentSport =
    sport;


  currentFilter =
    "live";


  document
    .getElementById(
      "footballTab"
    )
    .classList
    .toggle(
      "active",
      sport === "football"
    );


  document
    .getElementById(
      "cricketTab"
    )
    .classList
    .toggle(
      "active",
      sport === "cricket"
    );


  document
    .querySelectorAll(
      ".filter"
    )
    .forEach(
      b =>
        b.classList.remove(
          "active"
        )
    );


  document
    .getElementById(
      "liveFilter"
    )
    .classList.add(
      "active"
    );


  loadScores();

}


/* =========================================
   FILTER
========================================= */

function changeFilter(
  filter
){

  currentFilter =
    filter;


  document
    .querySelectorAll(
      ".filter"
    )
    .forEach(
      b =>
        b.classList.remove(
          "active"
        )
    );


  const id =
    filter === "live"
      ? "liveFilter"
      : filter === "upcoming"
      ? "upcomingFilter"
      : filter === "finished"
      ? "finishedFilter"
      : "favoriteFilter";


  document
    .getElementById(id)
    .classList
    .add("active");


  renderMatches();

}


/* =========================================
   DATE
========================================= */

function formatDate(
  date
){

  if(!date){
    return "";
  }


  const d =
    new Date(date);


  if(
    isNaN(
      d.getTime()
    )
  ){

    return date;

  }


  return d.toLocaleString(
    "bn-BD",
    {
      day:"numeric",
      month:"short",
      year:"numeric",
      hour:"numeric",
      minute:"2-digit"
    }
  );

}


/* =========================================
   ESCAPE
========================================= */

function escapeHTML(
  value
){

  return String(
    value ?? ""
  )

  .replace(
    /&/g,
    "&amp;"
  )

  .replace(
    /</g,
    "&lt;"
  )

  .replace(
    />/g,
    "&gt;"
  )

  .replace(
    /"/g,
    "&quot;"
  )

  .replace(
    /'/g,
    "&#039;"
  );

}


/* =========================================
   FAVORITE ID
========================================= */

function getMatchId(
  match
){

  return (

    match.url ||

    (
      String(
        match.home
      )
      +
      "_"
      +
      String(
        match.away
      )
      +
      "_"
      +
      String(
        match.time
      )
    )

  );

}


/* =========================================
   FAVORITE
========================================= */

function isFavorite(
  match
){

  return favorites.includes(
    getMatchId(match)
  );

}


function toggleFavorite(
  event,
  matchIndex
){

  event.stopPropagation();


  const match =
    allMatches[
      matchIndex
    ];


  const id =
    getMatchId(match);


  if(
    favorites.includes(id)
  ){

    favorites =
      favorites.filter(
        x => x !== id
      );

  }

  else{

    favorites.push(id);

  }


  localStorage.setItem(
    "footballFanFavorites",
    JSON.stringify(
      favorites
    )
  );


  renderMatches();

}


/* =========================================
   SEARCH
========================================= */

function applySearch(){

  renderMatches();

}


function getSearchText(){

  return (
    document
      .getElementById(
        "searchInput"
      )
      .value
      .trim()
      .toLowerCase()
  );

}


/* =========================================
   FILTER MATCHES
========================================= */

function getVisibleMatches(){

  let matches =
    [...allMatches];


  if(
    currentFilter === "live"
  ){

    matches =
      matches.filter(
        match =>
          String(
            match.status || ""
          )
          .toLowerCase()
          === "live"
      );

  }


  else if(
    currentFilter === "upcoming"
  ){

    matches =
      matches.filter(
        match =>
          String(
            match.status || ""
          )
          .toLowerCase()
          === "upcoming"
      );

  }


  else if(
    currentFilter === "finished"
  ){

    matches =
      matches.filter(
        match =>
          String(
            match.status || ""
          )
          .toLowerCase()
          === "finished"
      );

  }


  else if(
    currentFilter === "favorite"
  ){

    matches =
      matches.filter(
        match =>
          isFavorite(match)
      );

  }


  const search =
    getSearchText();


  if(search){

    matches =
      matches.filter(
        match => {

          const text = (

            String(
              match.home || ""
            )
            +
            " "
            +
            String(
              match.away || ""
            )
            +
            " "
            +
            String(
              match.competition || ""
            )

          ).toLowerCase();


          return text.includes(
            search
          );

        }
      );

  }


  return matches;

}


/* =========================================
   CREATE CARD
========================================= */

function createCard(
  match
){

  const home =
    match.home ||
    "Home";


  const away =
    match.away ||
    "Away";


  const homeLogo =
    match.home_logo ||
    "";


  const awayLogo =
    match.away_logo ||
    "";


  const homeScore =
    match.home_score ??
    "-";


  const awayScore =
    match.away_score ??
    "-";


  const status =
    String(
      match.status || ""
    )
    .toLowerCase();


  const statusText =
    match.status_text ||
    "Unknown";


  const competition =
    match.competition ||
    (
      currentSport ===
      "football"
      ? "Football"
      : "Cricket"
    );


  const competitionLogo =
    match.competition_logo ||
    "";


  const favorite =
    isFavorite(match);


  let statusClass =
    "";


  if(
    status === "live"
  ){

    statusClass =
      "live";

  }

  else if(
    status === "finished"
  ){

    statusClass =
      "finished";

  }

  else if(
    status === "upcoming"
  ){

    statusClass =
      "upcoming";

  }


  const index =
    allMatches.indexOf(
      match
    );


  const card =
    document.createElement(
      "div"
    );


  card.className =
    "card";


  card.onclick =
    () =>
      openDetails(match);


  card.innerHTML = `

    <div class="competition">

      ${
        competitionLogo
        ?
        `
        <img
          src="${escapeHTML(
            competitionLogo
          )}"
          onerror="
            this.style.display='none'
          "
        >
        `
        :
        ""
      }


      <span>
        ${escapeHTML(
          competition
        )}
      </span>


      <button
        class="
          favorite
          ${favorite ? "active" : ""}
        "
        onclick="
          toggleFavorite(
            event,
            ${index}
          )
        "
      >
        ${favorite ? "★" : "☆"}
      </button>

    </div>


    <div class="match">


      <div class="team">

        ${
          homeLogo
          ?
          `
          <img
            src="${escapeHTML(
              homeLogo
            )}"
            onerror="
              this.style.display='none'
            "
          >
          `
          :
          ""
        }


        <div class="team-name">

          ${escapeHTML(home)}

        </div>

      </div>



      <div class="center">

        <div class="score">

          ${escapeHTML(
            homeScore
          )}

          -

          ${escapeHTML(
            awayScore
          )}

        </div>


        <div
          class="
            match-status
            ${statusClass}
          "
        >

          ${
            status === "live"
            ? "🔴 LIVE"
            : escapeHTML(
                statusText
              )
          }

        </div>


        <div class="match-time">

          ${escapeHTML(
            formatDate(
              match.time
            )
          )}

        </div>

      </div>



      <div class="team">

        ${
          awayLogo
          ?
          `
          <img
            src="${escapeHTML(
              awayLogo
            )}"
            onerror="
              this.style.display='none'
            "
          >
          `
          :
          ""
        }


        <div class="team-name">

          ${escapeHTML(away)}

        </div>

      </div>


    </div>

  `;


  return card;

}


/* =========================================
   RENDER
========================================= */

function renderMatches(){

  const box =
    document.getElementById(
      "matches"
    );


  box.innerHTML =
    "";


  const matches =
    getVisibleMatches();


  document.getElementById(
    "matchCount"
  )
  .textContent =
    matches.length +
    " ম্যাচ";


  if(!matches.length){

    let message =
      "কোনো ম্যাচ পাওয়া যায়নি।";


    if(
      currentFilter === "live"
    ){

      message =
        "এই মুহূর্তে কোনো LIVE ম্যাচ নেই।";

    }


    if(
      currentFilter === "upcoming"
    ){

      message =
        "কোনো Upcoming ম্যাচ নেই।";

    }


    if(
      currentFilter === "finished"
    ){

      message =
        "কোনো Finished ম্যাচ নেই।";

    }


    if(
      currentFilter === "favorite"
    ){

      message =
        "আপনার কোনো Favorite ম্যাচ নেই।";

    }


    box.innerHTML = `

      <div class="empty">

        <div class="empty-icon">
          📭
        </div>

        ${message}

      </div>

    `;


    return;

  }


  matches.forEach(
    match =>
      box.appendChild(
        createCard(match)
      )
  );

}


/* =========================================
   DETAILS
========================================= */

function openDetails(
  match
){

  const modal =
    document.getElementById(
      "modal"
    );


  const content =
    document.getElementById(
      "modalContent"
    );


  const status =
    String(
      match.status || ""
    )
    .toLowerCase();


  const statusText =
    match.status_text ||
    "Unknown";


  const homeScore =
    match.home_score ??
    "-";


  const awayScore =
    match.away_score ??
    "-";


  const favorite =
    isFavorite(match);


  content.innerHTML = `

    <div class="detail-competition">

      ${escapeHTML(
        match.competition ||
        currentSport
      )}

    </div>


    <div class="detail-teams">


      <div class="detail-team">

        ${
          match.home_logo
          ?
          `
          <img
            src="${escapeHTML(
              match.home_logo
            )}"
            onerror="
              this.style.display='none'
            "
          >
          `
          :
          ""
        }


        <div
          class="detail-team-name"
        >

          ${escapeHTML(
            match.home ||
            "Home"
          )}

        </div>

      </div>



      <div>

        <div class="detail-score">

          ${escapeHTML(
            homeScore
          )}

          -

          ${escapeHTML(
            awayScore
          )}

        </div>


        <div
          class="detail-status"
        >

          ${
            status === "live"
            ? "🔴 LIVE"
            : escapeHTML(
                statusText
              )
          }

        </div>

      </div>



      <div class="detail-team">

        ${
          match.away_logo
          ?
          `
          <img
            src="${escapeHTML(
              match.away_logo
            )}"
            onerror="
              this.style.display='none'
            "
          >
          `
          :
          ""
        }


        <div
          class="detail-team-name"
        >

          ${escapeHTML(
            match.away ||
            "Away"
          )}

        </div>

      </div>


    </div>



    <div class="details-list">


      <div class="detail-row">

        <span class="detail-label">
          🏆 Competition
        </span>

        <span class="detail-value">

          ${escapeHTML(
            match.competition ||
            "-"
          )}

        </span>

      </div>



      <div class="detail-row">

        <span class="detail-label">
          📌 Status
        </span>

        <span class="detail-value">

          ${escapeHTML(
            statusText
          )}

        </span>

      </div>



      <div class="detail-row">

        <span class="detail-label">
          🕐 Match Time
        </span>

        <span class="detail-value">

          ${escapeHTML(
            formatDate(
              match.time
            )
          )}

        </span>

      </div>



      <div class="detail-row">

        <span class="detail-label">
          ⭐ Favorite
        </span>

        <span class="detail-value">

          ${favorite
            ? "Yes ⭐"
            : "No"
          }

        </span>

      </div>


    </div>


    ${
      match.url
      ?
      `
      <a
        class="visit-btn"
        href="${escapeHTML(
          match.url
        )}"
        target="_blank"
        rel="noopener"
      >
        📊 Match Page
      </a>
      `
      :
      ""
    }

  `;


  modal.classList.add(
    "show"
  );

}


/* =========================================
   CLOSE MODAL
========================================= */

function closeModal(){

  document
    .getElementById(
      "modal"
    )
    .classList
    .remove(
      "show"
    );

}


function closeModalOutside(
  event
){

  if(
    event.target.id ===
    "modal"
  ){

    closeModal();

  }

}


/* =========================================
   LOAD SCORES
========================================= */

async function loadScores(){

  const statusBox =
    document.getElementById(
      "status"
    );


  statusBox.style.display =
    "block";


  statusBox.classList.add(
    "loading"
  );


  statusBox.textContent =
    currentSport ===
    "football"
    ?
    "⚽ Football স্কোর লোড হচ্ছে..."
    :
    "🏏 Cricket স্কোর লোড হচ্ছে...";


  try{

    const response =
      await fetch(
        `/api/${currentSport}`,
        {
          cache:"no-store"
        }
      );


    if(!response.ok){

      throw new Error(
        "HTTP " +
        response.status
      );

    }


    const data =
      await response.json();


    allMatches =
      Array.isArray(
        data.matches
      )
      ?
      data.matches
      :
      [];


    statusBox.style.display =
      "none";


    statusBox.classList.remove(
      "loading"
    );


    document.getElementById(
      "updated"
    )
    .textContent =
      "আপডেট: " +
      new Date()
        .toLocaleTimeString(
          "bn-BD",
          {
            hour:"numeric",
            minute:"2-digit"
          }
        );


    renderMatches();

  }


  catch(error){

    console.error(
      error
    );


    statusBox.style.display =
      "none";


    statusBox.classList.remove(
      "loading"
    );


    document.getElementById(
      "matches"
    )
    .innerHTML = `

      <div class="error">

        ⚠️ স্কোর লোড করা যাচ্ছে না।

        <br><br>

        ইন্টারনেট সংযোগ অথবা
        সার্ভার পরীক্ষা করুন।

      </div>

    `;

  }

}


/* =========================================
   SCROLL TOP
========================================= */

function scrollTopPage(){

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* =========================================
   START
========================================= */

loadScores();


/* =========================================
   AUTO REFRESH
========================================= */

setInterval(
  loadScores,
  30000
);


/* =========================================
   ESC KEY
========================================= */

document.addEventListener(
  "keydown",
  event => {

    if(
      event.key ===
      "Escape"
    ){

      closeModal();

    }

  }
);

</script>
